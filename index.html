<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metriq KFZ - Partner Netzwerk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: white;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">
    <main class="flex-grow flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-6xl font-black mb-6 italic uppercase tracking-tighter">
            Metriq <span class="text-red-600">KFZ</span>
        </h1>
        <p class="text-slate-400 text-xl max-w-lg mb-12">
            Zentrale Verwaltung für erstklassige KFZ-Werkstatt Webseiten.
        </p>

        <div id="workshop-list" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
            <!-- Hier werden automatisch generierte Links hinführen -->
            <div class="bg-slate-800/50 p-8 rounded-3xl border border-slate-700">
                <p class="text-slate-500 italic">Noch keine Webseiten veröffentlicht.</p>
            </div>
        </div>
    </main>

    <footer class="p-8 text-center text-slate-600 text-xs font-bold uppercase tracking-widest">
        © 2026 METRIQ. ALL RIGHTS RESERVED.
    </footer>
</body>

</html>
