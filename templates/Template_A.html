<!DOCTYPE html>
<html class="light" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>KFZ Meisterbetrieb | Zuverlässig & Fair</title>

    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary-color: #dc2626;
            --bg-light: #f9fafb;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .simple-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .simple-card {
            transition: transform 0.2s ease;
        }

        .simple-card:hover {
            transform: translateY(-4px);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "KFZ Meisterbetrieb Schmidt",
                shortName: "Schmidt",
                tagline: "Ihr zuverlässiger Partner seit 1998",
                primaryColor: "#dc2626"
            },
            hero: {
                title: "Faire Preise. Ehrliche Arbeit.",
                subtitle: "Meisterbetrieb in Hamburg",
                desc: "Seit über 25 Jahren Ihr verlässlicher Partner für alle Reparaturen und Wartungen. Ohne Schnickschnack, dafür mit Herz und Verstand.",
                image: "../images/mocks/main.avif"
            },
            services: [
                { title: "Inspektion", icon: "build", desc: "Wartung nach Herstellervorgaben", price: "ab 89€", image: "../images/mocks/inspektion.avif" },
                { title: "Diagnose", icon: "memory", desc: "Computer-Fehlerauslese", price: "ab 49€", image: "../images/mocks/diagnose.avif" },
                { title: "Reifenservice", icon: "tire_repair", desc: "Wechsel & Einlagerung", price: "ab 39€", image: "../images/mocks/reifenservice.avif" },
                { title: "Bremsen", icon: "speed", desc: "Prüfung & Reparatur", price: "ab 119€", image: "../images/mocks/bremse.avif" }
            ],
            contact: {
                phone: "+49 40 123 456 78",
                address: "Werkstattstraße 12, 22765 Hamburg",
                hours: "Mo-Fr: 08:00 - 18:00 Uhr, Sa: 09:00 - 13:00 Uhr"
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`sticky top-0 z-50 bg-white transition-all duration-300 ${scrolled ? 'shadow-md' : ''}`}>
                    <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-red-600 text-white flex items-center justify-center font-bold text-sm rounded">
                                KFZ
                            </div>
                            <div>
                                <div className="font-bold text-lg leading-tight">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="hidden md:flex items-center gap-6">
                            <a href="#services" className="text-sm font-semibold hover:text-red-600 transition-colors">Leistungen</a>
                            <a href="#contact" className="bg-red-600 text-white px-5 py-2 rounded text-sm font-bold hover:bg-red-700 transition-colors">Kontakt</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="bg-white">
                <div className="max-w-6xl mx-auto px-4 py-16 md:py-24">
                    <div className="grid md:grid-cols-2 gap-12 items-center">
                        <div>
                            <div className="inline-block bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold uppercase mb-6">
                                Meisterbetrieb
                            </div>
                            <h1 className="text-4xl md:text-6xl font-bold leading-tight mb-6">
                                {CONFIG.hero.title}
                            </h1>
                            <p className="text-xl text-gray-600 mb-4 font-medium">{CONFIG.hero.subtitle}</p>
                            <p className="text-gray-600 mb-8 leading-relaxed">{CONFIG.hero.desc}</p>

                            <div className="flex flex-col sm:flex-row gap-4 mb-12">
                                <a href="#contact" className="bg-red-600 text-white px-8 py-4 rounded-lg font-bold text-center hover:bg-red-700 transition-colors">
                                    Termin vereinbaren
                                </a>
                                <a href={`tel:${CONFIG.contact.phone}`} className="border-2 border-gray-300 px-8 py-4 rounded-lg font-bold text-center hover:border-red-600 hover:text-red-600 transition-colors">
                                    {CONFIG.contact.phone}
                                </a>
                            </div>

                            {/* Trust Indicators */}
                            <div className="flex gap-8 pt-8 border-t border-gray-200">
                                <div>
                                    <div className="text-2xl font-bold text-red-600">25+</div>
                                    <div className="text-sm text-gray-600">Jahre Erfahrung</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-red-600">100%</div>
                                    <div className="text-sm text-gray-600">Meisterqualität</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-red-600">Fair</div>
                                    <div className="text-sm text-gray-600">Festpreise</div>
                                </div>
                            </div>
                        </div>

                        <div className="relative">
                            <div className="rounded-2xl overflow-hidden simple-shadow">
                                <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Werkstatt" />
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-20 bg-gray-50">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl md:text-5xl font-bold mb-4">Unsere Leistungen</h2>
                        <p className="text-gray-600 text-lg">Transparente Preise, ehrliche Beratung</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-white rounded-xl overflow-hidden simple-shadow simple-card">
                                <div className="h-40 overflow-hidden">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                </div>
                                <div className="p-6">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="material-symbols-outlined text-red-600 text-3xl">{service.icon}</span>
                                        <h3 className="text-xl font-bold">{service.title}</h3>
                                    </div>
                                    <p className="text-gray-600 mb-4">{service.desc}</p>
                                    <div className="text-red-600 font-bold text-lg">{service.price}</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Additional Info */}
                    <div className="mt-16 bg-white rounded-2xl p-8 simple-shadow">
                        <div className="grid md:grid-cols-3 gap-8 text-center">
                            <div>
                                <span className="material-symbols-outlined text-red-600 text-4xl mb-3">verified</span>
                                <h4 className="font-bold mb-2">Meisterbetrieb</h4>
                                <p className="text-sm text-gray-600">Zertifizierte Qualität</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-red-600 text-4xl mb-3">schedule</span>
                                <h4 className="font-bold mb-2">Schneller Service</h4>
                                <p className="text-sm text-gray-600">Kurze Wartezeiten</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-red-600 text-4xl mb-3">euro</span>
                                <h4 className="font-bold mb-2">Faire Preise</h4>
                                <p className="text-sm text-gray-600">Keine versteckten Kosten</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="bg-red-600 text-white rounded-2xl p-12 md:p-16">
                        <div className="grid md:grid-cols-2 gap-12">
                            <div>
                                <h2 className="text-4xl md:text-5xl font-bold mb-6">Wir sind für Sie da!</h2>
                                <p className="text-xl mb-8 text-red-100">Rufen Sie uns an oder kommen Sie direkt vorbei. Wir freuen uns auf Sie!</p>

                                <div className="space-y-6">
                                    <div className="flex items-start gap-4">
                                        <div className="w-12 h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">call</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-red-200 mb-1">Telefon</div>
                                            <div className="text-2xl font-bold">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-start gap-4">
                                        <div className="w-12 h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-red-200 mb-1">Adresse</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-start gap-4">
                                        <div className="w-12 h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-red-200 mb-1">Öffnungszeiten</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.hours}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center justify-center">
                                <div className="bg-white/10 backdrop-blur-sm rounded-2xl p-8 text-center">
                                    <span className="material-symbols-outlined text-6xl mb-4">handshake</span>
                                    <h3 className="text-2xl font-bold mb-4">Persönliche Beratung</h3>
                                    <p className="text-red-100 mb-6">Kommen Sie vorbei und lassen Sie sich unverbindlich beraten.</p>
                                    <a href="#" className="inline-block bg-white text-red-600 px-8 py-3 rounded-lg font-bold hover:bg-red-50 transition-colors">
                                        Anfahrt anzeigen
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-12 bg-gray-100 border-t border-gray-200">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-red-600 text-white flex items-center justify-center font-bold text-xs rounded">
                                KFZ
                            </div>
                            <div className="text-sm">
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-gray-500 text-xs">© 2026 Alle Rechte vorbehalten</div>
                            </div>
                        </div>
                        <div className="flex gap-6 text-sm text-gray-600">
                            <a href="#" className="hover:text-red-600 transition-colors">Impressum</a>
                            <a href="#" className="hover:text-red-600 transition-colors">Datenschutz</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-4 left-4 right-4 md:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-red-600 text-white flex justify-between items-center p-4 rounded-xl shadow-lg">
                        <div>
                            <div className="text-xs text-red-200">Jetzt anrufen</div>
                            <div className="font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <span className="material-symbols-outlined text-3xl">call</span>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
