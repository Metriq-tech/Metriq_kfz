<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React (Production) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

    <style>
        :root {
            --neon-primary: #F4C335;
            --neon-secondary: #d4a820;
            --bg-ultra-dark: #000000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ultra-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
        }

        /* Cinematic Hero Animation */
        @keyframes cinematicZoom {
            0% {
                transform: scale(1.3);
                opacity: 0;
                filter: blur(20px);
            }

            100% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        .cinematic-hero {
            animation: cinematicZoom 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 1023px) {
            .cinematic-hero {
                animation: none;
                opacity: 1;
                transform: none;
                filter: none;
            }
        }

        /* Neon Glow Effects */
        .neon-glow {
            box-shadow: 0 0 20px var(--neon-primary), 0 0 40px var(--neon-primary), 0 0 60px var(--neon-primary);
        }

        .neon-text {
            color: var(--neon-primary);
        }

        .neon-border {
            border: 2px solid var(--neon-primary);
            box-shadow: 0 0 15px var(--neon-primary), inset 0 0 15px rgba(45, 183, 163, 0.1);
        }

        /* Ultra Premium Card Hover */
        .ultra-card {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .ultra-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .ultra-card:hover::before {
            opacity: 1;
        }

        .ultra-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px -15px rgba(45, 183, 163, 0.4);
        }

        /* Floating Animation */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @media (max-width: 1023px) {
            .floating {
                display: none;
            }
        }

        /* Text Reveal Animation */
        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translateY(50px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .reveal-text {
            animation: textReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-1 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .stagger-2 {
            animation-delay: 0.4s;
            opacity: 0;
        }

        .stagger-3 {
            animation-delay: 0.6s;
            opacity: 0;
        }

        /* Glassmorphism Ultra */
        .glass-ultra {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(45, 183, 163, 0.1);
        }

        @media (max-width: 1023px) {
            .glass-ultra {
                backdrop-filter: none;
                background: rgba(0, 0, 0, 0.75);
            }
        }

        /* Grid Pattern Background */
        .grid-pattern {
            background-image:
                linear-gradient(rgba(45, 183, 163, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 183, 163, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Scanline Effect */
        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(transparent, var(--neon-primary), transparent);
            opacity: 0.3;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }

        @media (min-width: 1024px) {
            .scanline {
                display: block;
            }
        }

        .material-symbols-rounded {
            display: inline-block;
            overflow: visible;
            width: 1.2em;
            height: 1.2em;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
