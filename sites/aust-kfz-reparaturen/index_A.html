<!DOCTYPE html>
<html class="light" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Aust Kfz | Mercedes-Spezialist Hamburg</title>

    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary-color: #003399;
            --bg-light: #f9fafb;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .simple-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .simple-card {
            transition: transform 0.2s ease;
        }

        .simple-card:hover {
            transform: translateY(-4px);
        }

        .material-symbols-outlined {
            display: inline-block;
            overflow: hidden;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            font-display: block;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-white/80 backdrop-blur-md border border-gray-200 rounded-full shadow-lg text-[#003399] hover:bg-[#003399] hover:text-white transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "Aust Kfz-Meisterbetrieb",
                shortName: "Aust",
                tagline: "Spezialist für Mercedes-Benz in Hamburg",
                primaryColor: "#003399",
                logo: "images/Logo.png"
            },
            hero: {
                title: "Ihr Mercedes in besten Händen.",
                subtitle: "Tradition & Expertise seit über 40 Jahren",
                desc: "Seit über 40 Jahren haben wir uns der Verbesserung, Pflege, Wartung und Reparatur von Mercedes Fahrzeugen verschrieben. Bei unserem kompetenten Team ist auch Ihr Fahrzeug in den besten Händen.",
                image: "../../images/mocks/Mercedes5.jpg"
            },
            services: [
                { title: "Klima-Reinigung", icon: "ac_unit", desc: "Professionelle airco well® Reinigung für gesunde Atemluft.", price: "139,- €", image: "../../images/mocks/klimaanlage2.jpg" },
                { title: "Steuerketten", icon: "settings_suggest", desc: "Prüfung & Instandsetzung für Mercedes-Kompressor Motoren.", price: "ab 390,- €", image: "../../images/mocks/tiefendiagnose.avif" },
                { title: "Oldtimer-Spezial", icon: "history", desc: "Mr. Röntgenblick kümmert sich um Ihren Mercedes Klassiker.", price: "Auf Anfrage", image: "../../images/mocks/Oldtimer1.avif" },
                { title: "Meister-Service", icon: "verified_user", desc: "Wartung und Pflege nach Herstellervorgaben.", price: "Fair & Ehrlich", image: "../../images/mocks/inspektion.avif" }
            ],
            contact: {
                phone: "040 / 4 32 58 00",
                address: "Lerchenstraße 24a, 22767 Hamburg",
                hours: "Mo-Do: 08:00 - 17:00 Uhr, Fr: 08:00 - 12:30 Uhr"
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`sticky top-0 z-50 bg-white transition-all duration-300 ${scrolled ? 'shadow-md' : ''}`}>
                    <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <img src={CONFIG.company.logo} className="w-[72px] h-[72px] object-contain rounded" alt="Logo" />
                            <div>
                                <div className="font-bold text-lg leading-tight">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="hidden md:flex items-center gap-6">
                            <a href="#services" className="text-sm font-semibold hover:text-[#003399] transition-colors">Leistungen</a>
                            <a href="#contact" className="bg-[#003399] text-white px-5 py-2 rounded text-sm font-bold hover:bg-blue-800 transition-colors">Kontakt</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="bg-white">
                <div className="max-w-6xl mx-auto px-4 py-16 md:py-24">
                    <div className="grid md:grid-cols-2 gap-12 items-center">
                        <div>
                            <div className="inline-block bg-blue-100 text-[#003399] px-3 py-1 rounded-full text-xs font-bold uppercase mb-6">
                                Meisterbetrieb Hamburg
                            </div>
                            <h1 className="text-4xl md:text-6xl font-bold leading-tight mb-6">
                                {CONFIG.hero.title}
                            </h1>
                            <p className="text-xl text-gray-600 mb-4 font-medium">{CONFIG.hero.subtitle}</p>
                            <p className="text-gray-600 mb-8 leading-relaxed">{CONFIG.hero.desc}</p>

                            <div className="flex flex-col sm:flex-row gap-4 mb-12">
                                <a href="#contact" className="bg-[#003399] text-white px-8 py-4 rounded-lg font-bold text-center hover:bg-blue-800 transition-colors">
                                    Termin vereinbaren
                                </a>
                                <a href={`tel:${CONFIG.contact.phone.replace(/\s/g, '')}`} className="border-2 border-gray-300 px-8 py-4 rounded-lg font-bold text-center hover:border-[#003399] hover:text-[#003399] transition-colors">
                                    {CONFIG.contact.phone}
                                </a>
                            </div>

                            {/* Trust Indicators */}
                            <div className="flex gap-8 pt-8 border-t border-gray-200">
                                <div>
                                    <div className="text-2xl font-bold text-[#003399]">40+</div>
                                    <div className="text-sm text-gray-600">Jahre Erfahrung</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#003399]">100%</div>
                                    <div className="text-sm text-gray-600">Meisterqualität</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#003399]">Tradition</div>
                                    <div className="text-sm text-gray-600">Hamburg-Altona</div>
                                </div>
                            </div>
                        </div>

                        <div className="relative">
                            <div className="rounded-2xl overflow-hidden simple-shadow aspect-video">
                                <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Werkstatt" />
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-20 bg-gray-50">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl md:text-5xl font-bold mb-4">Unsere Leistungen</h2>
                        <p className="text-gray-600 text-lg">Instandsetzung, Tuning und Klassiker-Pflege</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-white rounded-xl overflow-hidden simple-shadow simple-card">
                                <div className="h-48 overflow-hidden">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                </div>
                                <div className="p-6">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="material-symbols-outlined text-[#003399] text-3xl">{service.icon}</span>
                                        <h3 className="text-xl font-bold">{service.title}</h3>
                                    </div>
                                    <p className="text-gray-600 mb-4 h-20 overflow-hidden">{service.desc}</p>
                                    <div className="text-[#003399] font-bold text-lg">{service.price}</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Additional Info */}
                    <div className="mt-16 bg-white rounded-2xl p-8 simple-shadow">
                        <div className="grid md:grid-cols-3 gap-8 text-center">
                            <div>
                                <span className="material-symbols-outlined text-[#003399] text-4xl mb-3">verified</span>
                                <h4 className="font-bold mb-2">Mercedes Expertise</h4>
                                <p className="text-sm text-gray-600">Spezielles Know-How für Stern-Fahrzeuge</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-[#003399] text-4xl mb-3">history</span>
                                <h4 className="font-bold mb-2">Oldtimer Profis</h4>
                                <p className="text-sm text-gray-600">Erhalt historischer Fahrzeuge</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-[#003399] text-4xl mb-3">thumb_up_alt</span>
                                <h4 className="font-bold mb-2">airco well®</h4>
                                <p className="text-sm text-gray-600">Zertifizierte Klima-Fachwerkstatt</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="bg-[#003399] text-white rounded-2xl p-6 sm:p-12 md:p-16">
                        <div className="grid md:grid-cols-2 gap-8 md:gap-12">
                            <div>
                                <h2 className="text-3xl md:text-5xl font-bold mb-4 md:mb-6">Wir sind für Sie da!</h2>
                                <p className="text-lg md:text-xl mb-6 md:mb-8 text-blue-100">Rufen Sie uns an oder kommen Sie direkt vorbei. Ihr Partner in Hamburg.</p>

                                <div className="space-y-6">
                                    <div className="flex items-center md:items-start gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-blue-200 mb-1">Telefon</div>
                                            <div className="text-xl md:text-2xl font-bold tracking-tight">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-start gap-4">
                                        <div className="w-12 h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-blue-200 mb-1">Adresse</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-start gap-4">
                                        <div className="w-12 h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-blue-200 mb-1">Öffnungszeiten</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.hours}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center justify-center mt-8 md:mt-0">
                                <div className="bg-white/10 backdrop-blur-sm rounded-2xl p-6 md:p-8 text-center w-full">
                                    <span className="material-symbols-outlined text-5xl md:text-6xl mb-4">handshake</span>
                                    <h3 className="text-xl md:text-2xl font-bold mb-3 md:mb-4">Persönliche Beratung</h3>
                                    <p className="text-blue-100 mb-6 text-sm md:text-base">Über 4 Jahrzehnte Erfahrung – sprechen Sie uns an.</p>
                                    <a href="https://www.google.com/maps/search/?api=1&query=Aust+Kfz+Lerchenstraße+24a+Hamburg" target="_blank" className="inline-block w-full sm:w-auto bg-white text-[#003399] px-8 py-3 rounded-lg font-bold hover:bg-neutral-50 transition-colors">
                                        Anfahrt anzeigen
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-12 bg-gray-100 border-t border-gray-200">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-4">
                            <img src={CONFIG.company.logo} className="w-[62px] h-[62px] object-contain rounded" alt="Logo" />
                            <div className="text-sm">
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-gray-500 text-xs">© 2026 Alle Rechte vorbehalten</div>
                            </div>
                        </div>
                        <div className="flex gap-6 text-sm text-gray-600">
                            <a href="#" className="hover:text-[#003399] transition-colors">Impressum</a>
                            <a href="#" className="hover:text-[#003399] transition-colors">Datenschutz</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-4 left-4 right-4 md:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone.replace(/\s/g, '')}`} className="bg-[#003399] text-white flex justify-between items-center p-4 rounded-xl shadow-lg">
                        <div>
                            <div className="text-xs text-blue-200">Jetzt anrufen</div>
                            <div className="font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <span className="material-symbols-outlined text-3xl">call</span>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
