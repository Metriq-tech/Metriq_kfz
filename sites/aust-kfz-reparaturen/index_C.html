<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Aust Kfz | The Future of Mercedes Service</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --neon-primary: #2D4892;
            --neon-secondary: #1a2a5a;
            --bg-ultra-dark: #000000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ultra-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
        }

        /* Cinematic Hero Animation */
        @keyframes cinematicZoom {
            0% {
                transform: scale(1.3);
                opacity: 0;
                filter: blur(20px);
            }

            100% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        .cinematic-hero {
            animation: cinematicZoom 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Neon Glow Effects */
        .neon-glow {
            box-shadow: 0 0 20px var(--neon-primary), 0 0 40px var(--neon-primary), 0 0 60px var(--neon-primary);
        }

        .neon-text {
            color: var(--neon-primary);
        }

        .neon-border {
            border: 2px solid var(--neon-primary);
            box-shadow: 0 0 15px var(--neon-primary), inset 0 0 15px rgba(0, 212, 255, 0.1);
        }

        /* Ultra Premium Card Hover */
        .ultra-card {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .ultra-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .ultra-card:hover::before {
            opacity: 1;
        }

        .ultra-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px -15px rgba(0, 212, 255, 0.4);
        }

        /* Floating Animation */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        /* Text Reveal Animation */
        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translateY(50px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .reveal-text {
            animation: textReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-1 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .stagger-2 {
            animation-delay: 0.4s;
            opacity: 0;
        }

        .stagger-3 {
            animation-delay: 0.6s;
            opacity: 0;
        }

        /* Glassmorphism Ultra */
        .glass-ultra {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        /* Grid Pattern Background */
        .grid-pattern {
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Scanline Effect */
        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(transparent, var(--neon-primary), transparent);
            opacity: 0.3;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 9999;
        }

        .material-symbols-rounded {
            display: inline-block;
            overflow: hidden;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            font-display: block;
        }
    </style>
</head>

<body>
    <div class="scanline"></div>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[10001] flex items-center justify-center w-12 h-12 bg-white/10 backdrop-blur-xl border border-white/20 rounded-xl shadow-2xl text-white hover:bg-[#2D4892] hover:border-[#2D4892] transition-all duration-500 group overflow-hidden"
        title="Zurück zum Dashboard">
        <div
            class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
        </div>
        <span
            class="material-symbols-rounded text-2xl relative z-10 group-hover:-translate-x-1 transition-transform">arrow_back</span>
    </a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "AUST MERCEDES TECH",
                shortName: "AUST",
                tagline: "40 YEARS OF AUTOMOTIVE PERFECTION",
                primaryColor: "#2D4892",
                logo: "images/Logo.png"
            },
            hero: {
                title: "ULTIMATE",
                subtitle: "EXPERTISE",
                desc: "Meisterbetrieb für Mercedes-Benz. Wir vereinen 40 Jahre Erfahrung mit modernster Digital-Diagnostik und präziser Handwerkskunst.",
                image: "../../images/mocks/Mercedes5.jpg"
            },
            services: [
                {
                    title: "CLIMATE PURITY",
                    icon: "cloud_done",
                    desc: "airco well® zertifizierte Reinigung für absolute Luftreinheit in Ihrem Mercedes.",
                    image: "../../images/mocks/klimaanlage3.jpg"
                },
                {
                    title: "CHAIN PRECISION",
                    icon: "settings_input_component",
                    desc: "Spezial-Service für Steuerketten und Nockenwellenversteller (Motor 271).",
                    image: "../../images/mocks/steuerkette1.avif"
                },
                {
                    title: "CLASSIC SOUL",
                    icon: "auto_awesome",
                    desc: "Mr. Röntgenblick Analysen und Restaurierung für Mercedes Old- & Youngtimer.",
                    image: "../../images/mocks/Oldtimer1.avif"
                },
                {
                    title: "MASTER TECH",
                    icon: "verified",
                    desc: "Full-Service Wartung und Reparatur auf Herstellerniveau mit Originalteilen.",
                    image: "../../images/mocks/Mercedes1.avif"
                }
            ],
            metrics: [
                { val: "40J", label: "ERFAHRUNG" },
                { val: "100%", label: "MERCEDES" },
                { val: "ALTONA", label: "HAMBURG" }
            ],
            contact: {
                phone: "040 / 4 32 58 00",
                email: "info@aust-hamburg.de",
                address: "Lerchenstraße 24a, 22767 Hamburg"
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-[100] transition-all duration-700 ${scrolled ? 'py-3 glass-ultra' : 'py-6 bg-transparent'}`}>
                    <div className="max-w-screen-2xl mx-auto px-8 lg:px-12 flex justify-between items-center">
                        <div className="flex items-center gap-6">
                            <img src={CONFIG.company.logo} className="w-[104px] h-[104px] object-contain rounded" alt="Logo" />
                            <div className="hidden md:block">
                                <div className="font-display font-black text-xl tracking-wider neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] text-gray-300 uppercase tracking-[0.3em] font-bold">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-12">
                            <div className="hidden lg:flex gap-10 text-[9px] font-black uppercase tracking-[0.25em] text-gray-400">
                                <a href="#services" className="hover:text-[#2D4892] transition-colors">SERVICES</a>
                                <a href="#contact" className="hover:text-[#2D4892] transition-colors">CONTACT</a>
                            </div>
                            <button className="neon-border bg-black text-[#2D4892] font-display font-black text-[9px] px-8 py-4 uppercase tracking-[0.25em] hover:bg-[#2D4892] hover:text-white transition-all duration-300">
                                JETZT ANRUFEN
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-end overflow-hidden grid-pattern">
                {/* Animated Background */}
                <div className="absolute inset-0 z-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover cinematic-hero grayscale contrast-125 opacity-70" alt="Elite Vehicle" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-black/80 via-transparent to-transparent"></div>
                </div>

                {/* Floating Neon Orbs */}
                <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-[#2D4892] rounded-full blur-[150px] opacity-20 floating"></div>
                <div className="absolute bottom-1/4 left-1/4 w-96 h-96 bg-[#1a2a5a] rounded-full blur-[150px] opacity-20 floating" style={{ animationDelay: '3s' }}></div>

                {/* Content */}
                <div className="relative z-10 max-w-screen-2xl mx-auto px-6 md:px-12 pt-40 pb-24 w-full">
                    <div className="max-w-5xl">
                        <h1 className="font-display font-black text-5xl sm:text-7xl md:text-[10rem] leading-[0.85] tracking-tighter mb-8 reveal-text">
                            {CONFIG.hero.title}
                            <br />
                            <span className="neon-text italic flex items-center gap-6 md:gap-12">
                                <span className="h-[2px] md:h-[3px] w-12 md:w-60 bg-gradient-to-r from-[#2D4892] to-transparent hidden sm:block"></span>
                                {CONFIG.hero.subtitle}
                            </span>
                        </h1>

                        <p className="text-lg md:text-3xl text-gray-300 font-light max-w-3xl mb-12 md:mb-16 leading-relaxed reveal-text stagger-1">
                            {CONFIG.hero.desc}
                        </p>

                        {/* Metrics */}
                        <div className="flex flex-wrap gap-8 md:gap-16 pt-12 border-t border-white/10 reveal-text stagger-2">
                            {CONFIG.metrics.map((m, i) => (
                                <div key={i} className="min-w-[100px]">
                                    <div className="font-display text-3xl md:text-5xl font-black neon-text mb-2">{m.val}</div>
                                    <div className="text-[8px] md:text-[9px] uppercase font-black tracking-[0.3em] text-gray-600">{m.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute inset-0 grid-pattern opacity-30"></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-6 md:px-12">
                    {/* Section Header */}
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-16 md:mb-32 gap-8 md:gap-12">
                        <div className="max-w-3xl">
                            <div className="inline-block neon-border bg-black px-4 py-2 rounded-full text-[#2D4892] text-[9px] font-black uppercase tracking-[0.3em] mb-6 md:mb-8">
                                EXPERT SERVICES
                            </div>
                            <h2 className="font-display text-5xl md:text-9xl font-black tracking-tighter uppercase mb-6">
                                BEYOND<br />
                                <span className="neon-text italic">PRECISION</span>
                            </h2>
                        </div>
                        <div className="text-gray-400 text-base md:text-lg max-w-md font-light leading-relaxed">
                            Seit 1980 eine Institution in Hamburg-Altona. Erstklassiger Service für anspruchsvolle Mercedes-Besitzer.
                        </div>
                    </div>

                    {/* Services Grid */}
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((s, i) => (
                            <div key={i} className="ultra-card glass-ultra rounded-2xl overflow-hidden group cursor-default">
                                <div className="h-64 overflow-hidden relative">
                                    <img src={s.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={s.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center text-[#2D4892] mb-8 group-hover:neon-glow transition-all duration-500">
                                        <span className="material-symbols-rounded text-4xl">{s.icon}</span>
                                    </div>
                                    <h3 className="font-display text-xl font-black mb-6 uppercase tracking-tight">{s.title}</h3>
                                    <p className="text-gray-400 text-sm font-light leading-relaxed">{s.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute top-0 left-1/3 w-[800px] h-[800px] bg-[#2D4892] blur-[200px] opacity-10"></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-4 md:px-12">
                    <div className="glass-ultra neon-border p-6 md:p-20 rounded-3xl">
                        {/* Header - Centered */}
                        <div className="text-center mb-12 md:mb-20">
                            <h2 className="font-display text-4xl sm:text-6xl md:text-8xl lg:text-9xl font-black uppercase tracking-tighter leading-none mb-6 md:mb-8">
                                CONTACT THE<br />
                                <span className="neon-text italic">EXPERTS</span>
                            </h2>
                            <p className="text-gray-400 text-base md:text-xl font-light max-w-2xl mx-auto leading-relaxed px-4">
                                Besuchen Sie uns in Altona oder rufen Sie direkt an. Wir freuen uns auf Ihren Mercedes.
                            </p>
                        </div>

                        {/* Contact Cards - Grid */}
                        <div className="grid md:grid-cols-2 gap-4 md:gap-8 max-w-4xl mx-auto">
                            <div className="glass-ultra neon-border p-6 md:p-8 rounded-2xl">
                                <div className="flex items-center md:items-start gap-4 md:gap-6">
                                    <div className="w-12 h-12 md:w-16 md:h-16 neon-border rounded-xl flex items-center justify-center flex-shrink-0 neon-text">
                                        <span className="material-symbols-rounded text-2xl md:text-3xl">call</span>
                                    </div>
                                    <div>
                                        <div className="text-[8px] md:text-[9px] uppercase font-black tracking-[0.3em] text-gray-600 mb-1 md:mb-3">SERVICELINE</div>
                                        <div className="font-display text-xl md:text-3xl font-black neon-text">{CONFIG.contact.phone}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-ultra neon-border p-6 md:p-8 rounded-2xl">
                                <div className="flex items-center md:items-start gap-4 md:gap-6">
                                    <div className="w-12 h-12 md:w-16 md:h-16 neon-border rounded-xl flex items-center justify-center flex-shrink-0 neon-text">
                                        <span className="material-symbols-rounded text-2xl md:text-3xl">mail</span>
                                    </div>
                                    <div>
                                        <div className="text-[8px] md:text-[9px] uppercase font-black tracking-[0.3em] text-gray-600 mb-1 md:mb-3">DIRECT MAIL</div>
                                        <div className="text-base md:text-xl font-bold break-all">{CONFIG.contact.email}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* CTA Button */}
                        <div className="mt-8 md:mt-12 max-w-2xl mx-auto">
                            <a href={`tel:${CONFIG.contact.phone.replace(/\s/g, '')}`} className="block w-full neon-border bg-black text-[#2D4892] font-display font-black text-xs md:text-sm px-8 md:px-12 py-5 md:py-6 uppercase tracking-[0.25em] text-center hover:bg-[#2D4892] hover:text-white transition-all duration-300 neon-glow">
                                JETZT KONTAKTIEREN
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 border-t border-white/5 bg-black">
                <div className="max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-12">
                        <div className="flex items-center gap-8">
                            <img src={CONFIG.company.logo} className="w-[84px] h-[84px] object-contain rounded" alt="Logo" />
                            <div>
                                <div className="font-display font-black text-sm tracking-wider neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] uppercase tracking-[0.4em] text-gray-700 font-bold">© 2026 ALL RIGHTS RESERVED</div>
                            </div>
                        </div>
                        <div className="flex gap-12 text-[9px] font-black uppercase tracking-[0.3em] text-gray-700">
                            <a href="#" className="hover:text-[#2D4892] transition-colors">IMPRINT</a>
                            <a href="#" className="hover:text-[#2D4892] transition-colors">PRIVACY</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone.replace(/\s/g, '')}`} className="glass-ultra neon-border p-5 flex items-center justify-between rounded-2xl neon-glow">
                        <div>
                            <div className="text-[8px] uppercase font-black tracking-[0.3em] text-gray-600">MERCEDES TECH</div>
                            <div className="font-display text-lg font-black neon-text">CALL NOW</div>
                        </div>
                        <div className="neon-border p-3 rounded-xl neon-text">
                            <span className="material-symbols-rounded text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
