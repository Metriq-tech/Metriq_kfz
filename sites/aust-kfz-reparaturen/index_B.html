<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Aust Kfz | Mercedes Excellence Hamburg</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --bg-dark: #0a0a0f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .gradient-overlay {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.9) 0%, rgba(59, 130, 246, 0.7) 100%);
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-shadow-strong {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .material-symbols-outlined {
            display: inline-block;
            overflow: hidden;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            font-display: block;
        }
    </style>
</head>

<body>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full shadow-2xl text-white hover:bg-white hover:text-black transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "Aust Kfz-Meisterbetrieb",
                shortName: "AUST",
                tagline: "Ihre Mercedes-Experten in Hamburg",
                primaryColor: "#1e3a8a",
                logo: "images/Logo.png"
            },
            hero: {
                title: "Tradition trifft Präzision.",
                subtitle: "Seit über 40 Jahren der Partner für Ihren Mercedes",
                desc: "Von Oldtimer-Restaurierung bis zu modernster Diagnosetechnik. Profitieren Sie von jahrzehntelanger Expertise und absoluter Leidenschaft für den Stern.",
                image: "../../images/mocks/Mercedes26.jpg"
            },
            services: [
                {
                    title: "airco well® Klima",
                    icon: "eco",
                    desc: "Zertifizierte Hochdruckreinigung für gesunde Atemluft und maximale Kühlleistung.",
                    image: "../../images/mocks/klimaanlage1.avif"
                },
                {
                    title: "Steuerketten-Check",
                    icon: "engineering",
                    desc: "Präzisionsprüfung & Instandsetzung speziell für Mercedes-Benz Kompressor Motoren.",
                    image: "../../images/mocks/tiefendiagnose.avif"
                },
                {
                    title: "Classic & Tuning",
                    icon: "star",
                    desc: "Individuelle Betreuung von Oldtimern sowie professionelles Leistungs- und Optik-Tuning.",
                    image: "../../images/mocks/Oldtimer1.avif"
                },
                {
                    title: "Master-Service",
                    icon: "verified",
                    desc: "Umfassende Wartung, Reparatur und Pflege nach höchsten Herstellervorgaben.",
                    image: "../../images/mocks/Inspektion1.avif"
                }
            ],
            brands: ["Mercedes-Benz Specialist", "Oldtimer", "Youngtimer", "AMG Performance", "Alle PKW"],
            contact: {
                phone: "040 / 4 32 58 00",
                email: "info@aust-hamburg.de",
                address: "Lerchenstraße 24a, 22767 HH",
                hours: "Mo-Do: 08:00 - 17:00 Uhr"
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-[#002b5c]/95 backdrop-blur-xl py-4 border-b border-white/5' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 lg:px-10 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <img src={CONFIG.company.logo} className="w-[84px] h-[84px] object-contain rounded-xl" alt="Logo" />
                            <div className="hidden md:block">
                                <div className="text-lg font-bold tracking-tight uppercase">{CONFIG.company.name}</div>
                                <div className="text-[10px] text-gray-400 uppercase tracking-wider">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="hidden lg:flex items-center gap-10 text-sm font-semibold">
                            <a href="#services" className="hover:text-blue-400 transition-colors">Leistungen</a>
                            <a href="#contact" className="bg-[#1e3a8a] px-6 py-3 rounded-xl hover:bg-blue-700 transition-all">Termin buchen</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-center overflow-hidden">
                {/* Background Image */}
                <div className="absolute inset-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover grayscale opacity-60" alt="Hero" />
                    <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                </div>

                {/* Content */}
                <div className="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 py-32">
                    <div className="max-w-3xl">
                        <div className="inline-block bg-blue-600/20 border border-blue-500/30 backdrop-blur-sm px-4 py-2 rounded-full text-blue-400 text-xs font-bold uppercase tracking-widest mb-8 animate-fade-in-up">
                            Seit über 40 Jahren in Hamburg
                        </div>

                        <h1 className="text-6xl md:text-8xl font-black leading-[1.1] tracking-tight mb-6 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                            {CONFIG.hero.title}
                        </h1>

                        <p className="text-xl md:text-2xl text-gray-200 font-medium mb-4 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                            {CONFIG.hero.subtitle}
                        </p>

                        <p className="text-lg text-gray-300 max-w-2xl mb-12 leading-relaxed animate-fade-in-up" style={{ animationDelay: '0.3s' }}>
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-col sm:flex-row gap-5 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
                            <a href="#contact" className="bg-[#1e3a8a] text-white px-10 py-5 rounded-2xl font-bold text-center shadow-xl shadow-blue-600/30 hover:bg-blue-700 hover:scale-105 transition-all">
                                Jetzt Termin vereinbaren
                            </a>
                            <a href="#services" className="bg-white/10 backdrop-blur-md border border-white/20 text-white px-10 py-5 rounded-2xl font-bold text-center hover:bg-white/20 transition-all">
                                Unsere Leistungen
                            </a>
                        </div>

                        {/* Trust Badges */}
                        <div className="flex flex-wrap gap-8 mt-16 pt-8 border-t border-white/10 animate-fade-in-up" style={{ animationDelay: '0.5s' }}>
                            <div>
                                <div className="text-3xl font-black text-blue-400">40+</div>
                                <div className="text-sm text-gray-400 font-medium">Jahre Erfahrung</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-blue-400">Mercedes</div>
                                <div className="text-sm text-gray-400 font-medium">Spezialisierung</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-blue-400">Altona</div>
                                <div className="text-sm text-gray-400 font-medium">Standort</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-32 bg-gradient-to-b from-[#0a0a0f] to-[#0f0f1a]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    {/* Section Header */}
                    <div className="text-center mb-20">
                        <div className="inline-block bg-blue-600/10 border border-blue-500/20 px-4 py-2 rounded-full text-blue-400 text-xs font-bold uppercase tracking-widest mb-6">
                            Unsere Expertise
                        </div>
                        <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6 uppercase">
                            Premium <span className="text-blue-500">Service</span>
                        </h2>
                        <p className="text-xl text-gray-400 max-w-3xl mx-auto">
                            Handwerkliche Präzision trifft auf jahrzehntelange Erfahrung. Wir pflegen Ihren Stern mit absoluter Perfektion.
                        </p>
                    </div>

                    {/* Services Grid */}
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl overflow-hidden card-hover">
                                <div className="h-56 overflow-hidden relative text-center flex items-center justify-center">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-14 h-14 bg-blue-600/10 border border-blue-500/20 rounded-2xl flex items-center justify-center text-blue-400 mb-6 font-bold">
                                        <span className="material-symbols-outlined text-3xl">{service.icon}</span>
                                    </div>
                                    <h3 className="text-2xl font-bold mb-4">{service.title}</h3>
                                    <p className="text-gray-400 leading-relaxed font-light">{service.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Brand Trust Bar */}
                    <div className="mt-24 pt-16 border-t border-white/5">
                        <div className="text-center mb-12">
                            <p className="text-sm text-gray-500 uppercase tracking-widest font-bold">Tradition und Technik</p>
                        </div>
                        <div className="flex flex-wrap justify-center gap-8 text-gray-600 font-bold text-lg uppercase">
                            {CONFIG.brands.map((brand, i) => (
                                <div key={i} className="px-6 py-3 bg-white/5 rounded-xl border border-white/5 hover:border-blue-500/30 hover:text-blue-400 transition-all">
                                    {brand}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-32 bg-[#0a0a0f]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="bg-gradient-to-br from-[#002b5c] to-[#1e3a8a] rounded-3xl md:rounded-[3rem] overflow-hidden relative">
                        {/* Background Pattern */}
                        <div className="absolute inset-0 opacity-10">
                            <div className="absolute inset-0" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '40px 40px' }}></div>
                        </div>

                        <div className="relative z-10 grid lg:grid-cols-2 gap-8 md:gap-16 p-6 sm:p-12 md:p-16 lg:p-20">
                            {/* Left: CTA */}
                            <div className="flex flex-col justify-center text-center lg:text-left">
                                <h2 className="text-4xl sm:text-5xl md:text-7xl font-black mb-6 md:mb-8 leading-tight">
                                    Höchste Qualität<br />für Ihren Stern.
                                </h2>
                                <p className="text-lg md:text-xl text-blue-100 mb-10 md:mb-12 leading-relaxed">
                                    Vereinbaren Sie noch heute Ihren Termin. Wir freuen uns auf Ihren Besuch in Altona.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 md:gap-5 mb-8 lg:mb-0">
                                    <a href={`tel:${CONFIG.contact.phone.replace(/\s/g, '')}`} className="bg-white text-blue-900 px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-gray-100 transition-all shadow-xl">
                                        Jetzt anrufen
                                    </a>
                                    <a href={`mailto:${CONFIG.contact.email}`} className="bg-blue-800/50 text-white px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-blue-900 transition-all border border-white/20">
                                        E-Mail schreiben
                                    </a>
                                </div>
                            </div>

                            {/* Right: Contact Info */}
                            <div className="flex flex-col justify-center space-y-4 md:space-y-8">
                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center md:items-start gap-4 md:gap-5">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-blue-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Telefon</div>
                                            <div className="text-xl md:text-2xl font-bold tracking-tight">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-8 rounded-3xl">
                                    <div className="flex items-start gap-5">
                                        <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-2xl">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-blue-200 font-bold uppercase tracking-wider mb-2">Adresse</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-8 rounded-3xl">
                                    <div className="flex items-start gap-5">
                                        <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-2xl">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-blue-200 font-bold uppercase tracking-wider mb-2">Öffnungszeiten</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.hours}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 bg-[#0a0a0f] border-t border-white/5">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                        <div className="flex items-center gap-4">
                            <img src={CONFIG.company.logo} className="w-[72px] h-[72px] object-contain rounded-xl" alt="Logo" />
                            <div>
                                <div className="font-bold uppercase tracking-tight">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="flex gap-8 text-sm text-gray-500">
                            <a href="#" className="hover:text-blue-400 transition-colors">Impressum</a>
                            <a href="#" className="hover:text-blue-400 transition-colors">Datenschutz</a>
                        </div>
                    </div>
                    <div className="mt-12 pt-8 border-t border-white/5 text-center text-sm text-gray-600 font-medium tracking-wide">
                        © 2026 {CONFIG.company.name}. Alle Rechte vorbehalten.
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone.replace(/\s/g, '')}`} className="bg-[#1e3a8a] text-white flex justify-between items-center p-5 rounded-2xl shadow-2xl">
                        <div>
                            <div className="text-xs text-blue-200 font-bold uppercase tracking-wider">Werkstatt anrufen</div>
                            <div className="text-lg font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <div className="bg-white/20 p-3 rounded-xl">
                            <span className="material-symbols-outlined text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
