<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Kühler-Kneesch Precision | Quantum Cooling & Engineering</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --neon-primary: #2b4a78;
            --neon-secondary: #1e3a5f;
            --bg-ultra-dark: #000000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ultra-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
        }

        /* Cinematic Hero Animation */
        @keyframes cinematicZoom {
            0% {
                transform: scale(1.3);
                opacity: 0;
                filter: blur(20px);
            }

            100% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        .cinematic-hero {
            animation: cinematicZoom 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Neon Glow Effects */
        .neon-glow {
            box-shadow: 0 0 20px var(--neon-primary);
        }

        .neon-text {
            color: var(--neon-primary);
            font-weight: 800;
        }

        .neon-border {
            border: 1px solid var(--neon-primary);
            box-shadow: 0 4px 12px rgba(43, 74, 120, 0.1);
        }

        /* Ultra Premium Card Hover */
        .ultra-card {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .ultra-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .ultra-card:hover::before {
            opacity: 1;
        }

        .ultra-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px -15px rgba(43, 74, 120, 0.3);
        }

        /* Floating Animation */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        /* Text Reveal Animation */
        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translateY(50px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .reveal-text {
            animation: textReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-1 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .stagger-2 {
            animation-delay: 0.4s;
            opacity: 0;
        }

        /* Glassmorphism Ultra */
        .glass-ultra {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(43, 74, 120, 0.1);
        }

        /* Grid Pattern Background */
        .grid-pattern {
            background-image:
                linear-gradient(rgba(43, 74, 120, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(43, 74, 120, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Scanline Effect */
        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(transparent, #2b4a78, transparent);
            opacity: 0.1;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 9999;
        }

        .logo-nav-c img {
            max-height: 80px;
            width: auto;
        }
    </style>
</head>

<body>
    <div class="scanline"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "KÜHLER-KNEESCH",
                shortName: "KK",
                tagline: "QUANTUM PRECISION SINCE 1928",
                primaryColor: "#3b82f6",
                logo: "images/logo2.png"
            },
            hero: {
                title: "PRECISION",
                subtitle: "REDEFINED",
                desc: "Meisterhafte Kühlersystem-Technik & High-End Performance. Wir transformieren Tradition in die Zukunft der Automobil-Exzellenz.",
                image: "../../images/mocks/Porsche1.avif"
            },
            services: [
                {
                    title: "THERMODYNAMIC ENGINEERING",
                    icon: "psychology",
                    desc: "Spezialisierte Instandsetzung und Optimierung komplexer Kühlsysteme für maximale Effizienz.",
                    image: "../../images/mocks/kuehler_2.avif"
                },
                {
                    title: "CLIMATE PERFORMANCE",
                    icon: "precision_manufacturing",
                    desc: "High-Tech Klimalösungen und Wartung nach höchsten Industriestandards.",
                    image: "../../images/mocks/klimaanlage3.jpg"
                },
                {
                    title: "3D GEOMETRY",
                    icon: "speed",
                    desc: "Ultramoderne Achsvermessung für perfekte Strassenlage und aerodynamische Stabilität.",
                    image: "../../images/mocks/achsenvermessung.avif"
                },
                {
                    title: "CONCIERGE SERVICE",
                    icon: "workspace_premium",
                    desc: "Persönliche Chef-Beratung und exklusives Fahrzeugmanagement für höchste Ansprüche.",
                    image: "../../images/mocks/Mercedes1.avif"
                }
            ],
            metrics: [
                { val: "3. Gen", label: "LEGACY" },
                { val: "100%", label: "MEISTERSTOLZ" },
                { val: "MAX", label: "COOLING" }
            ],
            contact: {
                phone: "040 / 77 61 13",
                email: "info@kuehler-kneesch.de",
                address: "Stader Straße 78, 21075 Hamburg"
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-[100] transition-all duration-700 ${scrolled ? 'py-3 glass-ultra' : 'py-6 bg-transparent'}`}>
                    <div className="max-w-screen-2xl mx-auto px-8 lg:px-12 flex justify-between items-center">
                        <div className="flex items-center gap-6">
                            <div className="logo-nav-c">
                                <img src={CONFIG.company.logo} alt={CONFIG.company.name} />
                            </div>
                            <div className="hidden md:block">
                                <div className="font-display font-black text-xl tracking-widest neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] text-gray-300 uppercase tracking-[0.3em] font-bold">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-12">
                            <div className="hidden lg:flex gap-10 text-[9px] font-black uppercase tracking-[0.25em] text-gray-400">
                                <a href="#services" className="hover:text-[#2b4a78] transition-colors">EXPERTISE</a>
                                <a href="#contact" className="hover:text-[#2b4a78] transition-colors">TERMIN</a>
                            </div>
                            <button className="neon-border bg-transparent text-[#2b4a78] font-display font-black text-[9px] px-8 py-4 uppercase tracking-[0.25em] hover:bg-[#2b4a78] hover:text-black transition-all duration-300">
                                BOOK NOW
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-end overflow-hidden grid-pattern">
                {/* Animated Background */}
                <div className="absolute inset-0 z-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover cinematic-hero" alt="Elite Vehicle" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-black/80 via-transparent to-transparent"></div>
                </div>

                {/* Floating Neon Orbs */}
                <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-[#2b4a78] rounded-full blur-[150px] opacity-20 floating"></div>
                <div className="absolute bottom-1/4 left-1/4 w-96 h-96 bg-[#00d4ff] rounded-full blur-[150px] opacity-20 floating" style={{ animationDelay: '3s' }}></div>

                {/* Content */}
                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12 pt-40 pb-24 w-full">
                    <div className="max-w-5xl">
                        <h1 className="font-display font-black text-7xl md:text-[10rem] leading-[0.85] tracking-tighter mb-8 reveal-text">
                            {CONFIG.hero.title}
                            <br />
                            <span className="neon-text italic flex items-center gap-12">
                                <span className="h-[3px] w-32 md:w-60 bg-gradient-to-r from-[#2b4a78] to-transparent hidden md:block"></span>
                                {CONFIG.hero.subtitle}
                            </span>
                        </h1>

                        <p className="text-xl md:text-3xl text-gray-300 font-light max-w-3xl mb-16 leading-relaxed reveal-text stagger-1">
                            {CONFIG.hero.desc}
                        </p>

                        {/* Metrics */}
                        <div className="flex flex-wrap gap-16 pt-12 border-t border-white/10 reveal-text stagger-2">
                            {CONFIG.metrics.map((m, i) => (
                                <div key={i}>
                                    <div className="font-display text-5xl font-black neon-text mb-2">{m.val}</div>
                                    <div className="text-[9px] uppercase font-black tracking-[0.3em] text-gray-600">{m.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute inset-0 grid-pattern opacity-30"></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-32 gap-12">
                        <div className="max-w-3xl">
                            <div className="inline-block neon-border bg-black px-4 py-2 rounded-full text-[#2b4a78] text-[9px] font-black uppercase tracking-[0.3em] mb-8">
                                PERFORMANCE CORE
                            </div>
                            <h2 className="font-display text-6xl md:text-9xl font-black tracking-tighter uppercase mb-6">
                                BEYOND<br />
                                <span className="neon-text italic">TRADITION</span>
                            </h2>
                        </div>
                        <div className="text-gray-400 text-lg max-w-md font-light leading-relaxed italic border-l-2 border-[#2b4a78] pl-6">
                            "Wir finden für jedes Problem die beste Lösung. Dafür nehme ich mir auch gerne persönlich die Zeit."
                            <br />
                            <span className="text-white font-black text-xs not-italic mt-4 block uppercase tracking-widest">— H.G. KNEESCH</span>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((s, i) => (
                            <div key={i} className="ultra-card glass-ultra rounded-2xl overflow-hidden group">
                                <div className="h-64 overflow-hidden relative">
                                    <img src={s.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={s.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center text-[#2b4a78] mb-8 group-hover:neon-glow transition-all duration-500">
                                        <span className="material-symbols-rounded text-4xl">{s.icon}</span>
                                    </div>
                                    <h3 className="font-display text-lg font-black mb-6 uppercase tracking-tight">{s.title}</h3>
                                    <p className="text-gray-400 text-xs font-light leading-relaxed">{s.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute top-0 left-1/3 w-[800px] h-[800px] bg-[#2b4a78] blur-[200px] opacity-10"></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="glass-ultra neon-border p-12 md:p-20 rounded-3xl">
                        <div className="text-center mb-20">
                            <h2 className="font-display text-6xl md:text-8xl lg:text-9xl font-black uppercase tracking-tighter leading-none mb-8">
                                GET IN<br />
                                <span className="neon-text italic">TOUCH</span>
                            </h2>
                            <p className="text-gray-400 text-lg md:text-xl font-light max-w-2xl mx-auto leading-relaxed">
                                Meisterhafte Betreuung für Ihr Fahrzeug. Vereinbaren Sie Ihr persönliches Beratungsgespräch direkt beim Inhaber.
                            </p>
                        </div>

                        {/* Mobile CTA */}
                        <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                            <a href={`tel:${CONFIG.contact.phone.replace(/\s/g, '')}`} className="glass-ultra neon-border p-5 flex items-center justify-between rounded-2xl neon-glow">
                                <div>
                                    <div className="text-[8px] uppercase font-black tracking-[0.3em] text-gray-600">CONCIERGE</div>
                                    <div className="font-display text-lg font-black neon-text">CALL NOW</div>
                                </div>
                                <div className="neon-border p-3 rounded-xl neon-text">
                                    <span className="material-symbols-rounded text-2xl">call</span>
                                </div>
                            </a>
                        </div>
                        <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                            <div className="glass-ultra neon-border p-8 rounded-2xl">
                                <div className="flex items-start gap-6">
                                    <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center flex-shrink-0 neon-text">
                                        <span className="material-symbols-rounded text-3xl">call</span>
                                    </div>
                                    <div>
                                        <div className="text-[9px] uppercase font-black tracking-[0.3em] text-gray-600 mb-3">HOTLINE</div>
                                        <div className="font-display text-2xl md:text-3xl font-black neon-text">{CONFIG.contact.phone}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-ultra neon-border p-8 rounded-2xl">
                                <div className="flex items-start gap-6">
                                    <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center flex-shrink-0 neon-text">
                                        <span className="material-symbols-rounded text-3xl">location_on</span>
                                    </div>
                                    <div>
                                        <div className="text-[9px] uppercase font-black tracking-[0.3em] text-gray-600 mb-3">LOCATION</div>
                                        <div className="text-lg md:text-xl font-bold">{CONFIG.contact.address}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* CTA Button */}
                        <div className="mt-12 max-w-2xl mx-auto">
                            <a href={`mailto:${CONFIG.contact.email}`} className="block w-full text-center neon-border bg-black text-[#2b4a78] font-display font-black text-sm px-12 py-6 uppercase tracking-[0.25em] hover:bg-[#2b4a78] hover:text-black transition-all duration-300 neon-glow">
                                SEND MESSAGE
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 border-t border-white/5 bg-black">
                <div className="max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-12">
                        <div className="flex items-center gap-6">
                            <div className="logo-nav-c">
                                <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="grayscale hover:grayscale-0 transition-all duration-300" />
                            </div>
                            <div>
                                <div className="font-display font-black text-sm tracking-wider neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] uppercase tracking-[0.4em] text-gray-500 font-bold">© 2026 PRECISION AUTOMOTIVE</div>
                            </div>
                        </div>
                        <div className="flex gap-12 text-[9px] font-black uppercase tracking-[0.3em] text-gray-700">
                            <a href="#" className="hover:text-[#2b4a78] transition-colors">IMPRINT</a>
                            <a href="#" className="hover:text-[#2b4a78] transition-colors">PRIVACY</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Contact />
                <Footer />
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
