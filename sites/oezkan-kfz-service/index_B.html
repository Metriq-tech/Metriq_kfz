<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Özkan KFZ-Service | Premium Werkstatt Hamburg</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary: #C0201A;
            --primary-dark: #9a1915;
            --bg-dark: #0d0505;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(192, 32, 26, 0.4);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>

<body>
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full shadow-2xl text-white hover:bg-white hover:text-black transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "Özkan KFZ-Service",
                tagline: "PKW · LKW · Transporter · Hamburg · Seit 28 Jahren",
            },
            hero: {
                title: "Werkstatt des Vertrauens.",
                subtitle: "Ihr zuverlässiger Partner für alle Fabrikate",
                desc: "28 Jahre Erfahrung als Familienbetrieb in Hamburg-Rothenburgsort. Professionelle Reparaturen, HU/AU und Reifenservice – für PKW, LKW und Transporter aller Fabrikate.",
                image: "../../images/mocks/Werkstatt3.jpg"
            },
            services: [
                { title: "Hauptuntersuchung & AU", icon: "verified", desc: "Anmeldung und Durchführung direkt in unserer Werkstatt – schnell und zuverlässig.", image: "../../images/mocks/tuev.png" },
                { title: "Reparaturen", icon: "build", desc: "Fachgerechte Reparaturen für alle Fabrikate – PKW, LKW und Transporter.", image: "../../images/mocks/werkstatt2.jpg" },
                { title: "Karosserie & Lack", icon: "car_repair", desc: "Professionelle Schadensbehebung und Karosseriearbeiten für PKW und LKW.", image: "../../images/mocks/rotes_auto2.jpg" },
                { title: "Reifen-Service", icon: "tire_repair", desc: "Professioneller Reifenwechsel mindestens zweimal im Jahr – sicher unterwegs.", image: "../../images/mocks/reifenwechsel.avif" }
            ],
            brands: ["PKW", "LKW", "Transporter", "Alle Marken", "HU/AU", "Ölwechsel"],
            contact: {
                phone: "040 78 25 65",
                email: "kontakt@özkan-kfzservice.de",
                address: "Ausschläger Elbdeich 109, 20539 Hamburg",
                hours: "Mo-Fr: 08:30 – 18:00 Uhr"
            },
            reviews: {
                rating: 4.8,
                total: 112,
                list: [
                    { name: "Ahmed K.", date: "Vor 1 Woche", text: "Familienbetrieb mit Herz! Ehrlich, kompetent und zu fairen Preisen. Absolute Empfehlung.", stars: 5 },
                    { name: "Petra M.", date: "Vor 3 Wochen", text: "Endlich eine Werkstatt, der man vertrauen kann. Transparente Beratung und top Arbeit.", stars: 5 },
                    { name: "Klaus W.", date: "Vor 2 Monaten", text: "28 Jahre Erfahrung merkt man sofort. Mein LKW läuft wieder einwandfrei.", stars: 5 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-[#0d0505]/95 backdrop-blur-xl py-3 border-b border-white/5' : 'bg-transparent py-5'}`}>
                    <div className="max-w-7xl mx-auto px-6 lg:px-10 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <img src="images/logo.jpg" alt="Özkan KFZ-Service Logo" className="h-[170px] w-auto object-contain" />
                            <div className="hidden md:block">
                                <div className="text-lg font-bold tracking-tight">{CONFIG.company.name}</div>
                                <div className="text-[10px] text-gray-400 uppercase tracking-wider">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden lg:flex items-center gap-10 text-sm font-semibold">
                            <a href="#services" className="hover:text-[#C0201A] transition-colors">Leistungen</a>
                            <a href="#reviews" className="hover:text-[#C0201A] transition-colors">Bewertungen</a>
                            <a href="#contact" className="bg-[#C0201A] px-6 py-3 rounded-xl hover:bg-[#9a1915] transition-all">Termin buchen</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-center overflow-hidden">
                <div className="absolute inset-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Hero" />
                    <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                </div>

                <div className="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 py-32">
                    <div className="max-w-3xl">
                        <div className="inline-block bg-[#C0201A]/30 border border-[#C0201A]/50 backdrop-blur-sm px-4 py-2 rounded-full text-red-200 text-xs font-bold uppercase tracking-widest mb-8 animate-fade-in-up">
                            Familienbetrieb · Hamburg
                        </div>

                        <h1 className="text-6xl md:text-8xl font-black leading-[1.1] tracking-tight mb-6 animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                            {CONFIG.hero.title}
                        </h1>

                        <p className="text-xl md:text-2xl text-gray-200 font-medium mb-4 animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                            {CONFIG.hero.subtitle}
                        </p>

                        <p className="text-lg text-gray-300 max-w-2xl mb-12 leading-relaxed animate-fade-in-up" style={{ animationDelay: '0.3s' }}>
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-col sm:flex-row gap-5 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
                            <a href="#contact" className="bg-[#C0201A] text-white px-10 py-5 rounded-2xl font-bold text-center shadow-xl shadow-[#C0201A]/30 hover:bg-[#9a1915] hover:scale-105 transition-all">
                                Jetzt Termin vereinbaren
                            </a>
                            <a href="#services" className="bg-white/10 backdrop-blur-md border border-white/20 text-white px-10 py-5 rounded-2xl font-bold text-center hover:bg-white/20 transition-all">
                                Unsere Leistungen
                            </a>
                        </div>

                        <div className="flex flex-wrap gap-8 mt-16 pt-8 border-t border-white/10 animate-fade-in-up" style={{ animationDelay: '0.5s' }}>
                            <div>
                                <div className="text-3xl font-black text-[#C0201A]">28+</div>
                                <div className="text-sm text-gray-400 font-medium">Jahre Erfahrung</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#C0201A]">4.8</div>
                                <div className="text-sm text-gray-400 font-medium">Google Bewertung</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#C0201A]">Alle</div>
                                <div className="text-sm text-gray-400 font-medium">Fabrikate</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-32 bg-gradient-to-b from-[#0d0505] to-[#120808]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="text-center mb-20">
                        <div className="inline-block bg-[#C0201A]/10 border border-[#C0201A]/20 px-4 py-2 rounded-full text-red-400 text-xs font-bold uppercase tracking-widest mb-6">
                            Unsere Expertise
                        </div>
                        <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">
                            Unsere <span className="text-[#C0201A]">Leistungen</span>
                        </h2>
                        <p className="text-xl text-gray-400 max-w-3xl mx-auto">
                            Professionelle Werkstattleistungen für PKW, LKW und Transporter aller Fabrikate.
                        </p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl overflow-hidden card-hover">
                                <div className="h-56 overflow-hidden relative bg-gray-900">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-14 h-14 bg-[#C0201A]/10 border border-[#C0201A]/20 rounded-2xl flex items-center justify-center text-[#C0201A] mb-6">
                                        <span className="material-symbols-outlined text-3xl">{service.icon}</span>
                                    </div>
                                    <h3 className="text-xl font-bold mb-4">{service.title}</h3>
                                    <p className="text-gray-400 leading-relaxed text-sm">{service.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-24 pt-16 border-t border-white/5">
                        <div className="text-center mb-12">
                            <p className="text-sm text-gray-500 uppercase tracking-widest font-bold">Wir arbeiten mit allen Fahrzeugtypen</p>
                        </div>
                        <div className="flex flex-wrap justify-center gap-8 text-gray-600 font-bold text-lg">
                            {CONFIG.brands.map((brand, i) => (
                                <div key={i} className="px-6 py-3 bg-white/5 rounded-xl border border-white/5 hover:border-[#C0201A]/30 hover:text-[#C0201A] transition-all">
                                    {brand}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Reviews = () => (
            <section id="reviews" className="py-32 bg-[#0d0505]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col lg:flex-row items-center justify-between mb-20 gap-10">
                        <div className="text-center lg:text-left">
                            <div className="inline-block bg-[#C0201A]/10 border border-[#C0201A]/20 px-4 py-2 rounded-full text-red-400 text-xs font-bold uppercase tracking-widest mb-6">
                                Kundenstimmen
                            </div>
                            <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">Was Kunden <span className="text-[#C0201A]">sagen</span></h2>
                            <p className="text-xl text-gray-400">Vertrauen, das man fühlen kann</p>
                        </div>

                        <div className="bg-gray-900/50 backdrop-blur-xl border border-white/5 p-8 rounded-[2rem] flex items-center gap-8 shadow-2xl">
                            <div className="text-center">
                                <div className="text-5xl font-black text-white mb-2">{CONFIG.reviews.rating}</div>
                                <div className="flex text-yellow-400">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined fill-1">star</span>
                                    ))}
                                </div>
                            </div>
                            <div className="h-16 w-px bg-white/10"></div>
                            <div>
                                <div className="text-lg font-bold text-white mb-1">Google Rezensionen</div>
                                <div className="text-[#C0201A] font-medium">{CONFIG.reviews.total} Bewertungen</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
                        {CONFIG.reviews.list.map((review, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 p-10 rounded-3xl card-hover">
                                <div className="flex gap-1 text-yellow-400 mb-6">
                                    {[...Array(review.stars)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined text-sm fill-1">star</span>
                                    ))}
                                </div>
                                <p className="text-gray-300 mb-8 italic text-lg leading-relaxed">"{review.text}"</p>
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-[#C0201A]/20 rounded-full flex items-center justify-center text-[#C0201A] font-bold">
                                        {review.name.charAt(0)}
                                    </div>
                                    <div>
                                        <div className="font-bold text-white">{review.name}</div>
                                        <div className="text-xs text-gray-500 uppercase tracking-widest font-bold">{review.date}</div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-32 bg-[#0d0505]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="bg-gradient-to-br from-[#C0201A] to-[#7a1410] rounded-3xl md:rounded-[3rem] overflow-hidden relative">
                        <div className="absolute inset-0 opacity-10">
                            <div className="absolute inset-0" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '40px 40px' }}></div>
                        </div>

                        <div className="relative z-10 grid lg:grid-cols-2 gap-8 md:gap-16 p-6 sm:p-12 md:p-16 lg:p-20">
                            <div className="flex flex-col justify-center text-center lg:text-left">
                                <h2 className="text-4xl sm:text-5xl md:text-7xl font-black mb-6 md:mb-8 leading-tight">
                                    Bereit für<br />erstklassigen<br />Service?
                                </h2>
                                <p className="text-lg md:text-xl text-red-100 mb-10 md:mb-12 leading-relaxed">
                                    Vereinbaren Sie noch heute einen Termin und erleben Sie den Unterschied von 28 Jahren Erfahrung.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 md:gap-5">
                                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-white text-[#C0201A] px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-gray-100 transition-all shadow-xl">
                                        Jetzt anrufen
                                    </a>
                                    <a href={`mailto:${CONFIG.contact.email}`} className="bg-black/20 text-white px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-black/30 transition-all">
                                        E-Mail schreiben
                                    </a>
                                </div>
                            </div>

                            <div className="flex flex-col justify-center space-y-4 md:space-y-6">
                                {[
                                    { icon: 'call', label: 'Telefon', val: CONFIG.contact.phone },
                                    { icon: 'location_on', label: 'Adresse', val: CONFIG.contact.address },
                                    { icon: 'schedule', label: 'Öffnungszeiten', val: CONFIG.contact.hours }
                                ].map((item, i) => (
                                    <div key={i} className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                        <div className="flex items-center gap-4 md:gap-6">
                                            <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                                <span className="material-symbols-outlined text-xl md:text-2xl">{item.icon}</span>
                                            </div>
                                            <div>
                                                <div className="text-[10px] md:text-xs text-red-200 font-bold uppercase tracking-wider mb-1 md:mb-2">{item.label}</div>
                                                <div className="text-base md:text-xl font-bold">{item.val}</div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 bg-[#0d0505] border-t border-white/5">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                        <div className="flex items-center gap-3">
                            <img src="images/logo.jpg" alt="Özkan KFZ-Service" className="h-[78px] w-auto opacity-50 hover:opacity-100 transition-all duration-300" />
                            <div>
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="flex gap-8 text-sm text-gray-500">
                            <a href="#" className="hover:text-[#C0201A] transition-colors">Impressum</a>
                            <a href="#" className="hover:text-[#C0201A] transition-colors">Datenschutz</a>
                        </div>
                    </div>
                    <div className="mt-12 pt-8 border-t border-white/5 text-center text-sm text-gray-600">
                        © 2026 {CONFIG.company.name}. Alle Rechte vorbehalten.
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Reviews />
                <Contact />
                <Footer />

                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#C0201A] text-white flex justify-between items-center p-5 rounded-2xl shadow-2xl shadow-[#C0201A]/40">
                        <div>
                            <div className="text-xs text-red-200 font-bold uppercase tracking-wider">Direkt anrufen</div>
                            <div className="text-lg font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <div className="bg-white/20 p-3 rounded-xl">
                            <span className="material-symbols-outlined text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
