<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Auto Thies | Premium Gebrauchtwagen & Meister-Service</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary: #EAB308;
            --bg-dark: #0a0a0f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .gradient-overlay {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.9) 0%, rgba(161, 98, 7, 0.7) 100%);
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(234, 179, 8, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-shadow-strong {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .material-symbols-outlined {
            display: inline-block;
            overflow: hidden;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            font-display: block;
        }
    </style>
</head>

<body>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full shadow-2xl text-white hover:bg-white hover:text-black transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "Auto Thies",
                shortName: "THIES",
                tagline: "Premium Fahrzeughandel & KFZ-Meisterbetrieb",
                primaryColor: "#EAB308",
                logo: "images/logo.png"
            },
            hero: {
                title: "Exzellenz in Handel & Werkstatt-Service.",
                subtitle: "Ihr Partner für exzellente Fahrzeuge in Hamburg",
                desc: "Über 90 Jahre Expertise im Automobilhandel. Wir bieten Ihnen eine kuratierte Auswahl an Fahrzeugen und erstklassigen Werkstatt-Service.",
                image: "../../images/mocks/Audi1.avif"
            },
            services: [
                {
                    title: "Exklusiver Handel",
                    icon: "directions_car",
                    desc: "Sorgfältig geprüfte Gebraucht- und Jahreswagen mit Garantie.",
                    image: "../../images/mocks/Audi3.avif"
                },
                {
                    title: "Meister-Check",
                    icon: "verified",
                    desc: "Präzise Inspektion und Wartung nach Herstellervorgaben für alle Marken.",
                    image: "../../images/mocks/inspektion.avif"
                },
                {
                    title: "Oldtimer-Zentrum",
                    icon: "history",
                    desc: "Fachgerechte Betreuung und Vermittlung historischer Fahrzeuge.",
                    image: "../../images/mocks/Oldtimer1.avif"
                },
                {
                    title: "Full-Service",
                    icon: "payments",
                    desc: "Individuelle Finanzierungslösungen und Rundum-Sorglos-Pakete.",
                    image: "../../images/mocks/nahaufnahme2.avif"
                }
            ],
            brands: ["Gebrauchtwagen", "Neuwagen", "Transporter", "Oldtimer", "Alle Marken"],
            contact: {
                phone: "040-767 30 60",
                email: "info@thies-automobile.de",
                address: "Kleiner Schippsee 7-9, 21073 Hamburg",
                hours: "Mo-Fr: 08:30 - 18:00 Uhr, Sa: 09:00 - 14:00 Uhr"
            },
            inventory: [
                { name: "Audi RS6 Performance", price: "115.900 €", details: "Bj. 2023 | 12.500 km | 600 PS", image: "../../images/mocks/Audi2.avif" },
                { name: "Porsche 911 Carrera", price: "135.500 €", details: "Bj. 2022 | 8.000 km | Black Edition", image: "../../images/mocks/Porsche1.avif" },
                { name: "BMW M4 Competition", price: "89.000 €", details: "Bj. 2023 | 5.000 km | Frozen Grey", image: "../../images/mocks/BMW2.avif" }
            ]
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-[#0a0a0f]/95 backdrop-blur-xl py-4 border-b border-white/5' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 lg:px-10 flex justify-between items-center">
                        <a href="#" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="flex items-center gap-4 hover:opacity-80 transition-opacity">
                            <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-10 w-auto" />
                            <div className="hidden md:block text-left">
                                <div className="text-lg font-bold tracking-tight uppercase">{CONFIG.company.name}</div>
                                <div className="text-[10px] text-yellow-500 uppercase tracking-wider">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="flex items-center gap-6 lg:gap-10 text-sm font-semibold">
                            <a href="#services" className="hover:text-yellow-500 transition-colors">Leistungen</a>
                            <a href="#inventory" className="hover:text-yellow-500 transition-colors">Autohandel</a>
                            <a href="#contact" className="bg-yellow-500 text-black px-6 py-3 rounded-xl hover:bg-yellow-400 hover:scale-105 transition-all">Termin buchen</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-center overflow-hidden">
                <div className="absolute inset-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Hero" />
                    <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                </div>

                <div className="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 py-32">
                    <div className="max-w-3xl">
                        <div className="inline-block bg-yellow-500/20 border border-yellow-500/30 backdrop-blur-sm px-4 py-2 rounded-full text-yellow-500 text-xs font-bold uppercase tracking-widest mb-8 animate-fade-in-up">
                            Inhabergeführt seit 1926
                        </div>

                        <h1 className="text-6xl md:text-8xl font-black leading-[1.1] tracking-tight mb-6 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                            {CONFIG.hero.title}
                        </h1>

                        <p className="text-xl md:text-2xl text-gray-200 font-medium mb-4 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                            {CONFIG.hero.subtitle}
                        </p>

                        <p className="text-lg text-gray-300 max-w-2xl mb-12 leading-relaxed animate-fade-in-up" style={{ animationDelay: '0.3s' }}>
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-col sm:flex-row gap-5 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
                            <a href="#contact" className="bg-yellow-500 text-black px-10 py-5 rounded-2xl font-bold text-center shadow-xl shadow-yellow-500/30 hover:bg-yellow-400 hover:scale-105 transition-all">
                                Termin vereinbaren
                            </a>
                            <a href="#services" className="bg-white/10 backdrop-blur-md border border-white/20 text-white px-10 py-5 rounded-2xl font-bold text-center hover:bg-white/20 transition-all">
                                Unsere Leistungen
                            </a>
                        </div>

                        <div className="flex flex-wrap gap-8 mt-16 pt-8 border-t border-white/10 animate-fade-in-up" style={{ animationDelay: '0.5s' }}>
                            <div>
                                <div className="text-3xl font-black text-yellow-500">95+</div>
                                <div className="text-sm text-gray-400 font-medium">Jahre Erfolg</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-yellow-500">HH</div>
                                <div className="text-sm text-gray-400 font-medium">Standort Harburg</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-yellow-500">100%</div>
                                <div className="text-sm text-gray-400 font-medium">Kundenfokus</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-32 bg-gradient-to-b from-[#0a0a0f] to-[#0f0f1a]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="text-center mb-20">
                        <div className="inline-block bg-yellow-500/10 border border-yellow-500/20 px-4 py-2 rounded-full text-yellow-500 text-xs font-bold uppercase tracking-widest mb-6">
                            Unsere Expertise
                        </div>
                        <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">
                            Full Service <span className="text-yellow-500">Automotive</span>
                        </h2>
                        <p className="text-xl text-gray-400 max-w-3xl mx-auto">
                            Egal ob Fahrzeugkauf oder Inspektion – wir bieten Ihnen maßgeschneiderte Lösungen auf höchstem Niveau.
                        </p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl overflow-hidden card-hover">
                                <div className="h-56 overflow-hidden relative">
                                    <img src={service.image} className="w-full h-full object-cover opacity-60" alt={service.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-14 h-14 bg-yellow-500/10 border border-yellow-500/20 rounded-2xl flex items-center justify-center text-yellow-500 mb-6">
                                        <span className="material-symbols-outlined text-3xl">{service.icon}</span>
                                    </div>
                                    <h3 className="text-2xl font-bold mb-4">{service.title}</h3>
                                    <p className="text-gray-400 leading-relaxed text-sm">{service.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-24 pt-16 border-t border-white/5 text-center">
                        <p className="text-sm text-gray-500 uppercase tracking-widest font-bold mb-12">Ihre Mobilität ist unser Antrieb</p>
                        <div className="flex flex-wrap justify-center gap-6 text-gray-400 font-bold uppercase tracking-tighter text-2xl opacity-50">
                            {CONFIG.brands.map((brand, i) => (
                                <div key={i}>{brand}</div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Inventory = () => (
            <section id="inventory" className="py-32 bg-[#0f0f1a]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="text-center mb-20">
                        <div className="inline-block bg-yellow-500/10 border border-yellow-500/20 px-4 py-2 rounded-full text-yellow-500 text-xs font-bold uppercase tracking-widest mb-6">
                            Showroom
                        </div>
                        <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">
                            Exklusive <span className="text-yellow-500">Auswahl</span>
                        </h2>
                        <p className="text-xl text-gray-400 max-w-3xl mx-auto">
                            Handverlesene Premium-Fahrzeuge für höchste Ansprüche.
                        </p>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
                        {CONFIG.inventory.map((car, i) => (
                            <div key={i} className="bg-gray-900/50 border border-white/5 rounded-[2rem] overflow-hidden group cursor-pointer hover:border-yellow-500/30 transition-all duration-500">
                                <div className="h-64 overflow-hidden relative">
                                    <img src={car.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={car.name} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0f] via-transparent to-transparent opacity-60"></div>
                                    <div className="absolute top-6 right-6 bg-yellow-500 text-black px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">Sofort Verfügbar</div>
                                </div>
                                <div className="p-8">
                                    <h3 className="text-2xl font-bold mb-3 group-hover:text-yellow-500 transition-colors">{car.name}</h3>
                                    <div className="flex items-center gap-2 text-gray-400 text-sm mb-6">
                                        <span className="material-symbols-outlined text-sm">info</span>
                                        {car.details}
                                    </div>
                                    <div className="flex justify-between items-center pt-6 border-t border-white/5">
                                        <div className="text-3xl font-black">{car.price}</div>
                                        <div className="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center group-hover:bg-yellow-500 group-hover:text-black transition-all">
                                            <span className="material-symbols-outlined">arrow_forward</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-32 bg-[#0a0a0f]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="bg-gradient-to-br from-yellow-500 to-yellow-600 text-black rounded-3xl md:rounded-[3rem] overflow-hidden relative">
                        <div className="relative z-10 grid lg:grid-cols-2 gap-8 md:gap-16 p-6 sm:p-12 md:p-16 lg:p-20">
                            <div className="flex flex-col justify-center text-center lg:text-left">
                                <h2 className="text-4xl sm:text-5xl md:text-7xl font-black mb-6 md:mb-8 leading-tight">
                                    Bereit für<br />Ihren<br />Auto-Traum?
                                </h2>
                                <p className="text-lg md:text-xl text-yellow-900 mb-10 md:mb-12 leading-relaxed font-medium">
                                    Besuchen Sie uns am Schippsee und lassen Sie sich persönlich beraten. Wir freuen uns auf Ihren Besuch!
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 md:gap-5 mb-8 lg:mb-0">
                                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-black text-white px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-gray-900 transition-all shadow-xl">
                                        Jetzt anrufen
                                    </a>
                                    <a href={`mailto:${CONFIG.contact.email}`} className="border-2 border-black/20 text-black px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-black/10 transition-all">
                                        E-Mail schreiben
                                    </a>
                                </div>
                            </div>

                            <div className="flex flex-col justify-center space-y-4 md:space-y-6">
                                <div className="bg-white/20 backdrop-blur-sm border border-black/5 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-start gap-5">
                                        <div className="w-12 h-12 bg-black/10 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-yellow-900 font-bold uppercase tracking-wider mb-2">Adresse</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/20 backdrop-blur-sm border border-black/5 p-8 rounded-3xl">
                                    <div className="flex items-start gap-5">
                                        <div className="w-12 h-12 bg-black/10 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-sm text-yellow-900 font-bold uppercase tracking-wider mb-2">Öffnungszeiten</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.hours}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 bg-[#0a0a0f] border-t border-white/5">
                <div className="max-w-7xl mx-auto px-6 lg:px-10 text-center md:text-left">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                        <div className="flex items-center gap-4">
                            <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-8 w-auto opacity-80" />
                            <div>
                                <div className="font-bold uppercase tracking-tight">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="flex gap-8 text-sm text-gray-500 font-medium">
                            <a href="#" className="hover:text-yellow-500 transition-colors">Impressum</a>
                            <a href="#" className="hover:text-yellow-500 transition-colors">Datenschutz</a>
                        </div>
                    </div>
                    <div className="mt-12 pt-8 border-t border-white/5 text-center text-xs text-gray-600">
                        © 2026 {CONFIG.company.name}. Tradition im Hamburger Süden seit 1926.
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Inventory />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-yellow-500 text-black flex justify-between items-center p-5 rounded-2xl shadow-2xl">
                        <div className="text-left">
                            <div className="text-[10px] text-yellow-900 font-bold uppercase tracking-wider">Schnellanfrage</div>
                            <div className="text-lg font-black tracking-tight">{CONFIG.contact.phone}</div>
                        </div>
                        <div className="bg-black/10 p-3 rounded-xl">
                            <span className="material-symbols-outlined text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
