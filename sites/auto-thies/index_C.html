<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Auto Thies | Excellence Automotive HH</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React (Production) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

    <style>
        :root {
            --neon-primary: #EAB308;
            --neon-secondary: #ffffff;
            --bg-ultra-dark: #000000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ultra-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
        }

        @keyframes cinematicZoom {
            0% {
                transform: scale(1.3);
                opacity: 0;
                filter: blur(20px);
            }

            100% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        .cinematic-hero {
            animation: cinematicZoom 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 1023px) {
            .cinematic-hero {
                animation: none;
                opacity: 1;
                transform: none;
                filter: none;
            }
        }

        .neon-text {
            color: var(--neon-primary);
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }

        .neon-border {
            border: 2px solid var(--neon-primary);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
        }

        .ultra-card {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ultra-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px -15px rgba(234, 179, 8, 0.2);
        }

        .glass-ultra {
            background: rgba(234, 179, 8, 0.05);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(234, 179, 8, 0.1);
        }

        @media (max-width: 1023px) {
            .glass-ultra {
                backdrop-filter: none;
                background: rgba(0, 0, 0, 0.75);
            }
        }

        .grid-pattern {
            background-image:
                linear-gradient(rgba(234, 179, 8, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(234, 179, 8, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .material-symbols-rounded {
            display: inline-block;
            overflow: hidden;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            font-display: block;
        }
    </style>
</head>

<body>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[10001] flex items-center justify-center w-12 h-12 bg-white/10 backdrop-blur-xl border border-white/20 rounded-xl shadow-2xl text-white hover:bg-yellow-500 hover:text-black transition-all duration-500 group overflow-hidden"
        title="Zurück zum Dashboard">
        <span
            class="material-symbols-rounded text-2xl relative z-10 group-hover:-translate-x-1 transition-transform">arrow_back</span>
    </a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "AUTO THIES",
                shortName: "THIES",
                tagline: "ELITE ENGINEERING & CURATED AUTOMOTIVE TRADING",
                primaryColor: "#EAB308",
                logo: "images/logo.png"
            },
            hero: {
                title: "EST. 1926",
                subtitle: "ENGINEERING & SALES",
                desc: "Die Evolution des Automobils am Kleinen Schippsee. Wo Tradition auf die Zukunft der Mobilität trifft.",
                image: "../../images/mocks/Porsche1.avif"
            },
            services: [
                {
                    title: "TRANSFERS & SALES",
                    icon: "directions_car",
                    desc: "Selektive Fahrzeugauswahl mit geprüfter Historie und Transparenz.",
                    image: "../../images/mocks/Lights.avif"
                },
                {
                    title: "ENGINEERING HUB",
                    icon: "precision_manufacturing",
                    desc: "Meistergeführte Werkstatt für technologische Präzision und Werterhalt.",
                    image: "../../images/mocks/werkstatt.avif"
                },
                {
                    title: "CLASSIC DIVISION",
                    icon: "history",
                    desc: "Spezialisiert auf die Vermittlung und Pflege automobiler Klassiker.",
                    image: "../../images/mocks/Oldtimer1.avif"
                },
                {
                    title: "FINANCIAL SERVICES",
                    icon: "payments",
                    desc: "Strukturierte Finanzierungsmodelle für Ihren individuellen Fuhrpark.",
                    image: "../../images/mocks/Nahaufnahme1.avif"
                }
            ],
            metrics: [
                { val: "90+", label: "JAHRE" },
                { val: "100%", label: "INHABERGEFÜHRT" },
                { val: "HH", label: "HARBURG" }
            ],
            contact: {
                phone: "040-767 30 60",
                email: "info@thies-automobile.de",
                address: "Kleiner Schippsee 7-9, 21073 Hamburg",
                hours: "Mo-Fr: 08:30-18:00 | Sa: 09:00-14:00"
            },
            inventory: [
                { name: "FORD MUSTANG GT", price: "64.900 €", details: "V8 POWER | 450 PS | ROCKET SILVER", image: "../../images/mocks/Mustang1.avif" },
                { name: "AUDI RS E-TRON", price: "158.900 €", details: "QUATTRO | 646 PS | MATRIX LED", image: "../../images/mocks/Audi2.avif" },
                { name: "MERCEDES AMG GT", price: "182.000 €", details: "V8 BITURBO | PERFORMANCE PLUS", image: "../../images/mocks/Mercedes1.avif" }
            ]
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-[100] transition-all duration-700 ${scrolled ? 'py-3 glass-ultra border-b border-yellow-500/20' : 'py-6 bg-transparent'}`}>
                    <div className="max-w-screen-2xl mx-auto px-8 lg:px-12 flex justify-between items-center">
                        <a href="#" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="flex items-center gap-4 hover:opacity-80 transition-opacity">
                            <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-10 w-auto" />
                            <div className="hidden md:block text-left">
                                <div className="font-display font-black text-xl tracking-wider neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] text-gray-500 uppercase tracking-[0.3em] font-bold">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden lg:flex items-center gap-12 font-display">
                            <div className="flex gap-10 text-[9px] font-black uppercase tracking-[0.25em] text-gray-400">
                                <a href="#services" className="hover:text-yellow-500 transition-colors">SERVICES</a>
                                <a href="#inventory" className="hover:text-yellow-500 transition-colors">TRADING</a>
                                <a href="#contact" className="hover:text-yellow-500 transition-colors">KONTAKT</a>
                            </div>
                            <a href={`tel:${CONFIG.contact.phone}`} className="neon-border bg-black text-yellow-500 font-display font-black text-[10px] px-8 py-4 uppercase tracking-[0.25em] hover:bg-yellow-500 hover:text-black transition-all duration-300">
                                CALL NOW
                            </a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-end overflow-hidden grid-pattern">
                <div className="absolute inset-0 z-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover cinematic-hero opacity-40" alt="Hero" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
                </div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12 pt-40 pb-24 w-full">
                    <div className="max-w-5xl">
                        <h1 className="font-display font-black text-7xl md:text-[10rem] leading-[0.85] tracking-tighter mb-8">
                            {CONFIG.hero.title}
                            <br />
                            <span className="neon-text italic flex items-center gap-12">
                                <span className="h-[3px] w-32 md:w-60 bg-gradient-to-r from-yellow-500 to-transparent hidden md:block"></span>
                                {CONFIG.hero.subtitle}
                            </span>
                        </h1>

                        <p className="text-xl md:text-3xl text-gray-300 font-light max-w-2xl mb-16 leading-relaxed">
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-wrap gap-12 md:gap-24 pt-12 border-t border-white/10">
                            {CONFIG.metrics.map((m, i) => (
                                <div key={i}>
                                    <div className="font-display text-5xl font-black neon-text mb-2">{m.val}</div>
                                    <div className="text-[9px] uppercase font-black tracking-[0.3em] text-gray-600">{m.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute inset-0 grid-pattern opacity-30"></div>
                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-32 gap-12">
                        <div className="max-w-3xl">
                            <div className="inline-block neon-border bg-black px-4 py-2 rounded-full text-yellow-500 text-[9px] font-black uppercase tracking-[0.3em] mb-8">
                                HAMBURG SELECTION
                            </div>
                            <h2 className="font-display text-6xl md:text-9xl font-black tracking-tighter uppercase mb-6 leading-none">
                                LEGACY &<br />
                                <span className="neon-text italic">FUTURE</span>
                            </h2>
                        </div>
                        <div className="text-gray-500 text-lg max-w-md font-light leading-relaxed font-display">
                            Vom Oldtimer bis zum modernen Hochleistungs-PKW – Auto Thies ist Ihre Institution am Schippsee.
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((s, i) => (
                            <div key={i} className="ultra-card glass-ultra rounded-2xl overflow-hidden group cursor-default">
                                <div className="h-64 overflow-hidden relative">
                                    <img src={s.image} className="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-110 transition-all duration-700 opacity-50 group-hover:opacity-100" alt={s.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center text-yellow-500 mb-8 transition-all duration-500">
                                        <span className="material-symbols-rounded text-4xl">{s.icon}</span>
                                    </div>
                                    <h3 className="font-display text-xl font-black mb-6 uppercase tracking-tight">{s.title}</h3>
                                    <p className="text-gray-400 text-sm font-light leading-relaxed">{s.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Inventory = () => (
            <section id="inventory" className="py-40 bg-black relative">
                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="text-center mb-32">
                        <div className="inline-block neon-border px-6 py-2 rounded-full text-yellow-500 text-[10px] font-black uppercase tracking-[0.4em] mb-8">
                            CURATED INVENTORY
                        </div>
                        <h2 className="font-display text-5xl md:text-8xl font-black uppercase tracking-tighter leading-none mb-4">
                            AUTOMOTIVE <span className="neon-text italic">TRADING</span>
                        </h2>
                    </div>

                    <div className="grid lg:grid-cols-3 gap-12">
                        {CONFIG.inventory.map((car, i) => (
                            <div key={i} className="ultra-card glass-ultra rounded-[2rem] overflow-hidden border border-yellow-500/10 group">
                                <div className="h-80 overflow-hidden relative">
                                    <img src={car.image} className="w-full h-full object-cover group-hover:scale-110 transition-all duration-[1.5s]" alt={car.name} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                                    <div className="absolute bottom-8 left-8 right-8 flex justify-between items-end">
                                        <div>
                                            <div className="text-[10px] font-black text-yellow-500 tracking-[0.2em] mb-2">AVAILABLE NOW</div>
                                            <h3 className="font-display text-2xl font-black uppercase">{car.name}</h3>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-10">
                                    <div className="font-display text-[9px] text-gray-600 tracking-[0.3em] font-black mb-8 border-b border-white/5 pb-4">
                                        SPECIFICATIONS : {car.details}
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <div className="font-display text-4xl font-black neon-text">{car.price}</div>
                                        <a href="#contact" className="h-14 w-14 neon-border rounded-full flex items-center justify-center group-hover:bg-yellow-500 group-hover:text-black transition-all duration-500">
                                            <span className="material-symbols-rounded">arrow_outward</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-40 bg-black relative overflow-hidden">
                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="glass-ultra neon-border p-8 md:p-20 rounded-3xl">
                        <div className="text-center mb-16">
                            <h2 className="font-display text-5xl md:text-[8rem] font-black uppercase tracking-tighter leading-none mb-8">
                                GET IN<br />
                                <span className="neon-text italic text-4xl md:text-8xl">TOUCH</span>
                            </h2>
                        </div>

                        <div className="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                            <div className="glass-ultra neon-border p-8 rounded-2xl flex items-center gap-6">
                                <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center text-yellow-500">
                                    <span className="material-symbols-rounded text-3xl">call</span>
                                </div>
                                <div>
                                    <div className="text-[9px] uppercase font-black tracking-[0.3em] text-gray-500 mb-2">DIRECT LINE</div>
                                    <div className="font-display text-2xl font-black neon-text">{CONFIG.contact.phone}</div>
                                </div>
                            </div>
                            <div className="glass-ultra neon-border p-8 rounded-2xl flex items-center gap-6">
                                <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center text-yellow-500">
                                    <span className="material-symbols-rounded text-3xl">location_on</span>
                                </div>
                                <div>
                                    <div className="text-[9px] uppercase font-black tracking-[0.3em] text-gray-500 mb-2">LOCATION</div>
                                    <div className="font-display text-sm font-black leading-tight uppercase">{CONFIG.contact.address}</div>
                                </div>
                            </div>
                        </div>

                        <div className="mt-12 text-center">
                            <div className="inline-block px-12 py-6 neon-border font-display font-black tracking-widest text-yellow-500 uppercase">
                                {CONFIG.contact.hours}
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 bg-black border-t border-yellow-500/10">
                <div className="max-w-screen-2xl mx-auto px-8 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-12">
                    <div className="flex items-center gap-6">
                        <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-8 w-auto opacity-70" />
                        <div>
                            <div className="font-display font-black text-sm tracking-widest text-gray-600">{CONFIG.company.name}</div>
                            <div className="text-[8px] uppercase tracking-[0.3em] text-gray-800 font-bold">SINCE 1926 | ALL RIGHTS RESERVED</div>
                        </div>
                    </div>
                    <div className="flex gap-12 text-[9px] font-black uppercase tracking-[0.3em] text-gray-700">
                        <a href="#" className="hover:text-yellow-500 transition-colors">IMPRINT</a>
                        <a href="#" className="hover:text-yellow-500 transition-colors">PRIVACY</a>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Inventory />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="glass-ultra neon-border p-5 flex items-center justify-between rounded-2xl">
                        <div>
                            <div className="text-[8px] uppercase font-black tracking-[0.3em] text-gray-600">DIRECT LINE</div>
                            <div className="font-display text-lg font-black neon-text">CALL NOW</div>
                        </div>
                        <div className="neon-border p-3 rounded-xl neon-text">
                            <span className="material-symbols-rounded text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
