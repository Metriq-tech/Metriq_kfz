<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Elite Autoglas | Eckelmann Diagnostics</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React (Production) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

    <style>
        :root {
            --neon-primary: #FDE800;
            /* Neon Yellow */
            --neon-secondary: #fef08a;
            --bg-ultra-dark: #000000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ultra-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
        }

        /* Cinematic Hero Animation */
        @keyframes cinematicZoom {
            0% {
                transform: scale(1.3);
                opacity: 0;
                filter: blur(20px);
            }

            100% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        .cinematic-hero {
            animation: cinematicZoom 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 1023px) {
            .cinematic-hero {
                animation: none;
                opacity: 1;
                transform: none;
                filter: none;
            }
        }

        /* Neon Glow Effects */
        .neon-glow {
            box-shadow: none;
        }

        .neon-text {
            color: var(--neon-primary);
            text-shadow: none;
        }

        .neon-border {
            border: 2px solid var(--neon-primary);
            box-shadow: none;
        }

        /* Ultra Premium Card Hover */
        .ultra-card {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .ultra-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: rgba(255, 255, 255, 0.2);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .ultra-card:hover::before {
            opacity: 1;
        }

        .ultra-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        /* Floating Animation */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @media (max-width: 1023px) {
            .floating {
                display: none;
            }
        }

        /* Text Reveal Animation */
        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translateY(50px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .reveal-text {
            animation: textReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-1 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .stagger-2 {
            animation-delay: 0.4s;
            opacity: 0;
        }

        /* Glassmorphism Ultra */
        .glass-ultra {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(250, 204, 21, 0.1);
        }

        @media (max-width: 1023px) {
            .glass-ultra {
                backdrop-filter: none;
                background: rgba(0, 0, 0, 0.75);
            }
        }

        /* Grid Pattern Background */
        .grid-pattern {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .material-symbols-rounded {
            display: inline-block;
            overflow: hidden;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            font-display: block;
        }
    </style>
</head>

<body>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[10001] flex items-center justify-center w-12 h-12 bg-white/10 backdrop-blur-xl border border-white/20 rounded-xl shadow-2xl text-white hover:bg-yellow-400 hover:text-black transition-all duration-500 group overflow-hidden"
        title="Zurück zum Dashboard">
        <div
            class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
        </div>
        <span
            class="material-symbols-rounded text-2xl relative z-10 group-hover:-translate-x-1 transition-transform">arrow_back</span>
    </a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "ECKELMANN AUTOGLAS",
                shortName: "EA",
                tagline: "NEXT GENERATION REPAIR",
                primaryColor: "#FDE800",
                logo: "images/Logo.png"
            },
            hero: {
                title: "ULTRA",
                subtitle: "PREZISION",
                desc: "Hightech-Reparatur für anspruchsvolle Fahrzeugverglasung. Wo digitale Präzision auf handwerkliche Meisterschaft trifft.",
                image: "../../images/mocks/Frontscheibe4.jpg"
            },
            services: [
                {
                    title: "LASER REPAIR",
                    icon: "healing",
                    desc: "Hauchdünne, präzise Steinschlag-Reparatur in Rekordzeit – meist vollständig von der Kasko gedeckt.",
                    image: "../../images/mocks/steinschlag.jpg"
                },
                {
                    title: "HIGH-TECH EXCHANGE",
                    icon: "grid_view",
                    desc: "Millimetergenauer Scheibenaustausch in Erstausrüsterqualität für volle strukturelle Integrität.",
                    image: "../../images/mocks/Glas-Reparatur1.jpg"
                },
                {
                    title: "DIGITAL SETTLEMENT",
                    icon: "description",
                    desc: "Nahtlose, digitale Schadensabwicklung direkt mit Ihrer Versicherung – stressfrei und hocheffizient.",
                    image: "../../images/mocks/Frontscheibe3.png"
                },
                {
                    title: "MOBILITY LOGISTICS",
                    icon: "local_shipping",
                    desc: "Exklusiver Hol- und Bringdienst im Raum Hamburg inklusive Ersatzfahrzeug für Ihre volle Freiheit.",
                    image: "images/wagen1.jpg"
                }
            ],
            metrics: [
                { val: "SOFORT", label: "REPARATUR" },
                { val: "MOBIL", label: "SERVICE" },
                { val: "100%", label: "PRÄZISION" }
            ],
            contact: {
                phone: "0172-5910051",
                email: "thomas.eckelmann@gmail.com",
                address: "Herzog-Alf-Weg 6A, 22457 Hamburg"
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-[100] transition-all duration-700 ${scrolled ? 'py-3 glass-ultra' : 'py-6 bg-transparent'}`}>
                    <div className="max-w-screen-2xl mx-auto px-8 lg:px-12 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-4 hover:opacity-80 transition-all duration-300 group">
                            <img src={CONFIG.company.logo} alt="Logo" className="h-14 w-auto object-contain group-hover:scale-110 transition-transform duration-500 [filter:drop-shadow(0_0_1px_rgba(255,255,255,0.9))_drop-shadow(0_0_12px_rgba(255,255,255,0.3))]" />
                            <div className="hidden md:block">
                                <div className="font-display font-black text-xl tracking-wider neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] text-white uppercase tracking-[0.3em] font-bold">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="flex items-center gap-12">
                            <div className="hidden lg:flex gap-10 text-[9px] font-black uppercase tracking-[0.25em] text-white">
                                <a href="#services" className="hover:text-[#FDE800] transition-colors">SERVICES</a>
                                <a href="#contact" className="hover:text-[#FDE800] transition-colors">CONTACT</a>
                            </div>
                            <button className="neon-border bg-black text-yellow-500 font-display font-black text-[9px] px-8 py-4 uppercase tracking-[0.25em] hover:bg-yellow-400 hover:text-black transition-all duration-300">
                                JETZT ANFRAGEN
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-end overflow-hidden grid-pattern">
                {/* Animated Background */}
                <div className="absolute inset-0 z-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover cinematic-hero" alt="Elite Vehicle" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-black/80 via-transparent to-transparent"></div>
                </div>

                {/* Floating Neon Orbs */}
                <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-yellow-400 rounded-full blur-[150px] opacity-20 floating"></div>

                {/* Content */}
                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12 pt-40 pb-24 w-full">
                    <div className="max-w-5xl">
                        <h1 className="font-display font-black text-7xl md:text-[10rem] leading-[0.85] tracking-tighter mb-8 reveal-text">
                            {CONFIG.hero.title}
                            <br />
                            <span className="neon-text italic flex items-center gap-12 text-5xl md:text-9xl">
                                <span className="h-[3px] w-32 md:w-60 bg-gradient-to-r from-yellow-400 to-transparent hidden md:block"></span>
                                {CONFIG.hero.subtitle}
                            </span>
                        </h1>

                        <p className="text-xl md:text-3xl text-gray-300 font-light max-w-3xl mb-16 leading-relaxed reveal-text stagger-1">
                            {CONFIG.hero.desc}
                        </p>

                        {/* Metrics */}
                        <div className="flex flex-wrap gap-16 pt-12 border-t border-white/10 reveal-text stagger-2">
                            {CONFIG.metrics.map((m, i) => (
                                <div key={i}>
                                    <div className="font-display text-5xl font-black neon-text mb-2">{m.val}</div>
                                    <div className="text-[9px] uppercase font-black tracking-[0.3em] text-gray-600">{m.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute inset-0 grid-pattern opacity-30"></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    {/* Section Header */}
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-32 gap-12">
                        <div className="max-w-3xl">
                            <div className="inline-block neon-border bg-black px-4 py-2 rounded-full text-yellow-400 text-[9px] font-black uppercase tracking-[0.3em] mb-8">
                                SCANNING SERVICES
                            </div>
                            <h2 className="font-display text-6xl md:text-9xl font-black tracking-tighter uppercase mb-6">
                                BEYOND<br />
                                <span className="neon-text italic">VISION</span>
                            </h2>
                        </div>
                        <div className="text-gray-400 text-lg max-w-md font-light leading-relaxed">
                            Jeder Glasschaden wird digital analysiert. Wir garantieren höchste Strukturfestigkeit nach jedem Einsatz.
                        </div>
                    </div>

                    {/* Services Grid */}
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((s, i) => (
                            <div key={i} className="ultra-card glass-ultra rounded-2xl overflow-hidden group cursor-default">
                                <div className="h-64 overflow-hidden relative">
                                    <img src={s.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={s.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center text-yellow-500 mb-8 group-hover:neon-glow transition-all duration-500">
                                        <span className="material-symbols-rounded text-4xl">{s.icon}</span>
                                    </div>
                                    <h3 className="font-display text-xl font-black mb-6 uppercase tracking-tight">{s.title}</h3>
                                    <p className="text-gray-400 text-sm font-light leading-relaxed">{s.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute top-0 left-1/3 w-[800px] h-[800px] bg-yellow-400 blur-[200px] opacity-10"></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="glass-ultra neon-border p-6 md:p-20 rounded-3xl">
                        {/* Header - Centered */}
                        <div className="text-center mb-12 md:mb-20">
                            <h2 className="font-display text-4xl sm:text-6xl md:text-8xl lg:text-9xl font-black uppercase tracking-tighter leading-none mb-6 md:mb-8">
                                INITIALIZE<br />
                                <span className="neon-text italic">REPAIR</span>
                            </h2>
                            <p className="text-gray-400 text-base md:text-xl font-light max-w-2xl mx-auto leading-relaxed px-4">
                                Schnelle Hilfe per Knopfdruck. Unser Team ist bereit für Ihren Einsatz im Raum Hamburg.
                            </p>
                        </div>

                        {/* Contact Cards - Grid */}
                        <div className="grid md:grid-cols-2 gap-4 md:gap-8 max-w-4xl mx-auto">
                            <div className="glass-ultra neon-border p-6 md:p-8 rounded-2xl">
                                <div className="flex items-center md:items-start gap-4 md:gap-6">
                                    <div className="w-12 h-12 md:w-16 md:h-16 neon-border rounded-xl flex items-center justify-center flex-shrink-0 neon-text">
                                        <span className="material-symbols-rounded text-2xl md:text-3xl">call</span>
                                    </div>
                                    <div>
                                        <div className="text-[8px] md:text-9px uppercase font-black tracking-[0.3em] text-gray-600 mb-1 md:mb-3">AUTOGLAS HOTLINE</div>
                                        <div className="font-display text-xl md:text-3xl font-black neon-text">{CONFIG.contact.phone}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-ultra neon-border p-6 md:p-8 rounded-2xl">
                                <div className="flex items-center md:items-start gap-4 md:gap-6">
                                    <div className="w-12 h-12 md:w-16 md:h-16 neon-border rounded-xl flex items-center justify-center flex-shrink-0 neon-text">
                                        <span className="material-symbols-rounded text-2xl md:text-3xl">email</span>
                                    </div>
                                    <div>
                                        <div className="text-[8px] md:text-9px uppercase font-black tracking-[0.3em] text-gray-600 mb-1 md:mb-3">SUPPORT</div>
                                        <div className="text-[10px] md:text-lg font-bold whitespace-nowrap">{CONFIG.contact.email}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* CTA Button */}
                        <div className="mt-8 md:mt-12 max-w-2xl mx-auto">
                            <button className="w-full neon-border bg-black text-yellow-500 font-display font-black text-xs md:text-sm px-8 md:px-12 py-5 md:py-6 uppercase tracking-[0.25em] hover:bg-yellow-400 hover:text-black transition-all duration-300 neon-glow">
                                TERMIN VEREINBAREN
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 border-t border-white/5 bg-black">
                <div className="max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-12">
                        <div className="flex items-center gap-6">
                            <a href="#" className="group block">
                                <img src={CONFIG.company.logo} alt="Logo" className="h-14 w-auto object-contain opacity-50 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500 [filter:grayscale(1)_drop-shadow(0_0_1px_rgba(255,255,255,0.8))_drop-shadow(0_0_8px_rgba(255,255,255,0.2))] group-hover:[filter:grayscale(0)_drop-shadow(0_0_1px_rgba(255,255,255,0.8))_drop-shadow(0_0_8px_rgba(255,255,255,0.2))]" />
                            </a>
                            <div>
                                <div className="font-display font-black text-sm tracking-wider neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] text-white uppercase tracking-[0.3em] font-bold mb-1">{CONFIG.company.tagline}</div>
                                <div className="text-[8px] uppercase tracking-[0.4em] text-gray-700 font-bold">© 2026 ALL RIGHTS RESERVED</div>
                            </div>
                        </div>
                        <div className="flex gap-12 text-[9px] font-black uppercase tracking-[0.3em] text-gray-700">
                            <a href="#" className="hover:text-yellow-400 transition-colors">IMPRINT</a>
                            <a href="#" className="hover:text-yellow-400 transition-colors">PRIVACY</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="glass-ultra neon-border p-5 flex items-center justify-between rounded-2xl neon-glow">
                        <div>
                            <div className="text-[8px] uppercase font-black tracking-[0.3em] text-gray-600">HOTLINE</div>
                            <div className="font-display text-lg font-black neon-text">JETZT ANRUFEN</div>
                        </div>
                        <div className="neon-border p-3 rounded-xl neon-text">
                            <span className="material-symbols-rounded text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
