<!DOCTYPE html>
<html class="light" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SAVE INN Eckermann Auspuffschnelldienst | Schnell & Zuverlässig</title>

    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary: #e8302a;
            --secondary: #1e5fad;
            --bg-light: #f9fafb;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .simple-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .simple-card {
            transition: transform 0.2s ease;
        }

        .simple-card:hover {
            transform: translateY(-4px);
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-white/80 backdrop-blur-md border border-gray-200 rounded-full shadow-lg text-[#e8302a] hover:bg-[#e8302a] hover:text-white transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "SAVE INN Eckermann",
                shortName: "SAVE INN",
                tagline: "Ihr Auspuffschnelldienst in Hamburg-Harburg",
                primaryColor: "#e8302a",
                secondaryColor: "#1e5fad",
                logo: "images/logo.jpg"
            },
            hero: {
                title: "Schnell. Günstig. Zuverlässig.",
                subtitle: "Auspuffschnelldienst Hamburg-Harburg",
                desc: "SAVE INN Eckermann steht für blitzschnelle Instandsetzung und fachgerechten Austausch von Auspuffanlagen aller Art. Kommen Sie direkt vorbei – wir helfen sofort!",
                image: "../../images/mocks/Werkstatt4.jpg"
            },
            services: [
                { title: "Auspuff-Reparatur", icon: "build", desc: "Schnelle Instandsetzung defekter Auspuffanlagen", price: "ab 49€", image: "../../images/mocks/auspuff2.jpg" },
                { title: "Auspuff-Austausch", icon: "sync", desc: "Kompletttausch für alle Fahrzeugtypen", price: "ab 89€", image: "../../images/mocks/auspuff4.jpg" },
                { title: "Monteur-Service", icon: "engineering", desc: "Professionelle Monteurarbeiten vor Ort", price: "auf Anfrage", image: "../../images/mocks/Werkstatt2.jpg" },
                { title: "Schnell-Check", icon: "search", desc: "Kostenlose Sichtprüfung Ihrer Anlage", price: "kostenlos", image: "../../images/mocks/tiefendiagnose.avif" }
            ],
            contact: {
                phone: "+49 40 773192",
                address: "Küchgarten 21, 21073 Hamburg-Harburg",
                hours: "Mo–Fr: 08:00 – 17:00 Uhr"
            },
            reviews: {
                rating: 4.7,
                total: 42,
                list: [
                    { name: "Klaus M.", date: "Vor 1 Woche", text: "Super schnell und fair! Auspuff wurde innerhalb einer Stunde getauscht. Absolut empfehlenswert.", stars: 5 },
                    { name: "Sandra T.", date: "Vor 1 Monat", text: "Direkte Hilfe, kein Termin nötig, Preis war sehr angemessen. Genau so muss ein Schnelldienst sein!", stars: 5 },
                    { name: "Peter W.", date: "Vor 3 Monaten", text: "Kompetente Beratung und schnelle Reparatur. Mein Auto fährt wieder ruhig und ohne Lärm.", stars: 4 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`sticky top-0 z-50 bg-white transition-all duration-300 ${scrolled ? 'shadow-md' : ''}`}>
                    <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-16 w-auto object-contain" />
                            <div>
                                <div className="font-bold text-lg leading-tight">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden md:flex items-center gap-6">
                            <a href="#services" className="text-sm font-semibold hover:text-[#e8302a] transition-colors">Leistungen</a>
                            <a href="#contact" className="bg-[#e8302a] text-white px-5 py-2 rounded text-sm font-bold hover:bg-red-700 transition-colors">Kontakt</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="bg-white">
                <div className="max-w-6xl mx-auto px-4 py-16 md:py-24">
                    <div className="grid md:grid-cols-2 gap-12 items-center">
                        <div>
                            <div className="inline-block bg-red-100 text-[#e8302a] px-3 py-1 rounded-full text-xs font-bold uppercase mb-6">
                                Auspuffschnelldienst
                            </div>
                            <h1 className="text-4xl md:text-6xl font-bold leading-tight mb-6">
                                {CONFIG.hero.title}
                            </h1>
                            <p className="text-xl text-gray-600 mb-4 font-medium">{CONFIG.hero.subtitle}</p>
                            <p className="text-gray-600 mb-8 leading-relaxed">{CONFIG.hero.desc}</p>

                            <div className="flex flex-col sm:flex-row gap-4 mb-12">
                                <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#e8302a] text-white px-8 py-4 rounded-lg font-bold text-center hover:bg-red-700 transition-colors">
                                    Jetzt anrufen
                                </a>
                                <a href="#services" className="border-2 border-[#1e5fad] text-[#1e5fad] px-8 py-4 rounded-lg font-bold text-center hover:bg-[#1e5fad] hover:text-white transition-colors">
                                    Unsere Leistungen
                                </a>
                            </div>

                            {/* Trust Indicators */}
                            <div className="flex gap-8 pt-8 border-t border-gray-200">
                                <div>
                                    <div className="text-2xl font-bold text-[#e8302a]">Sofort</div>
                                    <div className="text-sm text-gray-600">Ohne Termin</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#e8302a]">Fair</div>
                                    <div className="text-sm text-gray-600">Festpreise</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#e8302a]">Schnell</div>
                                    <div className="text-sm text-gray-600">Kurze Wartezeit</div>
                                </div>
                            </div>
                        </div>

                        <div className="relative">
                            <div className="rounded-2xl overflow-hidden simple-shadow">
                                <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Werkstatt" />
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-20 bg-gray-50">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl md:text-5xl font-bold mb-4">Unsere Leistungen</h2>
                        <p className="text-gray-600 text-lg">Spezialisiert auf Auspuffanlagen aller Fahrzeugtypen</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-white rounded-xl overflow-hidden simple-shadow simple-card">
                                <div className="h-40 overflow-hidden">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                </div>
                                <div className="p-6">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="material-symbols-outlined text-[#e8302a] text-3xl">{service.icon}</span>
                                        <h3 className="text-xl font-bold">{service.title}</h3>
                                    </div>
                                    <p className="text-gray-600 mb-4">{service.desc}</p>
                                    <div className="text-[#1e5fad] font-bold text-lg">{service.price}</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Additional Info */}
                    <div className="mt-16 bg-white rounded-2xl p-8 simple-shadow">
                        <div className="grid md:grid-cols-3 gap-8 text-center">
                            <div>
                                <span className="material-symbols-outlined text-[#e8302a] text-4xl mb-3">bolt</span>
                                <h4 className="font-bold mb-2">Schnelldienst</h4>
                                <p className="text-sm text-gray-600">Reparatur oft noch am selben Tag</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-[#e8302a] text-4xl mb-3">schedule</span>
                                <h4 className="font-bold mb-2">Ohne Termin</h4>
                                <p className="text-sm text-gray-600">Einfach vorbeikommen</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-[#e8302a] text-4xl mb-3">euro</span>
                                <h4 className="font-bold mb-2">Faire Preise</h4>
                                <p className="text-sm text-gray-600">Transparente Kostenaufstellung</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Reviews = () => (
            <section id="reviews" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row items-center justify-between mb-12 gap-8">
                        <div>
                            <h2 className="text-3xl md:text-5xl font-bold mb-4">Das sagen unsere Kunden</h2>
                            <p className="text-gray-600 text-lg">Schnell geholfen – zufrieden gefahren</p>
                        </div>
                        <div className="bg-gray-50 p-6 rounded-2xl flex items-center gap-6 border border-gray-100 simple-shadow">
                            <div className="text-center">
                                <div className="text-4xl font-bold text-gray-900">{CONFIG.reviews.rating}</div>
                                <div className="flex text-yellow-400">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined fill-1">star</span>
                                    ))}
                                </div>
                            </div>
                            <div className="h-12 w-px bg-gray-200"></div>
                            <div>
                                <div className="font-bold text-gray-900">Google Bewertung</div>
                                <div className="text-sm text-gray-500">{CONFIG.reviews.total} Rezensionen</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        {CONFIG.reviews.list.map((review, i) => (
                            <div key={i} className="bg-gray-50 p-8 rounded-xl border border-gray-100 simple-card">
                                <div className="flex gap-1 text-yellow-400 mb-4">
                                    {[...Array(review.stars)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined text-sm fill-1">star</span>
                                    ))}
                                </div>
                                <p className="text-gray-700 mb-6 italic">"{review.text}"</p>
                                <div>
                                    <div className="font-bold text-gray-900">{review.name}</div>
                                    <div className="text-xs text-gray-500">{review.date} via Google</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="text-center mt-12">
                        <a href="#" className="inline-flex items-center gap-2 text-[#e8302a] font-bold hover:underline">
                            Alle Bewertungen auf Google lesen
                            <span className="material-symbols-outlined">open_in_new</span>
                        </a>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="bg-[#e8302a] text-white rounded-2xl p-6 sm:p-12 md:p-16">
                        <div className="grid md:grid-cols-2 gap-8 md:gap-12">
                            <div>
                                <h2 className="text-3xl md:text-5xl font-bold mb-4 md:mb-6">Wir sind für Sie da!</h2>
                                <p className="text-lg md:text-xl mb-6 md:mb-8 text-red-100">Kommen Sie direkt vorbei oder rufen Sie uns an – kein Termin nötig!</p>

                                <div className="space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-red-100 font-bold uppercase tracking-wider mb-1">Telefon</div>
                                            <div className="text-xl md:text-2xl font-bold tracking-tight">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-red-100 font-bold uppercase tracking-wider mb-1">Adresse</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-red-100 font-bold uppercase tracking-wider mb-1">Öffnungszeiten</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.hours}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center justify-center mt-8 md:mt-0">
                                <div className="bg-white/10 backdrop-blur-sm rounded-2xl p-6 md:p-8 text-center w-full">
                                    <span className="material-symbols-outlined text-5xl md:text-6xl mb-4">directions_car</span>
                                    <h3 className="text-xl md:text-2xl font-bold mb-3 md:mb-4">Sofort vorbeikommen</h3>
                                    <p className="text-red-100 mb-6 text-sm md:text-base">Kein Termin nötig. Wir kümmern uns schnell und fair um Ihre Auspuffanlage.</p>
                                    <a href={`https://maps.google.com/?q=${encodeURIComponent(CONFIG.contact.address)}`} target="_blank" className="inline-block w-full sm:w-auto bg-white text-[#e8302a] px-8 py-3 rounded-lg font-bold hover:bg-red-50 transition-colors">
                                        Anfahrt anzeigen
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-12 bg-gray-100 border-t border-gray-200">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-3">
                            <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-14 w-auto object-contain grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
                            <div className="text-sm">
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-gray-500 text-xs">© 2026 Alle Rechte vorbehalten</div>
                            </div>
                        </div>
                        <div className="flex gap-6 text-sm text-gray-600">
                            <a href="#" className="hover:text-[#e8302a] transition-colors">Impressum</a>
                            <a href="#" className="hover:text-[#e8302a] transition-colors">Datenschutz</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Reviews />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-4 left-4 right-4 md:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#e8302a] text-white flex justify-between items-center p-4 rounded-xl shadow-lg">
                        <div>
                            <div className="text-xs text-red-200">Jetzt anrufen</div>
                            <div className="font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <span className="material-symbols-outlined text-3xl">call</span>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
