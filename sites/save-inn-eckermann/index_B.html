<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SAVE INN Eckermann | Auspuffschnelldienst Hamburg-Harburg</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React (Production) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

    <style>
        :root {
            --primary: #e8302a;
            --bg-dark: #0a0a0f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .gradient-overlay {
            background: linear-gradient(135deg, rgba(232, 48, 42, 0.9) 0%, rgba(29, 98, 165, 0.7) 100%);
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(232, 48, 42, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-shadow-strong {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>

<body>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full shadow-2xl text-white hover:bg-white hover:text-black transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "SAVE INN Eckermann",
                shortName: "SIE",
                tagline: "Auspuffschnelldienst Hamburg-Harburg",
                primaryColor: "#e8302a",
                secondaryColor: "#1D62A5",
                logo: "images/logo.jpg"
            },
            hero: {
                title: "Kein Lärm mehr.",
                subtitle: "Ihr Auspuffprofi in Hamburg-Harburg",
                desc: "Defekter Auspuff? Wir reparieren oder tauschen sofort – ohne Termin, ohne Wartezeit. SAVE INN Eckermann – der Schnelldienst, dem Hamburg vertraut.",
                image: "../../images/mocks/auspuff4.jpg"
            },
            services: [
                {
                    title: "Auspuff-Reparatur",
                    icon: "build",
                    desc: "Schnelle und fachgerechte Instandsetzung Ihrer defekten Auspuffanlage.",
                    image: "../../images/mocks/auspuff2.jpg"
                },
                {
                    title: "Komplett-Austausch",
                    icon: "sync",
                    desc: "Professioneller Komplett-Tausch für alle Fahrzeugtypen – PKW und Transporter.",
                    image: "../../images/mocks/auspuff1.jpg"
                },
                {
                    title: "Monteur-Service",
                    icon: "engineering",
                    desc: "Professionelle Montage und Einstellung aller Abgasanlagen-Komponenten.",
                    image: "../../images/mocks/Werkstatt2.jpg"
                },
                {
                    title: "Gratis-Check",
                    icon: "search",
                    desc: "Kostenlose Sichtprüfung und Beratung zu Ihrem Auspuffsystem.",
                    image: "../../images/mocks/Werkstatt4.jpg"
                }
            ],
            brands: ["PKW", "Transporter", "Kombi", "SUV", "Van", "Alle Typen"],
            contact: {
                phone: "+49 40 773192",
                email: "info@save-inn-eckermann.de",
                address: "Küchgarten 21, 21073 Hamburg-Harburg",
                addressLine1: "Küchgarten 21,",
                addressLine2: "21073 Hamburg-Harburg",
                hours: "Mo–Fr: 08:00 – 17:00 Uhr"
            },
            reviews: {
                rating: 4.7,
                total: 42,
                list: [
                    { name: "Klaus M.", date: "Vor 1 Woche", text: "Blitzschnell und fair! Auspuff in einer Stunde getauscht. Einfach vorgefahren, direkt geholfen.", stars: 5 },
                    { name: "Sandra T.", date: "Vor 1 Monat", text: "Perfekter Schnelldienst – kein Termin, günstiger Preis, saubere Arbeit. Sehr empfehlenswert!", stars: 5 },
                    { name: "Peter W.", date: "Vor 3 Monaten", text: "Kompetente Beratung und schnelle Reparatur. Fährt jetzt wieder leise und einwandfrei.", stars: 4 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-[#0a0a0f]/95 backdrop-blur-xl py-4 border-b border-white/5' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 lg:px-10 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-16 w-auto object-contain" />
                            <div className="hidden md:block">
                                <div className="text-lg font-bold tracking-tight">{CONFIG.company.name}</div>
                                <div className="text-[10px] text-gray-400 uppercase tracking-wider">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden lg:flex items-center gap-10 text-sm font-semibold">
                            <a href="#services" className="hover:text-[#e8302a] transition-colors">Leistungen</a>
                            <a href="#reviews" className="hover:text-[#e8302a] transition-colors">Bewertungen</a>
                            <a href="#contact" className="bg-[#e8302a] px-6 py-3 rounded-xl hover:bg-red-700 transition-all">Kontakt</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-center overflow-hidden">
                {/* Background Image */}
                <div className="absolute inset-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Hero" />
                    <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                </div>

                {/* Content */}
                <div className="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 py-32">
                    <div className="max-w-3xl">
                        <div className="inline-block bg-[#e8302a]/20 border border-[#e8302a]/30 backdrop-blur-sm px-4 py-2 rounded-full text-[#e8302a] text-xs font-bold uppercase tracking-widest mb-8 animate-fade-in-up">
                            Auspuffschnelldienst Hamburg-Harburg
                        </div>

                        <h1 className="text-6xl md:text-8xl font-black leading-[1.1] tracking-tight mb-6 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                            {CONFIG.hero.title}
                        </h1>

                        <p className="text-xl md:text-2xl text-gray-200 font-medium mb-4 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                            {CONFIG.hero.subtitle}
                        </p>

                        <p className="text-lg text-gray-300 max-w-2xl mb-12 leading-relaxed animate-fade-in-up" style={{ animationDelay: '0.3s' }}>
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-col sm:flex-row gap-5 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
                            <a href="#contact" className="bg-[#e8302a] text-white px-10 py-5 rounded-2xl font-bold text-center shadow-xl shadow-red-600/30 hover:bg-red-700 hover:scale-105 transition-all">
                                Jetzt anrufen
                            </a>
                            <a href="#services" className="bg-white/10 backdrop-blur-md border border-white/20 text-white px-10 py-5 rounded-2xl font-bold text-center hover:bg-white/20 transition-all">
                                Unsere Leistungen
                            </a>
                        </div>

                        {/* Trust Badges */}
                        <div className="flex flex-wrap gap-8 mt-16 pt-8 border-t border-white/10 animate-fade-in-up" style={{ animationDelay: '0.5s' }}>
                            <div>
                                <div className="text-3xl font-black text-[#e8302a]">Sofort</div>
                                <div className="text-sm text-gray-400 font-medium">Ohne Termin</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#e8302a]">4.7★</div>
                                <div className="text-sm text-gray-400 font-medium">Google Bewertung</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#e8302a]">Fair</div>
                                <div className="text-sm text-gray-400 font-medium">Festpreise</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-32 bg-gradient-to-b from-[#0a0a0f] to-[#0f0f1a]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    {/* Section Header */}
                    <div className="text-center mb-20">
                        <div className="inline-block bg-[#e8302a]/10 border border-[#e8302a]/20 px-4 py-2 rounded-full text-[#e8302a] text-xs font-bold uppercase tracking-widest mb-6">
                            Unser Angebot
                        </div>
                        <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">
                            Unser <span className="text-[#e8302a]">Schnelldienst</span>
                        </h2>
                        <p className="text-xl text-gray-400 max-w-3xl mx-auto">
                            Spezialisiert auf Auspuffanlagen – schnell, kompetent und fair für alle Fahrzeugtypen.
                        </p>
                    </div>

                    {/* Services Grid */}
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl overflow-hidden card-hover">
                                <div className="h-56 overflow-hidden relative">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-14 h-14 bg-[#e8302a]/10 border border-[#e8302a]/20 rounded-2xl flex items-center justify-center text-[#e8302a] mb-6">
                                        <span className="material-symbols-outlined text-3xl">{service.icon}</span>
                                    </div>
                                    <h3 className="text-2xl font-bold mb-4">{service.title}</h3>
                                    <p className="text-gray-400 leading-relaxed">{service.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Vehicle Type Bar */}
                    <div className="mt-24 pt-16 border-t border-white/5">
                        <div className="text-center mb-12">
                            <p className="text-sm text-gray-500 uppercase tracking-widest font-bold">Für alle Fahrzeugtypen</p>
                        </div>
                        <div className="flex flex-wrap justify-center gap-8 text-gray-600 font-bold text-lg">
                            {CONFIG.brands.map((brand, i) => (
                                <div key={i} className="px-6 py-3 bg-white/5 rounded-xl border border-white/5 hover:border-[#e8302a]/30 hover:text-[#e8302a] transition-all">
                                    {brand}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Reviews = () => (
            <section id="reviews" className="py-32 bg-[#0d0d16]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col lg:flex-row items-center justify-between mb-20 gap-10">
                        <div className="text-center lg:text-left">
                            <div className="inline-block bg-[#e8302a]/10 border border-[#e8302a]/20 px-4 py-2 rounded-full text-[#e8302a] text-xs font-bold uppercase tracking-widest mb-6">
                                Kundenstimmen
                            </div>
                            <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">Was Kunden <span className="text-[#e8302a]">sagen</span></h2>
                            <p className="text-xl text-gray-400">Schnell geholfen – begeistert gefahren</p>
                        </div>

                        <div className="bg-gray-900/50 backdrop-blur-xl border border-white/5 p-8 rounded-[2rem] flex items-center gap-8 shadow-2xl">
                            <div className="text-center">
                                <div className="text-5xl font-black text-white mb-2">{CONFIG.reviews.rating}</div>
                                <div className="flex text-[#e8302a]">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined fill-1">star</span>
                                    ))}
                                </div>
                            </div>
                            <div className="h-16 w-px bg-white/10"></div>
                            <div>
                                <div className="text-lg font-bold text-white mb-1">Google Rezensionen</div>
                                <div className="text-[#e8302a] font-medium">{CONFIG.reviews.total} Bewertungen</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
                        {CONFIG.reviews.list.map((review, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 p-10 rounded-3xl card-hover">
                                <div className="flex gap-1 text-[#e8302a] mb-6">
                                    {[...Array(review.stars)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined text-sm fill-1">star</span>
                                    ))}
                                </div>
                                <p className="text-gray-300 mb-8 italic text-lg leading-relaxed">"{review.text}"</p>
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-[#e8302a]/20 rounded-full flex items-center justify-center text-[#e8302a] font-bold">
                                        {review.name.charAt(0)}
                                    </div>
                                    <div>
                                        <div className="font-bold text-white">{review.name}</div>
                                        <div className="text-xs text-gray-500 uppercase tracking-widest font-bold">{review.date}</div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-16 text-center">
                        <a href="#" className="inline-flex items-center gap-3 bg-white/5 hover:bg-white/10 border border-white/10 px-8 py-4 rounded-2xl text-white font-bold transition-all">
                            Alle Bewertungen lesen
                            <span className="material-symbols-outlined text-[#e8302a]">open_in_new</span>
                        </a>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-32 bg-[#0a0a0f]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="bg-gradient-to-br from-[#e8302a] to-red-800 rounded-3xl md:rounded-[3rem] overflow-hidden relative">
                        {/* Background Pattern */}
                        <div className="absolute inset-0 opacity-10">
                            <div className="absolute inset-0" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '40px 40px' }}></div>
                        </div>

                        <div className="relative z-10 grid lg:grid-cols-2 gap-8 md:gap-16 p-6 sm:p-12 md:p-16 lg:p-20">
                            {/* Left: CTA */}
                            <div className="flex flex-col justify-center text-center lg:text-left">
                                <h2 className="text-4xl sm:text-5xl md:text-7xl font-black mb-6 md:mb-8 leading-tight">
                                    Kommen Sie<br />einfach<br />vorbei!
                                </h2>
                                <p className="text-lg md:text-xl text-orange-100 mb-10 md:mb-12 leading-relaxed">
                                    Kein Termin nötig. Wir helfen Ihnen sofort und unkompliziert – direkt in Hamburg-Harburg.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 md:gap-5 mb-8 lg:mb-0">
                                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-white text-[#e8302a] px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-gray-100 transition-all shadow-xl">
                                        Jetzt anrufen
                                    </a>
                                    <a href={`https://maps.google.com/?q=${encodeURIComponent(CONFIG.contact.address)}`} target="_blank" className="bg-red-900 text-white px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-red-950 transition-all">
                                        Route planen
                                    </a>
                                </div>
                            </div>

                            {/* Right: Contact Info */}
                            <div className="flex flex-col justify-center space-y-4 md:space-y-8">
                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-red-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Telefon</div>
                                            <div className="text-xl md:text-2xl font-bold tracking-tight">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-red-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Adresse</div>
                                            <div className="text-lg md:text-xl font-bold">
                                                {CONFIG.contact.addressLine1}<br />
                                                {CONFIG.contact.addressLine2}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-red-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Öffnungszeiten</div>
                                            <div className="text-lg md:text-xl font-bold">{CONFIG.contact.hours}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 bg-[#0a0a0f] border-t border-white/5">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                        <div className="flex items-center gap-3">
                            <img src={CONFIG.company.logo} alt={CONFIG.company.name} className="h-14 w-auto object-contain grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
                            <div>
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="flex gap-8 text-sm text-gray-500">
                            <a href="#" className="hover:text-[#e8302a] transition-colors">Impressum</a>
                            <a href="#" className="hover:text-[#e8302a] transition-colors">Datenschutz</a>
                            <a href="#" className="hover:text-[#e8302a] transition-colors">AGB</a>
                        </div>
                    </div>
                    <div className="mt-12 pt-8 border-t border-white/5 text-center text-sm text-gray-600">
                        © 2026 {CONFIG.company.name}. Alle Rechte vorbehalten.
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Reviews />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#e8302a] text-white flex justify-between items-center p-5 rounded-2xl shadow-2xl shadow-red-600/40">
                        <div>
                            <div className="text-xs text-red-200 font-bold uppercase tracking-wider">Direkt anrufen</div>
                            <div className="text-lg font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <div className="bg-white/20 p-3 rounded-xl">
                            <span className="material-symbols-outlined text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
