<!DOCTYPE html>
<html class="light" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lenke KFZ-Technik | Bosch Service Hamburg-Harburg</title>

    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary-color: #cc0000;
            --bg-light: #f9fafb;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .simple-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .simple-card {
            transition: transform 0.2s ease;
        }

        .simple-card:hover {
            transform: translateY(-4px);
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-white/80 backdrop-blur-md border border-gray-200 rounded-full shadow-lg text-[#cc0000] hover:bg-[#cc0000] hover:text-white transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "Lenke KFZ-Technik e.K.",
                shortName: "LKT",
                tagline: "Bosch Service | Ihr Partner in Hamburg-Harburg",
                primaryColor: "#cc0000"
            },
            hero: {
                title: "Faire Preise. Ehrliche Arbeit.",
                subtitle: "Ihre Autowerkstatt in Hamburg-Harburg",
                desc: "Wir bieten Ihnen einen umfangreichen und zuverlässigen Service für Ihr Fahrzeug. Ob Inspektion, Reifenwechsel oder Reparaturen – bei uns sind Sie in besten Händen. Traditionelle Handwerkskunst kombiniert mit modernster Technik.",
                image: "images/Vor_ort.jpg"
            },
            services: [
                { title: "Inspektion", icon: "build", desc: "Wartung nach Herstellervorgaben", price: "auf Anfrage", image: "../../images/mocks/inspektion.avif" },
                { title: "Fahrzeugdiagnose", icon: "memory", desc: "Bosch Computer-Fehlerauslese", price: "auf Anfrage", image: "../../images/mocks/diagnose.avif" },
                { title: "Reifenservice", icon: "tire_repair", desc: "Wechsel & Einlagerung", price: "auf Anfrage", image: "../../images/mocks/reifenservice.avif" },
                { title: "Unfallservice", icon: "car_repair", desc: "Fachgerechte Unfallreparatur", price: "auf Anfrage", image: "../../images/mocks/unfallservice.avif" }
            ],
            contact: {
                phone: "040-7661480",
                email: "info@bosch-lenke.de",
                address: "Großmoorbogen 11, 21079 Hamburg",
                hoursMoDo: "Mo–Do: 7:45–17:00 Uhr",
                hoursFr: "Fr: 7:45–15:00 Uhr"
            },
            reviews: {
                rating: 4.8,
                total: 112,
                list: [
                    { name: "Klaus M.", date: "Vor 2 Wochen", text: "Super Service! Schnell, ehrlich und preiswert. Komme gerne wieder. Bosch-Qualität zum fairen Preis.", stars: 5 },
                    { name: "Sabine R.", date: "Vor 1 Monat", text: "Endlich eine Werkstatt, der man vertrauen kann. Transparente Kostenaufstellung und freundliches Team.", stars: 5 },
                    { name: "Peter H.", date: "Vor 3 Monaten", text: "Top Beratung und kompetente Reparatur. Mein Auto läuft wieder wie neu. Absolute Empfehlung!", stars: 5 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`sticky top-0 z-50 bg-white transition-all duration-300 ${scrolled ? 'shadow-md' : ''}`}>
                    <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <img src="images/Logo.png" alt="Lenke KFZ-Technik Logo" className="h-[78px] w-auto object-contain" />
                            <div>
                                <div className="font-bold text-lg leading-tight">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden md:flex items-center gap-6">
                            <a href="#services" className="text-sm font-semibold hover:text-[#cc0000] transition-colors">Leistungen</a>
                            <a href="#reviews" className="text-sm font-semibold hover:text-[#cc0000] transition-colors">Bewertungen</a>
                            <a href="#contact" className="bg-[#cc0000] text-white px-5 py-2 rounded text-sm font-bold hover:bg-[#aa0000] transition-colors">Kontakt</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="bg-white">
                <div className="max-w-6xl mx-auto px-4 py-16 md:py-24">
                    <div className="grid md:grid-cols-2 gap-12 items-center">
                        <div>
                            <div className="inline-block bg-red-100 text-[#cc0000] px-3 py-1 rounded-full text-xs font-bold uppercase mb-6">
                                Bosch Service Meisterbetrieb
                            </div>
                            <h1 className="text-4xl md:text-6xl font-bold leading-tight mb-6">
                                {CONFIG.hero.title}
                            </h1>
                            <p className="text-xl text-gray-600 mb-4 font-medium">{CONFIG.hero.subtitle}</p>
                            <p className="text-gray-600 mb-8 leading-relaxed">{CONFIG.hero.desc}</p>

                            <div className="flex flex-col sm:flex-row gap-4 mb-12">
                                <a href="#contact" className="bg-[#cc0000] text-white px-8 py-4 rounded-lg font-bold text-center hover:bg-[#aa0000] transition-colors">
                                    Termin vereinbaren
                                </a>
                                <a href={`tel:${CONFIG.contact.phone}`} className="border-2 border-gray-300 px-8 py-4 rounded-lg font-bold text-center hover:border-[#cc0000] hover:text-[#cc0000] transition-colors">
                                    {CONFIG.contact.phone}
                                </a>
                            </div>

                            {/* Trust Indicators */}
                            <div className="flex gap-8 pt-8 border-t border-gray-200">
                                <div>
                                    <div className="text-2xl font-bold text-[#cc0000]">Bosch</div>
                                    <div className="text-sm text-gray-600">Servicepartner</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#cc0000]">100%</div>
                                    <div className="text-sm text-gray-600">Meisterqualität</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#cc0000]">Fair</div>
                                    <div className="text-sm text-gray-600">Festpreise</div>
                                </div>
                            </div>
                        </div>

                        <div className="relative">
                            <div className="rounded-2xl overflow-hidden simple-shadow">
                                <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Werkstatt" />
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-20 bg-gray-50">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl md:text-5xl font-bold mb-4">Unsere Leistungen</h2>
                        <p className="text-gray-600 text-lg">Transparente Preise, ehrliche Beratung</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-white rounded-xl overflow-hidden simple-shadow simple-card">
                                <div className="h-40 overflow-hidden">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                </div>
                                <div className="p-6">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="material-symbols-outlined text-[#cc0000] text-3xl">{service.icon}</span>
                                        <h3 className="text-xl font-bold">{service.title}</h3>
                                    </div>
                                    <p className="text-gray-600 mb-4">{service.desc}</p>
                                    <div className="text-[#cc0000] font-bold text-lg">{service.price}</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Additional Services */}
                    <div className="mt-12 grid md:grid-cols-2 gap-4">
                        {["Achsvermessung", "Autoglas & Steinschlagreparatur", "Klimaservice", "Anhängerreparatur"].map((s, i) => (
                            <div key={i} className="bg-white rounded-xl p-4 simple-shadow flex items-center gap-3">
                                <span className="material-symbols-outlined text-[#cc0000]">check_circle</span>
                                <span className="font-semibold">{s}</span>
                            </div>
                        ))}
                    </div>

                    {/* Additional Info */}
                    <div className="mt-16 bg-white rounded-2xl p-8 simple-shadow">
                        <div className="grid md:grid-cols-3 gap-8 text-center">
                            <div>
                                <span className="material-symbols-outlined text-[#cc0000] text-4xl mb-3">verified</span>
                                <h4 className="font-bold mb-2">Bosch Servicepartner</h4>
                                <p className="text-sm text-gray-600">Zertifizierte Qualität</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-[#cc0000] text-4xl mb-3">schedule</span>
                                <h4 className="font-bold mb-2">Schneller Service</h4>
                                <p className="text-sm text-gray-600">Kurze Wartezeiten</p>
                            </div>
                            <div>
                                <span className="material-symbols-outlined text-[#cc0000] text-4xl mb-3">euro</span>
                                <h4 className="font-bold mb-2">Faire Preise</h4>
                                <p className="text-sm text-gray-600">Keine versteckten Kosten</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Reviews = () => (
            <section id="reviews" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row items-center justify-between mb-12 gap-8">
                        <div>
                            <h2 className="text-3xl md:text-5xl font-bold mb-4">Das sagen unsere Kunden</h2>
                            <p className="text-gray-600 text-lg">Vertrauen ist die Basis unserer Arbeit</p>
                        </div>
                        <div className="bg-gray-50 p-6 rounded-2xl flex items-center gap-6 border border-gray-100 simple-shadow">
                            <div className="text-center">
                                <div className="text-4xl font-bold text-gray-900">{CONFIG.reviews.rating}</div>
                                <div className="flex text-yellow-400">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined fill-1">star</span>
                                    ))}
                                </div>
                            </div>
                            <div className="h-12 w-px bg-gray-200"></div>
                            <div>
                                <div className="font-bold text-gray-900">Google Bewertung</div>
                                <div className="text-sm text-gray-500">{CONFIG.reviews.total} Rezensionen</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        {CONFIG.reviews.list.map((review, i) => (
                            <div key={i} className="bg-gray-50 p-8 rounded-xl border border-gray-100 simple-card">
                                <div className="flex gap-1 text-yellow-400 mb-4">
                                    {[...Array(review.stars)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined text-sm fill-1">star</span>
                                    ))}
                                </div>
                                <p className="text-gray-700 mb-6 italic">"{review.text}"</p>
                                <div>
                                    <div className="font-bold text-gray-900">{review.name}</div>
                                    <div className="text-xs text-gray-500">{review.date} via Google</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="text-center mt-12">
                        <a href="#" className="inline-flex items-center gap-2 text-[#cc0000] font-bold hover:underline">
                            Alle Bewertungen auf Google lesen
                            <span className="material-symbols-outlined">open_in_new</span>
                        </a>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="bg-[#cc0000] text-white rounded-2xl p-6 sm:p-12 md:p-16">
                        <div className="grid md:grid-cols-2 gap-8 md:gap-12">
                            <div>
                                <h2 className="text-3xl md:text-5xl font-bold mb-4 md:mb-6">Wir sind für Sie da!</h2>
                                <p className="text-lg md:text-xl mb-6 md:mb-8 text-red-100">Rufen Sie uns an oder kommen Sie direkt vorbei. Wir freuen uns auf Sie!</p>

                                <div className="space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-red-100 font-bold uppercase tracking-wider mb-1">Telefon</div>
                                            <div className="text-xl md:text-2xl font-bold tracking-tight">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">email</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-red-100 font-bold uppercase tracking-wider mb-1">E-Mail</div>
                                            <div className="text-base font-bold">{CONFIG.contact.email}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-red-100 font-bold uppercase tracking-wider mb-1">Adresse</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-red-100 font-bold uppercase tracking-wider mb-1">Öffnungszeiten</div>
                                            <div className="text-base font-bold">{CONFIG.contact.hoursMoDo}<br />{CONFIG.contact.hoursFr}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center justify-center mt-8 md:mt-0">
                                <div className="bg-white/10 backdrop-blur-sm rounded-2xl p-6 md:p-8 text-center w-full">
                                    <span className="material-symbols-outlined text-5xl md:text-6xl mb-4">handshake</span>
                                    <h3 className="text-xl md:text-2xl font-bold mb-3 md:mb-4">Persönliche Beratung</h3>
                                    <p className="text-red-100 mb-6 text-sm md:text-base">Kommen Sie vorbei und lassen Sie sich unverbindlich beraten.</p>
                                    <a href={`https://maps.google.com/?q=${encodeURIComponent(CONFIG.contact.address)}`} target="_blank" className="inline-block w-full sm:w-auto bg-white text-[#cc0000] px-8 py-3 rounded-lg font-bold hover:bg-red-50 transition-colors">
                                        Anfahrt anzeigen
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-12 bg-gray-100 border-t border-gray-200">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-3">
                            <img src="images/Logo.png" alt="Lenke KFZ-Technik" className="h-14 w-auto grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
                            <div className="text-sm">
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-gray-500 text-xs">© 2026 Alle Rechte vorbehalten</div>
                            </div>
                        </div>
                        <div className="flex gap-6 text-sm text-gray-600">
                            <a href="#" className="hover:text-[#cc0000] transition-colors">Impressum</a>
                            <a href="#" className="hover:text-[#cc0000] transition-colors">Datenschutz</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Reviews />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-4 left-4 right-4 md:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#cc0000] text-white flex justify-between items-center p-4 rounded-xl shadow-lg">
                        <div>
                            <div className="text-xs text-red-200">Jetzt anrufen</div>
                            <div className="font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <span className="material-symbols-outlined text-3xl">call</span>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
