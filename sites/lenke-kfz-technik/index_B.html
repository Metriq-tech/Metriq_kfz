<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lenke KFZ-Technik | Bosch Service Hamburg-Harburg</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary: #cc0000;
            --bg-dark: #0a0a0f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .gradient-overlay {
            background: linear-gradient(135deg, rgba(204, 0, 0, 0.9) 0%, rgba(180, 30, 30, 0.7) 100%);
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(204, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-shadow-strong {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>

<body>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full shadow-2xl text-white hover:bg-white hover:text-black transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "Lenke KFZ-Technik e.K.",
                shortName: "LKT",
                tagline: "Bosch Service | Hamburg-Harburg",
                primaryColor: "#cc0000"
            },
            hero: {
                title: "Qualität trifft Erfahrung.",
                subtitle: "Ihr Bosch Service Partner in Hamburg-Harburg",
                desc: "Professionelle Werkstatt mit modernster Bosch-Diagnosetechnik und fairen Preisen. Traditionelle Handwerkskunst kombiniert mit modernster Technologie.",
                image: "images/Vor_ort.jpg"
            },
            services: [
                {
                    title: "Inspektion",
                    icon: "verified",
                    desc: "Umfassende Fahrzeugprüfung nach Herstellervorgaben mit modernster Bosch-Diagnosetechnik.",
                    image: "../../images/mocks/Inspektion1.avif"
                },
                {
                    title: "Fahrzeugdiagnose",
                    icon: "analytics",
                    desc: "Präzise Fehleranalyse und Auslese mit professionellen Bosch-Diagnosesystemen.",
                    image: "../../images/mocks/diagnose.avif"
                },
                {
                    title: "Reifenservice",
                    icon: "tire_repair",
                    desc: "Professioneller Reifenwechsel, Wuchten und sichere Einlagerung.",
                    image: "../../images/mocks/reifenwechsel.avif"
                },
                {
                    title: "Unfallservice",
                    icon: "car_repair",
                    desc: "Fachgerechte Unfallreparatur und Karosseriearbeiten aus einer Hand.",
                    image: "../../images/mocks/karosseriebau.avif"
                }
            ],
            brands: ["Achsvermessung", "Autoglas", "Klimaservice", "Anhängerreparatur", "Steinschlag", "Alle Marken"],
            contact: {
                phone: "040-7661480",
                email: "info@bosch-lenke.de",
                address: "Großmoorbogen 11, 21079 Hamburg",
                hours: "Mo–Do: 7:45–17:00 Uhr"
            },
            reviews: {
                rating: 4.8,
                total: 112,
                list: [
                    { name: "Klaus M.", date: "Vor 1 Woche", text: "Bosch-Qualität zum fairen Preis. Schnell, ehrlich und kompetent. Mein Stammwerkstatt!", stars: 5 },
                    { name: "Sabine R.", date: "Vor 3 Wochen", text: "Modernste Diagnosetechnik in Hamburg-Harburg. Die Fehleranalyse war präzise und der Preis absolut fair.", stars: 5 },
                    { name: "Peter H.", date: "Vor 2 Monaten", text: "Kompetentes Team und erstklassige Beratung. Absolute Empfehlung für alle KFZ-Probleme!", stars: 5 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-[#0a0a0f]/95 backdrop-blur-xl py-4 border-b border-white/5' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 lg:px-10 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <div className="relative flex items-center justify-center">
                                <div className="absolute inset-0 bg-white rounded-full blur-xl opacity-25 scale-110"></div>
                                <img src="images/Logo.png" alt="Lenke KFZ-Technik Logo" className="relative h-[86px] w-auto object-contain" />
                            </div>
                            <div className="hidden md:block">
                                <div className="text-lg font-bold tracking-tight">{CONFIG.company.name}</div>
                                <div className="text-[10px] text-gray-400 uppercase tracking-wider">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden lg:flex items-center gap-10 text-sm font-semibold">
                            <a href="#services" className="hover:text-[#cc0000] transition-colors">Leistungen</a>
                            <a href="#reviews" className="hover:text-[#cc0000] transition-colors">Bewertungen</a>
                            <a href="#contact" className="bg-[#cc0000] px-6 py-3 rounded-xl hover:bg-[#aa0000] transition-all">Termin buchen</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-center overflow-hidden">
                {/* Background Image */}
                <div className="absolute inset-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Hero" />
                    <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                </div>

                {/* Content */}
                <div className="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 py-32">
                    <div className="max-w-3xl">
                        <div className="inline-block bg-[#cc0000]/20 border border-[#cc0000]/30 backdrop-blur-sm px-4 py-2 rounded-full text-red-400 text-xs font-bold uppercase tracking-widest mb-8 animate-fade-in-up">
                            Bosch Service Meisterbetrieb Hamburg
                        </div>

                        <h1 className="text-6xl md:text-8xl font-black leading-[1.1] tracking-tight mb-6 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                            {CONFIG.hero.title}
                        </h1>

                        <p className="text-xl md:text-2xl text-gray-200 font-medium mb-4 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                            {CONFIG.hero.subtitle}
                        </p>

                        <p className="text-lg text-gray-300 max-w-2xl mb-12 leading-relaxed animate-fade-in-up" style={{ animationDelay: '0.3s' }}>
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-col sm:flex-row gap-5 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
                            <a href="#contact" className="bg-[#cc0000] text-white px-10 py-5 rounded-2xl font-bold text-center shadow-xl shadow-red-600/30 hover:bg-[#aa0000] hover:scale-105 transition-all">
                                Jetzt Termin vereinbaren
                            </a>
                            <a href="#services" className="bg-white/10 backdrop-blur-md border border-white/20 text-white px-10 py-5 rounded-2xl font-bold text-center hover:bg-white/20 transition-all">
                                Unsere Leistungen
                            </a>
                        </div>

                        {/* Trust Badges */}
                        <div className="flex flex-wrap gap-8 mt-16 pt-8 border-t border-white/10 animate-fade-in-up" style={{ animationDelay: '0.5s' }}>
                            <div>
                                <div className="text-3xl font-black text-[#cc0000]">Bosch</div>
                                <div className="text-sm text-gray-400 font-medium">Servicepartner</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#cc0000]">4.8</div>
                                <div className="text-sm text-gray-400 font-medium">Google Bewertung</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#cc0000]">112+</div>
                                <div className="text-sm text-gray-400 font-medium">Zufriedene Kunden</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-32 bg-gradient-to-b from-[#0a0a0f] to-[#0f0f1a]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    {/* Section Header */}
                    <div className="text-center mb-20">
                        <div className="inline-block bg-[#cc0000]/10 border border-[#cc0000]/20 px-4 py-2 rounded-full text-red-400 text-xs font-bold uppercase tracking-widest mb-6">
                            Unsere Expertise
                        </div>
                        <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">
                            Premium <span className="text-[#cc0000]">Services</span>
                        </h2>
                        <p className="text-xl text-gray-400 max-w-3xl mx-auto">
                            Modernste Bosch-Technik trifft auf handwerkliche Präzision. Wir bieten Ihnen erstklassigen Service für alle gängigen Fahrzeugmarken.
                        </p>
                    </div>

                    {/* Services Grid */}
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl overflow-hidden card-hover">
                                <div className="h-56 overflow-hidden relative">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-14 h-14 bg-[#cc0000]/10 border border-[#cc0000]/20 rounded-2xl flex items-center justify-center text-[#cc0000] mb-6">
                                        <span className="material-symbols-outlined text-3xl">{service.icon}</span>
                                    </div>
                                    <h3 className="text-2xl font-bold mb-4">{service.title}</h3>
                                    <p className="text-gray-400 leading-relaxed">{service.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Additional Services Bar */}
                    <div className="mt-24 pt-16 border-t border-white/5">
                        <div className="text-center mb-12">
                            <p className="text-sm text-gray-500 uppercase tracking-widest font-bold">Weitere Leistungen</p>
                        </div>
                        <div className="flex flex-wrap justify-center gap-8 text-gray-600 font-bold text-lg">
                            {CONFIG.brands.map((brand, i) => (
                                <div key={i} className="px-6 py-3 bg-white/5 rounded-xl border border-white/5 hover:border-[#cc0000]/30 hover:text-[#cc0000] transition-all">
                                    {brand}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Reviews = () => (
            <section id="reviews" className="py-32 bg-[#0d0d16]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col lg:flex-row items-center justify-between mb-20 gap-10">
                        <div className="text-center lg:text-left">
                            <div className="inline-block bg-[#cc0000]/10 border border-[#cc0000]/20 px-4 py-2 rounded-full text-red-400 text-xs font-bold uppercase tracking-widest mb-6">
                                Kundenstimmen
                            </div>
                            <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">Was Kunden <span className="text-[#cc0000]">sagen</span></h2>
                            <p className="text-xl text-gray-400">Exzellenz, die man fühlen kann</p>
                        </div>

                        <div className="bg-gray-900/50 backdrop-blur-xl border border-white/5 p-8 rounded-[2rem] flex items-center gap-8 shadow-2xl">
                            <div className="text-center">
                                <div className="text-5xl font-black text-white mb-2">{CONFIG.reviews.rating}</div>
                                <div className="flex text-[#cc0000]">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined fill-1">star</span>
                                    ))}
                                </div>
                            </div>
                            <div className="h-16 w-px bg-white/10"></div>
                            <div>
                                <div className="text-lg font-bold text-white mb-1">Google Rezensionen</div>
                                <div className="text-[#cc0000] font-medium">{CONFIG.reviews.total} Bewertungen</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
                        {CONFIG.reviews.list.map((review, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 p-10 rounded-3xl card-hover">
                                <div className="flex gap-1 text-[#cc0000] mb-6">
                                    {[...Array(review.stars)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined text-sm fill-1">star</span>
                                    ))}
                                </div>
                                <p className="text-gray-300 mb-8 italic text-lg leading-relaxed">"{review.text}"</p>
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-[#cc0000]/20 rounded-full flex items-center justify-center text-[#cc0000] font-bold">
                                        {review.name.charAt(0)}
                                    </div>
                                    <div>
                                        <div className="font-bold text-white">{review.name}</div>
                                        <div className="text-xs text-gray-500 uppercase tracking-widest font-bold">{review.date}</div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-16 text-center">
                        <a href="#" className="inline-flex items-center gap-3 bg-white/5 hover:bg-white/10 border border-white/10 px-8 py-4 rounded-2xl text-white font-bold transition-all">
                            Alle Bewertungen lesen
                            <span className="material-symbols-outlined text-[#cc0000]">open_in_new</span>
                        </a>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-32 bg-[#0a0a0f]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="bg-gradient-to-br from-[#cc0000] to-[#aa0000] rounded-3xl md:rounded-[3rem] overflow-hidden relative">
                        {/* Background Pattern */}
                        <div className="absolute inset-0 opacity-10">
                            <div className="absolute inset-0" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '40px 40px' }}></div>
                        </div>

                        <div className="relative z-10 grid lg:grid-cols-2 gap-8 md:gap-16 p-6 sm:p-12 md:p-16 lg:p-20">
                            {/* Left: CTA */}
                            <div className="flex flex-col justify-center text-center lg:text-left">
                                <h2 className="text-4xl sm:text-5xl md:text-7xl font-black mb-6 md:mb-8 leading-tight">
                                    Bereit für<br />erstklassigen<br />Service?
                                </h2>
                                <p className="text-lg md:text-xl text-red-100 mb-10 md:mb-12 leading-relaxed">
                                    Vereinbaren Sie noch heute einen Termin und erleben Sie den Unterschied von professionellem Bosch-KFZ-Service.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 md:gap-5 mb-8 lg:mb-0">
                                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-white text-[#cc0000] px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-gray-100 transition-all shadow-xl">
                                        Jetzt anrufen
                                    </a>
                                    <a href={`mailto:${CONFIG.contact.email}`} className="bg-[#aa0000] text-white px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-[#880000] transition-all">
                                        E-Mail schreiben
                                    </a>
                                </div>
                            </div>

                            {/* Right: Contact Info */}
                            <div className="flex flex-col justify-center space-y-4 md:space-y-8">
                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-red-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Telefon</div>
                                            <div className="text-xl md:text-2xl font-bold tracking-tight">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-red-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Adresse</div>
                                            <div className="text-lg md:text-xl font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-red-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Öffnungszeiten</div>
                                            <div className="text-base md:text-lg font-bold">Mo–Do: 7:45–17:00 Uhr<br />Fr: 7:45–15:00 Uhr</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-20 bg-[#0a0a0f] border-t border-white/5">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                        <div className="flex items-center gap-3">
                            <img src="images/Logo.png" alt="Lenke KFZ-Technik" className="h-[52px] w-auto grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300" />
                            <div>
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </div>
                        <div className="flex gap-8 text-sm text-gray-500">
                            <a href="#" className="hover:text-[#cc0000] transition-colors">Impressum</a>
                            <a href="#" className="hover:text-[#cc0000] transition-colors">Datenschutz</a>
                            <a href="#" className="hover:text-[#cc0000] transition-colors">AGB</a>
                        </div>
                    </div>
                    <div className="mt-12 pt-8 border-t border-white/5 text-center text-sm text-gray-600">
                        © 2026 {CONFIG.company.name}. Alle Rechte vorbehalten.
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <Reviews />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-6 left-6 right-6 lg:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#cc0000] text-white flex justify-between items-center p-5 rounded-2xl shadow-2xl shadow-red-600/40">
                        <div>
                            <div className="text-xs text-red-200 font-bold uppercase tracking-wider">Direkt anrufen</div>
                            <div className="text-lg font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <div className="bg-white/20 p-3 rounded-xl">
                            <span className="material-symbols-outlined text-2xl">call</span>
                        </div>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
