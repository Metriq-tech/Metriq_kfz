<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AJR Autocompany | Precision KFZ-Service Hamburg</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React (Production) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

    <style>
        :root {
            --neon-primary: #f5c400;
            --neon-secondary: #1a2f4a;
            --bg-ultra-dark: #000000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-ultra-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .font-display { font-family: 'Orbitron', sans-serif; }

        @keyframes cinematicZoom {
            0% { transform: scale(1.3); opacity: 0; filter: blur(20px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }

        .cinematic-hero { animation: cinematicZoom 3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @media (max-width: 1023px) {
            .cinematic-hero { animation: none; opacity: 1; transform: none; filter: none; }
        }

        .neon-glow { box-shadow: 0 0 20px var(--neon-primary), 0 0 40px var(--neon-primary), 0 0 60px var(--neon-primary); }
        .neon-text { color: var(--neon-primary); }
        .neon-border { border: 2px solid var(--neon-primary); box-shadow: 0 0 15px var(--neon-primary), inset 0 0 15px rgba(245, 196, 0, 0.1); }

        .ultra-card {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .ultra-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.6s;
            pointer-events: none;
        }

        .ultra-card:hover::before { opacity: 1; }
        .ultra-card:hover { transform: translateY(-12px) scale(1.02); box-shadow: 0 30px 60px -15px rgba(245, 196, 0, 0.4); }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .floating { animation: float 6s ease-in-out infinite; }

        @media (max-width: 1023px) { .floating { display: none; } }

        @keyframes textReveal {
            0% { opacity: 0; transform: translateY(50px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .reveal-text { animation: textReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger-1 { animation-delay: 0.2s; opacity: 0; }
        .stagger-2 { animation-delay: 0.4s; opacity: 0; }
        .stagger-3 { animation-delay: 0.6s; opacity: 0; }

        .glass-ultra {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(245, 196, 0, 0.1);
        }

        @media (max-width: 1023px) {
            .glass-ultra { backdrop-filter: none; background: rgba(0, 0, 0, 0.75); }
        }

        .grid-pattern {
            background-image:
                linear-gradient(rgba(245, 196, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 196, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .scanline {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(transparent, var(--neon-primary), transparent);
            opacity: 0.3;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }

        @media (min-width: 1024px) { .scanline { display: block; } }

        .material-symbols-rounded {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em; height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 { font-variation-settings: 'FILL' 1; }

        @keyframes scroll-brands {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .brand-track {
            display: flex;
            width: max-content;
            animation: scroll-brands 30s linear infinite;
        }

        .brand-track:hover { animation-play-state: paused; }

        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .faq-answer.open { max-height: 200px; }
    </style>
</head>

<body>
    <div class="scanline"></div>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[10001] flex items-center justify-center w-12 h-12 bg-white/10 backdrop-blur-xl border border-white/20 rounded-xl shadow-2xl text-white hover:bg-[#1a3c6e] hover:border-[#1a3c6e] transition-all duration-500 group overflow-hidden"
        title="Zurück zum Dashboard">
        <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
        <span class="material-symbols-rounded text-2xl relative z-10 group-hover:-translate-x-1 transition-transform">arrow_back</span>
    </a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "AJR AUTOCOMPANY",
                shortName: "AJR",
                tagline: "MEISTERBETRIEB · KÜS-PRÜFSTELLE · HAMBURG",
                primaryColor: "#00e5ff"
            },
            hero: {
                title: "PRECISION",
                subtitle: "MEETS SERVICE",
                desc: "Vollservice-Werkstatt mit eigener KÜS-Prüfstelle für HU & AU. Meisterqualität für alle Marken – täglich in Hamburg-Mitte.",
                image: "../../images/mocks/Porsche1.avif"
            },
            services: [
                {
                    title: "HU / AU PRÜFUNG",
                    icon: "verified",
                    desc: "Eigene KÜS-Prüfstelle im Haus. Mo–Fr täglich 09:30–17:00 Uhr nach Vereinbarung.",
                    image: "../../images/mocks/tuev.png"
                },
                {
                    title: "3D-ACHSVERMESSUNG",
                    icon: "straighten",
                    desc: "Modernste 3D-Messtechnik für präzise Fahrwerksgeometrie. Auch samstags buchbar.",
                    image: "../../images/mocks/klimaanlage1.avif"
                },
                {
                    title: "KLIMASERVICE",
                    icon: "ac_unit",
                    desc: "R134A und R-1234YF Klimaservice. Auch samstags von 10:00–13:00 Uhr.",
                    image: "../../images/mocks/achsenvermessung.avif"
                },
                {
                    title: "KFZ-GUTACHTEN",
                    icon: "description",
                    desc: "Wertgutachten und Schadengutachten für Kfz, Lkw, Wohnmobile und Motorräder.",
                    image: "../../images/mocks/diagnose.avif"
                }
            ],
            metrics: [
                { val: "KÜS", label: "EIGENE PRÜFSTELLE" },
                { val: "4.8★", label: "GOOGLE RATING" },
                { val: "ALLE", label: "FAHRZEUGMARKEN" }
            ],
            contact: {
                phone: "+49 40 76621550",
                email: "info@autocompany-werkstatt.de",
                address: "Großmannstr. 177, 20539 Hamburg"
            },
            reviews: {
                rating: 4.8,
                total: 112,
                list: [
                    { name: "MARKUS R.", date: "VOR 1 WOCHE", text: "HU direkt vor Ort – schnell, transparent und faire Preise. Beste Werkstatt in Hamburg-Mitte!", stars: 5 },
                    { name: "SELIN K.", date: "VOR 3 WOCHEN", text: "Klimaservice auch samstags – perfekt für Berufstätige. Team äußerst kompetent.", stars: 5 },
                    { name: "ANDREAS M.", date: "VOR 2 MONATEN", text: "Kostenvoranschlag exakt eingehalten. Ehrliche Beratung – absolut vertrauenswürdig!", stars: 5 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-[100] transition-all duration-700 ${scrolled ? 'py-3 glass-ultra' : 'py-6 bg-transparent'}`}>
                    <div className="max-w-screen-2xl mx-auto px-8 lg:px-12 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-4 hover:opacity-80 transition-all duration-300 group">
                            <div className="w-[143px] h-[143px] flex items-center justify-center overflow-hidden group-hover:scale-105 transition-transform" style={{filter: 'drop-shadow(0 0 12px rgba(255,255,255,0.6)) drop-shadow(0 0 4px rgba(255,255,255,0.9))'}}>
                            <img src="logo.png" alt={CONFIG.company.shortName} className="w-full h-full object-contain" />
                        </div>
                            <div className="hidden md:block">
                                <div className="font-display font-black text-xl tracking-wider neon-text">{CONFIG.company.name}</div>
                                <div className="text-[8px] text-white/70 uppercase tracking-[0.3em] font-bold">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="flex items-center gap-12">
                            <div className="hidden lg:flex gap-10 text-[9px] font-black uppercase tracking-[0.25em] text-white">
                                <a href="#services" className="hover:text-[#f5c400] transition-colors">SERVICES</a>
                                <a href="#contact" className="hover:text-[#f5c400] transition-colors">CONTACT</a>
                            </div>
                            <button className="neon-border bg-black text-[#f5c400] font-display font-black text-[9px] px-8 py-4 uppercase tracking-[0.25em] hover:bg-[#f5c400] hover:text-black transition-all duration-300">
                                TERMIN BUCHEN
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-[100dvh] flex items-center lg:items-end overflow-hidden grid-pattern">
                <div className="absolute inset-0 z-0 text-center">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover cinematic-hero" alt="AJR Autocompany" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-black/60 via-transparent to-transparent hidden lg:block"></div>
                    <div className="absolute inset-0 bg-black/50 lg:hidden"></div>
                </div>

                <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-[#f5c400] rounded-full blur-[150px] opacity-20 floating"></div>
                <div className="absolute bottom-1/4 left-1/4 w-96 h-96 bg-[#1a3c6e] rounded-full blur-[150px] opacity-20 floating" style={{ animationDelay: '3s' }}></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-6 sm:px-8 lg:px-12 pt-32 sm:pt-40 pb-12 sm:pb-24 w-full">
                    <div className="max-w-5xl text-center lg:text-left">
                        <h1 className="font-display font-black text-3xl sm:text-5xl md:text-7xl lg:text-8xl xl:text-[10rem] leading-[1.1] lg:leading-[0.85] tracking-tighter mb-6 lg:mb-8 reveal-text">
                            {CONFIG.hero.title}
                            <br className="hidden lg:block" />
                            <span className="neon-text italic flex flex-col lg:flex-row items-center gap-2 lg:gap-12 mt-2 lg:mt-0">
                                <span className="h-[2px] lg:h-[3px] w-20 lg:w-60 bg-gradient-to-r from-[#f5c400] to-transparent hidden lg:block"></span>
                                <span className="text-2xl sm:text-3xl md:text-6xl lg:text-inherit whitespace-nowrap">{CONFIG.hero.subtitle}</span>
                            </span>
                        </h1>

                        <p className="text-lg sm:text-xl md:text-3xl text-gray-300 font-light max-w-3xl mb-10 sm:mb-16 leading-relaxed reveal-text stagger-1 mx-auto lg:mx-0 px-4 lg:px-0">
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-wrap justify-center lg:justify-start gap-8 sm:gap-12 lg:gap-16 pt-8 sm:pt-12 border-t border-white/10 reveal-text stagger-2 overflow-hidden">
                            {CONFIG.metrics.map((m, i) => (
                                <div key={i} className="text-center lg:text-left min-w-[100px]">
                                    <div className="font-display text-3xl sm:text-4xl lg:text-5xl font-black neon-text mb-1 lg:mb-2">{m.val}</div>
                                    <div className="text-[8px] sm:text-[9px] uppercase font-black tracking-[0.3em] text-gray-600">{m.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute inset-0 grid-pattern opacity-30"></div>

                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-32 gap-12">
                        <div className="max-w-3xl">
                            <div className="inline-block neon-border bg-black px-4 py-2 rounded-full text-[#f5c400] text-[9px] font-black uppercase tracking-[0.3em] mb-8">
                                PREMIUM SERVICES
                            </div>
                            <h2 className="font-display text-4xl sm:text-6xl md:text-9xl font-black tracking-tighter uppercase mb-6">
                                BEYOND<br />
                                <span className="neon-text italic">STANDARD</span>
                            </h2>
                        </div>
                        <div className="text-gray-400 text-lg max-w-md font-light leading-relaxed">
                            Jeder Service wird mit höchster Fachkompetenz durchgeführt – von der Pflichtuntersuchung bis zum Präzisionsgutachten.
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((s, i) => (
                            <div key={i} className="ultra-card glass-ultra rounded-2xl overflow-hidden group cursor-default">
                                <div className="h-64 overflow-hidden relative">
                                    <img src={s.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={s.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-16 h-16 neon-border rounded-xl flex items-center justify-center text-[#f5c400] mb-8 group-hover:neon-glow transition-all duration-500">
                                        <span className="material-symbols-rounded text-4xl">{s.icon}</span>
                                    </div>
                                    <h3 className="font-display text-xl font-black mb-6 uppercase tracking-tight">{s.title}</h3>
                                    <p className="text-gray-400 text-sm font-light leading-relaxed">{s.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Full Service List */}
                    <div className="mt-16 glass-ultra neon-border rounded-2xl p-10">
                        <p className="text-[9px] font-black uppercase tracking-[0.3em] text-gray-600 mb-8 text-center">FULL SERVICE PORTFOLIO</p>
                        <div className="grid md:grid-cols-3 gap-4">
                            {["Inspektion & Reparatur", "Ölwechsel", "Reifenwechsel & -service", "Fahrzeugelektrik & Elektronik", "Karosserieschäden (Steinschlag, Kratzer)", "Standheizung", "HU-Erinnerungsservice per E-Mail", "Wertgutachten & Schadengutachten", "Online-Terminbuchung"].map((s, i) => (
                                <div key={i} className="flex items-center gap-3 text-sm text-gray-400">
                                    <span className="text-[#f5c400] text-base material-symbols-rounded">check_circle</span>
                                    {s}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const BRANDS = ["AlphaRomeo", "Audi", "BMW", "Chevrolet", "Chrysler", "Citroen", "Dacia", "Daewoo", "Daihatsu", "Fiat", "Ford", "Honda", "Hyundai", "Jaguar", "Jeep", "Kia", "LandRover", "Mazda", "Mercedes", "Mini", "Mitsubishi", "Nissan", "Opel", "Peugeot", "Porsche", "Renault", "Seat", "Skoda", "Smart", "Suzuki", "Toyota", "VW", "Volvo"];

        const BrandCarousel = () => (
            <section className="py-24 bg-black border-t-2 border-[#f5c400]/10 overflow-hidden relative">
                <div className="absolute inset-0 grid-pattern opacity-20"></div>
                <div className="relative z-10 max-w-screen-2xl mx-auto px-8 mb-12 text-center">
                    <p className="text-[9px] font-black uppercase tracking-[0.4em] text-gray-600">VEHICLES WE SERVICE</p>
                </div>
                <div className="relative z-10" style={{ maskImage: 'linear-gradient(to right, transparent, black 10%, black 90%, transparent)', WebkitMaskImage: 'linear-gradient(to right, transparent, black 10%, black 90%, transparent)' }}>
                    <div className="brand-track">
                        {[...BRANDS, ...BRANDS].map((b, i) => (
                            <div key={i} className="flex-shrink-0 mx-4 md:mx-8 w-14 h-10 md:w-24 md:h-16 flex items-center justify-center grayscale hover:grayscale-0 opacity-20 hover:opacity-100 transition-all duration-500 filter invert">
                                <img src={`../../images/Auto-Marken/${b}.png`} alt={b} className="max-w-full max-h-full object-contain" title={b} />
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const FAQ = () => {
            const [open, setOpen] = React.useState(null);
            const faqs = [
                { q: "KANN ICH DIE HU DIREKT BEI EUCH MACHEN?", a: "Ja! Wir haben eine eigene KÜS-Prüfstelle im Haus. HU- und AU-Termine sind Mo–Fr 09:30–17:00 Uhr täglich nach Vereinbarung möglich – einfach anrufen." },
                { q: "IST DER KLIMASERVICE AUCH SAMSTAGS MÖGLICH?", a: "Ja, Klimaservice (R134A und R-1234YF) ist samstags 10:00–13:00 Uhr verfügbar. Die 3D-Achsvermessung ist ebenfalls samstags buchbar." },
                { q: "WELCHE FAHRZEUGMARKEN REPARIEREN SIE?", a: "Wir sind Meisterbetrieb für alle gängigen Marken – von VW, BMW und Mercedes über Audi, Ford und Opel bis hin zu asiatischen und amerikanischen Herstellern." },
                { q: "ERHALTE ICH EINEN KOSTENVORANSCHLAG?", a: "Selbstverständlich. Wir erstellen immer einen transparenten Kostenvoranschlag und beginnen erst nach Ihrer ausdrücklichen Zustimmung mit den Arbeiten." }
            ];
            return (
                <section className="py-40 bg-black relative overflow-hidden">
                    <div className="absolute inset-0 grid-pattern opacity-10"></div>
                    <div className="relative z-10 max-w-screen-2xl mx-auto px-8 lg:px-12">
                        <div className="text-center mb-24">
                            <div className="inline-block neon-border bg-black px-4 py-2 rounded-full text-[#f5c400] text-[9px] font-black uppercase tracking-[0.3em] mb-8">SYSTEM FAQ</div>
                            <h2 className="font-display text-5xl md:text-7xl lg:text-9xl font-black tracking-tighter uppercase mb-6">
                                YOUR<br /><span className="neon-text italic">QUESTIONS</span>
                            </h2>
                        </div>
                        <div className="max-w-3xl mx-auto space-y-3">
                            {faqs.map((faq, i) => (
                                <div key={i} className="ultra-card glass-ultra rounded-2xl overflow-hidden">
                                    <button onClick={() => setOpen(open === i ? null : i)} className="w-full flex justify-between items-center p-5 md:p-8 text-left hover:bg-white/5 transition-all">
                                        <span className="font-display font-black text-xs md:text-sm text-white pr-3 tracking-tight">{faq.q}</span>
                                        <span className={`material-symbols-rounded text-[#f5c400] flex-shrink-0 transition-transform duration-300 text-2xl md:text-3xl ${open === i ? 'rotate-180' : ''}`}>expand_more</span>
                                    </button>
                                    <div className={`faq-answer ${open === i ? 'open' : ''}`}>
                                        <p className="px-5 pb-5 md:px-8 md:pb-8 text-sm text-gray-400 font-light leading-relaxed">{faq.a}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Reviews = () => (
            <section id="reviews" className="py-40 bg-black relative overflow-hidden">
                <div className="absolute inset-0 grid-pattern opacity-10"></div>
                <div className="max-w-screen-2xl mx-auto px-8 lg:px-12 relative z-10">
                    <div className="flex flex-col lg:flex-row items-center justify-between mb-32 gap-16">
                        <div className="max-w-2xl">
                            <div className="inline-block neon-border bg-black px-4 py-2 rounded-full text-[#f5c400] text-[9px] font-black uppercase tracking-[0.3em] mb-8">KUNDENSTIMMEN</div>
                            <h2 className="font-display text-6xl md:text-9xl font-black tracking-tighter uppercase mb-6">
                                CLIENT<br /><span className="neon-text italic">REPORTS</span>
                            </h2>
                        </div>

                        <div className="glass-ultra neon-border p-5 lg:p-10 rounded-3xl group hover:neon-glow transition-all duration-700 w-full lg:w-auto">
                            <div className="flex items-center justify-center lg:justify-start gap-4 lg:gap-10">
                                <div className="text-center">
                                    <div className="font-display text-4xl lg:text-7xl font-black neon-text mb-1 lg:mb-2">{CONFIG.reviews.rating}</div>
                                    <div className="flex text-[#f5c400] gap-1 justify-center">
                                        {[...Array(5)].map((_, i) => (
                                            <span key={i} className="material-symbols-rounded fill-1 text-base lg:text-2xl">star</span>
                                        ))}
                                    </div>
                                </div>
                                <div className="h-16 lg:h-24 w-[2px] bg-gradient-to-b from-transparent via-[#f5c400] to-transparent opacity-30"></div>
                                <div>
                                    <div className="font-display text-sm lg:text-xl font-black mb-1 lg:mb-2 tracking-wider">VERIFIED STATUS</div>
                                    <div className="text-[8px] lg:text-[10px] text-gray-500 uppercase tracking-[0.3em] font-bold">
                                        {CONFIG.reviews.total} GOOGLE REVIEWS
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
