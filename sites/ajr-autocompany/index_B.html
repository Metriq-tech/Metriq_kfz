<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Autocompany Meisterbetrieb AJR | Premium KFZ-Service Hamburg</title>

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary: #1a2f4a;
            --bg-dark: #0a0a0f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(26, 60, 110, 0.4);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-shadow-strong {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }

        @keyframes scroll-brands {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .brand-track {
            display: flex;
            width: max-content;
            animation: scroll-brands 30s linear infinite;
        }

        .brand-track:hover {
            animation-play-state: paused;
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .faq-answer.open {
            max-height: 200px;
        }
    </style>
</head>

<body>
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full shadow-2xl text-white hover:bg-white hover:text-black transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "AJR Autocompany Meisterbetrieb",
                shortName: "AJR",
                tagline: "Vollservice · KÜS-Prüfstelle · Hamburg-Mitte",
                primaryColor: "#1a3c6e"
            },
            hero: {
                title: "Qualität trifft Zuverlässigkeit.",
                subtitle: "Ihr Meisterbetrieb mit eigener KÜS-Prüfstelle",
                desc: "Vollständiger KFZ-Service unter einem Dach – von der HU über Klimaservice bis zu Kfz-Gutachten. Für alle Marken, mit fairen Preisen und Meisterqualität.",
                image: "../../images/mocks/Werkstatt2.jpg"
            },
            services: [
                {
                    title: "HU / AU Prüfung",
                    icon: "verified",
                    desc: "Eigene KÜS-Prüfstelle. Termine täglich Mo–Fr 09:30–17:00 Uhr nach Vereinbarung.",
                    image: "../../images/mocks/tuev.png"
                },
                {
                    title: "Klimaservice",
                    icon: "ac_unit",
                    desc: "R134A und R-1234YF. Auch samstags von 10:00–13:00 Uhr verfügbar.",
                    image: "../../images/mocks/klimaanlage1.avif"
                },
                {
                    title: "3D-Achsvermessung",
                    icon: "straighten",
                    desc: "Präzise Vermessung mit modernster 3D-Technik. Auch samstags buchbar.",
                    image: "../../images/mocks/achsenvermessung.avif"
                },
                {
                    title: "Kfz-Gutachten",
                    icon: "description",
                    desc: "Wertgutachten, Schadengutachten für Kfz, Lkw, Wohnmobile und Motorräder.",
                    image: "../../images/mocks/diagnose.avif"
                }
            ],
            contact: {
                phone: "+49 40 76621550",
                email: "info@autocompany-werkstatt.de",
                address: "Großmannstr. 177, 20539 Hamburg",
                hours1: "Mo–Fr: 09:30–19:00 Uhr",
                hours2: "Sa: 10:00–14:00 Uhr"
            },
            reviews: {
                rating: 4.8,
                total: 112,
                list: [
                    { name: "Markus R.", date: "Vor 1 Woche", text: "HU direkt vor Ort – schnell, sauber, faire Preise. Absolut empfehlenswert!", stars: 5 },
                    { name: "Selin K.", date: "Vor 3 Wochen", text: "Klimaservice samstags – perfekt für Berufstätige. Team super freundlich.", stars: 5 },
                    { name: "Andreas M.", date: "Vor 2 Monaten", text: "Ehrliche Beratung, Kostenvoranschlag exakt eingehalten. Vertrauen verdient!", stars: 5 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-[#0a0a0f]/95 backdrop-blur-xl py-4 border-b border-white/5' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 lg:px-10 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <div className="w-[112px] h-[112px] flex items-center justify-center overflow-hidden" style={{ filter: 'drop-shadow(0 0 12px rgba(255,255,255,0.6)) drop-shadow(0 0 4px rgba(255,255,255,0.9))' }}>
                                <img src="logo.png" alt={CONFIG.company.shortName} className="w-full h-full object-contain" />
                            </div>
                            <div className="hidden md:block">
                                <div className="text-lg font-bold tracking-tight">{CONFIG.company.name}</div>
                                <div className="text-[10px] text-gray-400 uppercase tracking-wider">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden lg:flex items-center gap-10 text-sm font-semibold">
                            <a href="#services" className="hover:text-blue-400 transition-colors">Leistungen</a>
                            <a href="#contact" className="bg-[#f5c400] text-[#1a2f4a] px-6 py-3 rounded-xl hover:bg-yellow-300 transition-all font-bold">Termin buchen</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative min-h-screen flex items-center overflow-hidden">
                <div className="absolute inset-0">
                    <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Hero" />
                    <div className="absolute inset-0 bg-black/60 md:hidden"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent hidden md:block"></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                </div>

                <div className="relative z-10 max-w-7xl mx-auto px-6 lg:px-10 pt-44 pb-16 md:py-32">
                    <div className="max-w-3xl">
                        <div className="inline-block bg-[#f5c400]/20 border border-[#f5c400]/40 backdrop-blur-sm px-4 py-2 rounded-full text-[#f5c400] text-xs font-bold uppercase tracking-widest mb-8 animate-fade-in-up">
                            Meisterbetrieb · KÜS-Prüfstelle Hamburg
                        </div>

                        <h1 className="text-3xl sm:text-5xl md:text-8xl font-black leading-[1.1] tracking-tight mb-6 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                            {CONFIG.hero.title}
                        </h1>

                        <p className="text-xl md:text-2xl text-gray-200 font-medium mb-4 text-shadow-strong animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                            {CONFIG.hero.subtitle}
                        </p>

                        <p className="text-lg text-gray-300 max-w-2xl mb-12 leading-relaxed animate-fade-in-up" style={{ animationDelay: '0.3s' }}>
                            {CONFIG.hero.desc}
                        </p>

                        <div className="flex flex-col sm:flex-row gap-5 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
                            <a href="#contact" className="bg-[#f5c400] text-[#1a2f4a] px-10 py-5 rounded-2xl font-bold text-center shadow-xl shadow-yellow-900/30 hover:bg-yellow-300 hover:scale-105 transition-all">
                                Jetzt Termin vereinbaren
                            </a>
                            <a href="#services" className="bg-white/10 backdrop-blur-md border border-white/20 text-white px-10 py-5 rounded-2xl font-bold text-center hover:bg-white/20 transition-all">
                                Unsere Leistungen
                            </a>
                        </div>

                        <div className="flex flex-wrap gap-8 mt-16 pt-8 border-t border-white/10 animate-fade-in-up" style={{ animationDelay: '0.5s' }}>
                            <div>
                                <div className="text-3xl font-black text-[#f5c400]">KÜS</div>
                                <div className="text-sm text-gray-400 font-medium">Eigene Prüfstelle</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#f5c400]">4.8★</div>
                                <div className="text-sm text-gray-400 font-medium">Google Bewertung</div>
                            </div>
                            <div>
                                <div className="text-3xl font-black text-[#f5c400]">Alle</div>
                                <div className="text-sm text-gray-400 font-medium">Fahrzeugmarken</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        const Services = () => (
            <section id="services" className="py-32 bg-gradient-to-b from-[#0a0a0f] to-[#0f0f1a]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="text-center mb-20">
                        <div className="inline-block bg-blue-600/10 border border-blue-500/20 px-4 py-2 rounded-full text-blue-400 text-xs font-bold uppercase tracking-widest mb-6">
                            Unsere Expertise
                        </div>
                        <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">
                            Unser <span className="text-blue-500">Service</span>
                        </h2>
                        <p className="text-xl text-gray-400 max-w-3xl mx-auto">
                            Vollständige KFZ-Betreuung aus einer Hand – von der Hauptuntersuchung bis zum Gutachten.
                        </p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl overflow-hidden card-hover">
                                <div className="h-56 overflow-hidden relative">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                                </div>
                                <div className="p-8">
                                    <div className="w-14 h-14 bg-[#f5c400]/10 border border-[#f5c400]/30 rounded-2xl flex items-center justify-center text-[#f5c400] mb-6">
                                        <span className="material-symbols-outlined text-3xl">{service.icon}</span>
                                    </div>
                                    <h3 className="text-2xl font-bold mb-4">{service.title}</h3>
                                    <p className="text-gray-400 leading-relaxed">{service.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Additional Services */}
                    <div className="mt-16 bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl p-10">
                        <h3 className="text-2xl font-bold text-center mb-8 text-white">Weitere Leistungen</h3>
                        <div className="grid md:grid-cols-3 gap-4">
                            {["Inspektion & Reparatur", "Ölwechsel", "Reifenwechsel & -service", "Fahrzeugelektrik & Elektronik", "Karosserieschäden (Steinschlag, Kratzer)", "Standheizung", "HU-Erinnerungsservice per E-Mail", "Wertgutachten", "Online-Terminbuchung"].map((s, i) => (
                                <div key={i} className="flex items-center gap-2 text-sm text-gray-400">
                                    <span className="material-symbols-outlined text-[#f5c400] text-base">check_circle</span>
                                    {s}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const BRANDS = ["AlphaRomeo", "Audi", "BMW", "Chevrolet", "Chrysler", "Citroen", "Dacia", "Daewoo", "Daihatsu", "Fiat", "Ford", "Honda", "Hyundai", "Jaguar", "Jeep", "Kia", "LandRover", "Mazda", "Mercedes", "Mini", "Mitsubishi", "Nissan", "Opel", "Peugeot", "Porsche", "Renault", "Seat", "Skoda", "Smart", "Suzuki", "Toyota", "VW", "Volvo"];

        const BrandCarousel = () => (
            <section className="py-20 bg-[#0f0f1a] border-t border-white/5 overflow-hidden">
                <div className="max-w-7xl mx-auto px-6 mb-10 text-center">
                    <p className="text-[10px] font-black uppercase tracking-[0.3em] text-gray-600">Wir arbeiten mit allen Marken</p>
                </div>
                <div style={{ maskImage: 'linear-gradient(to right, transparent, black 10%, black 90%, transparent)', WebkitMaskImage: 'linear-gradient(to right, transparent, black 10%, black 90%, transparent)' }}>
                    <div className="brand-track">
                        {[...BRANDS, ...BRANDS].map((b, i) => (
                            <div key={i} className="flex-shrink-0 mx-3 md:mx-6 w-12 h-9 md:w-20 md:h-14 flex items-center justify-center grayscale hover:grayscale-0 opacity-30 hover:opacity-100 transition-all duration-300 filter invert">
                                <img src={`../../images/Auto-Marken/${b}.png`} alt={b} className="max-w-full max-h-full object-contain" title={b} />
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const FAQ = () => {
            const [open, setOpen] = React.useState(null);
            const faqs = [
                { q: "Kann ich die HU direkt bei euch machen?", a: "Ja! Wir haben eine eigene KÜS-Prüfstelle im Haus. Termine sind Mo–Fr von 09:30–17:00 Uhr täglich nach Vereinbarung möglich." },
                { q: "Ist der Klimaservice auch samstags möglich?", a: "Ja, Klimaservice (R134A und R-1234YF) ist samstags von 10:00–13:00 Uhr verfügbar. Auch die 3D-Achsvermessung ist samstags buchbar." },
                { q: "Welche Fahrzeugmarken reparieren Sie?", a: "Wir sind Meisterbetrieb für alle gängigen Marken – von VW, BMW und Mercedes über Audi, Ford und Opel bis hin zu asiatischen Herstellern." },
                { q: "Erhalte ich einen Kostenvoranschlag vor der Reparatur?", a: "Selbstverständlich. Wir erstellen immer einen transparenten Kostenvoranschlag und beginnen erst nach Ihrer ausdrücklichen Zustimmung mit den Arbeiten." }
            ];
            return (
                <section className="py-32 bg-[#0a0a0f]">
                    <div className="max-w-3xl mx-auto px-6">
                        <div className="text-center mb-16">
                            <div className="inline-block bg-blue-600/10 border border-blue-500/20 px-4 py-2 rounded-full text-blue-400 text-xs font-bold uppercase tracking-widest mb-6">FAQ</div>
                            <h2 className="text-4xl md:text-5xl lg:text-7xl font-black tracking-tight mb-6">Häufige <span className="text-blue-500">Fragen</span></h2>
                            <p className="text-xl text-gray-400">Antworten auf Ihre wichtigsten Fragen</p>
                        </div>
                        <div className="space-y-3">
                            {faqs.map((faq, i) => (
                                <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-3xl overflow-hidden">
                                    <button onClick={() => setOpen(open === i ? null : i)} className="w-full flex justify-between items-center p-5 md:p-8 text-left hover:bg-white/5 transition-colors">
                                        <span className="font-bold text-white text-sm md:text-base pr-3">{faq.q}</span>
                                        <span className={`material-symbols-outlined text-[#f5c400] flex-shrink-0 transition-transform duration-300 ${open === i ? 'rotate-180' : ''}`}>expand_more</span>
                                    </button>
                                    <div className={`faq-answer ${open === i ? 'open' : ''}`}>
                                        <p className="px-5 pb-5 md:px-8 md:pb-8 text-sm md:text-base text-gray-400 leading-relaxed">{faq.a}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Reviews = () => (
            <section id="reviews" className="py-32 bg-[#0d0d16]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="flex flex-col lg:flex-row items-center justify-between mb-20 gap-10">
                        <div className="text-center lg:text-left">
                            <div className="inline-block bg-blue-600/10 border border-blue-500/20 px-4 py-2 rounded-full text-blue-400 text-xs font-bold uppercase tracking-widest mb-6">Kundenstimmen</div>
                            <h2 className="text-5xl md:text-7xl font-black tracking-tight mb-6">Was Kunden <span className="text-blue-500">sagen</span></h2>
                            <p className="text-xl text-gray-400">Vertrauen, das man verdienen muss</p>
                        </div>
                        <div className="bg-gray-900/50 backdrop-blur-xl border border-white/5 p-8 rounded-[2rem] flex items-center gap-8 shadow-2xl">
                            <div className="text-center">
                                <div className="text-5xl font-black text-white mb-2">{CONFIG.reviews.rating}</div>
                                <div className="flex text-[#f5c400]">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined fill-1">star</span>
                                    ))}
                                </div>
                            </div>
                            <div className="h-16 w-px bg-white/10"></div>

                                <div className="text-[#f5c400] font-medium">{CONFIG.reviews.total} Bewertungen</div>

                    </div>

                        {CONFIG.reviews.list.map((review, i) => (
                            <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 p-10 rounded-3xl card-hover">
                                <div className="flex gap-1 text-[#f5c400] mb-6">
                                    {[...Array(review.stars)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined text-sm fill-1">star</span>
                                    ))}

                                <p className="text-gray-300 mb-8 italic text-lg leading-relaxed">"{review.text}"</p>
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-[#f5c400]/20 rounded-full flex items-center justify-center text-[#f5c400] font-bold">

                                    </div>
                                    <div>
                                        <div className="font-bold text-white">{review.name}</div>
                                        <div className="text-xs text-gray-500 uppercase tracking-widest font-bold">{review.date}</div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-32 bg-[#0a0a0f]">
                <div className="max-w-7xl mx-auto px-6 lg:px-10">
                    <div className="bg-gradient-to-br from-[#1a2f4a] to-[#0d1f35] rounded-3xl md:rounded-[3rem] overflow-hidden relative border border-[#f5c400]/10">
                        <div className="absolute inset-0 opacity-10">
                            <div className="absolute inset-0" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '40px 40px' }}></div>
                        </div>

                        <div className="relative z-10 grid lg:grid-cols-2 gap-8 md:gap-16 p-6 sm:p-12 md:p-16 lg:p-20">
                            <div className="flex flex-col justify-center text-center lg:text-left">
                                <h2 className="text-4xl sm:text-5xl md:text-7xl font-black mb-6 md:mb-8 leading-tight">
                                    Bereit für<br />erstklassigen<br />Service?
                                </h2>
                                <p className="text-lg md:text-xl text-blue-100 mb-10 md:mb-12 leading-relaxed">
                                    Vereinbaren Sie noch heute einen Termin und erleben Sie den Unterschied professionellen KFZ-Services.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 md:gap-5 mb-8 lg:mb-0">
                                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#f5c400] text-[#1a2f4a] px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-yellow-300 transition-all shadow-xl">
                                        Jetzt anrufen
                                    </a>
                                    <a href={`mailto:${CONFIG.contact.email}`} className="bg-blue-800 text-white px-8 md:px-10 py-4 md:py-5 rounded-2xl font-bold text-center hover:bg-blue-900 transition-all">
                                        E-Mail schreiben
                                    </a>
                                </div>
                            </div>

                            <div className="flex flex-col justify-center space-y-4 md:space-y-8">
                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-blue-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Telefon</div>

                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-sm border border-white/20 p-6 md:p-8 rounded-3xl">
                                    <div className="flex items-center gap-4 md:gap-6">
                                        <div className="w-10 h-10 md:w-14 md:h-14 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-xs text-blue-200 font-bold uppercase tracking-wider mb-1 md:mb-2">Adresse</div>
