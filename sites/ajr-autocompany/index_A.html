<!DOCTYPE html>
<html class="light" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Autocompany Meisterbetrieb AJR | Ihr KFZ-Profi in Hamburg</title>

    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
        rel="stylesheet">

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --primary: #1a2f4a;
            --bg-light: #f9fafb;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .simple-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .simple-card {
            transition: transform 0.2s ease;
        }

        .simple-card:hover {
            transform: translateY(-4px);
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            width: 1em;
            height: 1em;
            line-height: 1;
            vertical-align: middle;
            font-display: block;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }

        /* Brand Carousel */
        @keyframes scroll-brands {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .brand-track {
            display: flex;
            width: max-content;
            animation: scroll-brands 30s linear infinite;
        }

        .brand-track:hover {
            animation-play-state: paused;
        }

        /* FAQ Accordion */
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
        }

        .faq-answer.open {
            max-height: 200px;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <!-- Back to Dashboard -->
    <a href="preview.html"
        class="fixed top-4 left-4 z-[100] flex items-center justify-center w-10 h-10 bg-white/80 backdrop-blur-md border border-gray-200 rounded-full shadow-lg text-[#1a3c6e] hover:bg-[#1a3c6e] hover:text-white transition-all duration-300"
        title="Zurück zum Dashboard">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        const CONFIG = {
            company: {
                name: "AJR Autocompany Meisterbetrieb",
                shortName: "AJR",
                tagline: "Ihr zuverlässiger KFZ-Meisterbetrieb in Hamburg",
                primaryColor: "#1a3c6e"
            },
            hero: {
                title: "Faire Preise. Meisterqualität.",
                subtitle: "KFZ-Meisterbetrieb in Hamburg-Mitte",
                desc: "Vollservice-Werkstatt mit eigenem KÜS-Prüfbereich für HU & AU. Täglich nach Vereinbarung – ehrlich, kompetent und faire Preise. Wir reparieren alle Marken.",
                image: "../../images/mocks/werkstatt3.jpg"
            },
            services: [
                { title: "HU / TÜV", icon: "verified", desc: "Eigener KÜS-Prüfbereich, täglich Mo–Fr 09:30–17:00 Uhr", image: "../../images/mocks/tuev.png" },
                { title: "Klimaservice", icon: "ac_unit", desc: "R134A und R-1234YF – auch samstags 10:00–13:00 Uhr", image: "../../images/mocks/klimaanlage1.avif" },
                { title: "3D-Achsvermessung", icon: "straighten", desc: "Präzise Achsvermessung, auch samstags verfügbar", image: "../../images/mocks/achsenvermessung.avif" },
                { title: "Gutachten", icon: "description", desc: "Kfz-, Lkw-, Wohn­mobil- und Motorrad-Gutachten", image: "../../images/mocks/diagnose.avif" }
            ],
            contact: {
                phone: "+49 40 76621550",
                email: "info@autocompany-werkstatt.de",
                address: "Großmannstr. 177, 20539 Hamburg",
                hours1: "Mo–Fr: 09:30–19:00 Uhr",
                hours2: "Sa: 10:00–14:00 Uhr"
            },
            reviews: {
                rating: 4.8,
                total: 112,
                list: [
                    { name: "Markus R.", date: "Vor 1 Woche", text: "Super Service! HU direkt vor Ort erledigt – schnell, günstig und transparent. Komme definitiv wieder.", stars: 5 },
                    { name: "Selin K.", date: "Vor 3 Wochen", text: "Klimaservice auch samstags – das ist wirklich praktisch. Team sehr freundlich und kompetent.", stars: 5 },
                    { name: "Andreas M.", date: "Vor 2 Monaten", text: "Ehrliche Beratung, faire Preise. Der Kostenvoranschlag wurde exakt eingehalten. Sehr empfehlenswert!", stars: 5 }
                ]
            }
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`sticky top-0 z-50 bg-white transition-all duration-300 ${scrolled ? 'shadow-md' : ''}`}>
                    <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-3 hover:opacity-80 transition-opacity">
                            <div className="w-[150px] h-[150px] flex items-center justify-center overflow-hidden">
                                <img src="logo.png" alt={CONFIG.company.shortName} className="w-full h-full object-contain" />
                            </div>
                            <div>
                                <div className="font-bold text-lg leading-tight">{CONFIG.company.name}</div>
                                <div className="text-xs text-gray-500">{CONFIG.company.tagline}</div>
                            </div>
                        </a>
                        <div className="hidden md:flex items-center gap-6">
                            <a href="#services" className="text-sm font-semibold hover:text-[#1a2f4a] transition-colors">Leistungen</a>
                            <a href="#contact" className="bg-[#1a2f4a] px-6 py-3 rounded-xl text-white hover:bg-[#f5c400] hover:text-[#1a2f4a] transition-all font-bold">Termin buchen</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="bg-white">
                <div className="max-w-6xl mx-auto px-4 py-16 md:py-24">
                    <div className="grid md:grid-cols-2 gap-12 items-center">
                        <div>
                            <div className="inline-block bg-[#f5c400]/10 border border-[#f5c400]/30 px-4 py-2 rounded-full text-[#1a2f4a] text-xs font-black uppercase tracking-widest mb-6">
                                Meisterbetrieb · KÜS-Prüfstelle
                            </div>
                            <h1 className="text-4xl md:text-6xl font-bold leading-tight mb-6">
                                {CONFIG.hero.title}
                            </h1>
                            <p className="text-xl text-gray-600 mb-4 font-medium">{CONFIG.hero.subtitle}</p>
                            <p className="text-gray-600 mb-8 leading-relaxed">{CONFIG.hero.desc}</p>

                            <div className="flex flex-col sm:flex-row gap-4 mb-12">
                                <a href="#contact" className="bg-[#1a2f4a] text-white px-8 py-4 rounded-xl font-bold hover:bg-[#f5c400] hover:text-[#1a2f4a] transition-all shadow-lg">
                                    Jetzt Termin buchen
                                </a>
                                <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#f5c400] text-[#1a2f4a] px-8 py-4 rounded-xl font-bold hover:bg-yellow-300 transition-all">
                                    {CONFIG.contact.phone}
                                </a>
                            </div>

                            {/* Trust Indicators */}
                            <div className="flex gap-8 pt-8 border-t border-gray-200">
                                <div>
                                    <div className="text-2xl font-bold text-[#1a2f4a]">KÜS</div>
                                    <div className="text-sm text-gray-600">Eigene Prüfstelle</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#1a2f4a]">100%</div>
                                    <div className="text-sm text-gray-600">Meisterqualität</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-[#1a2f4a]">Fair</div>
                                    <div className="text-sm text-gray-600">Festpreise</div>
                                </div>
                            </div>
                        </div>

                        <div className="relative">
                            <div className="rounded-2xl overflow-hidden simple-shadow">
                                <img src={CONFIG.hero.image} className="w-full h-full object-cover" alt="Werkstatt" />
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Services = () => (
            <section id="services" className="py-20 bg-gray-50">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="text-center mb-16">
                        <h2 className="text-3xl md:text-5xl font-bold mb-4">Unsere Leistungen</h2>
                        <p className="text-gray-600 text-lg">Alles aus einer Hand – transparent und fair</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {CONFIG.services.map((service, i) => (
                            <div key={i} className="bg-white rounded-xl overflow-hidden simple-shadow simple-card">
                                <div className="h-40 overflow-hidden">
                                    <img src={service.image} className="w-full h-full object-cover" alt={service.title} />
                                </div>
                                <div className="p-6">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="material-symbols-outlined text-[#1a2f4a] text-3xl">{service.icon}</span>
                                        <h3 className="text-xl font-bold">{service.title}</h3>
                                    </div>
                                    <p className="text-gray-600 mb-4">{service.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Additional Services List */}
                    <div className="mt-16 bg-white rounded-2xl p-8 simple-shadow">
                        <h3 className="text-xl font-bold mb-6 text-center">Weitere Leistungen</h3>
                        <div className="grid md:grid-cols-3 gap-4">
                            {["Inspektion & Reparatur", "Ölwechsel", "Reifenwechsel & -service", "Fahrzeugelektrik & Elektronik", "Karosserieschäden (Steinschlag, Kratzer)", "Standheizung", "HU-Erinnerungsservice per E-Mail", "Schadengutachten", "Online-Terminbuchung"].map((s, i) => (
                                <div key={i} className="flex items-center gap-2 text-sm text-gray-700">
                                    <span className="material-symbols-outlined text-[#1a2f4a] text-base">check_circle</span>
                                    {s}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const BRANDS = ["AlphaRomeo", "Audi", "BMW", "Chevrolet", "Chrysler", "Citroen", "Dacia", "Daewoo", "Daihatsu", "Fiat", "Ford", "Honda", "Hyundai", "Jaguar", "Jeep", "Kia", "LandRover", "Mazda", "Mercedes", "Mini", "Mitsubishi", "Nissan", "Opel", "Peugeot", "Porsche", "Renault", "Seat", "Skoda", "Smart", "Suzuki", "Toyota", "VW", "Volvo"];

        const BrandCarousel = () => (
            <section className="py-16 bg-white border-t border-gray-100 overflow-hidden">
                <div className="max-w-6xl mx-auto px-4 mb-10 text-center">
                    <p className="text-xs font-bold uppercase tracking-widest text-gray-400">Wir reparieren alle Marken</p>
                </div>
                <div className="relative">
                    <div style={{ maskImage: 'linear-gradient(to right, transparent, black 10%, black 90%, transparent)', WebkitMaskImage: 'linear-gradient(to right, transparent, black 10%, black 90%, transparent)' }}>
                        <div className="brand-track">
                            {[...BRANDS, ...BRANDS].map((b, i) => (
                                <div key={i} className="flex-shrink-0 mx-3 md:mx-6 w-12 h-9 md:w-20 md:h-14 flex items-center justify-center grayscale hover:grayscale-0 opacity-50 hover:opacity-100 transition-all duration-300">
                                    <img src={`../../images/Auto-Marken/${b}.png`} alt={b} className="max-w-full max-h-full object-contain" title={b} />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );

        const FAQ = () => {
            const [open, setOpen] = React.useState(null);
            const faqs = [
                { q: "Kann ich die HU direkt bei euch machen?", a: "Ja! Wir haben eine eigene KÜS-Prüfstelle im Haus. HU- und AU-Termine sind Mo–Fr von 09:30–17:00 Uhr täglich nach Vereinbarung möglich. Einfach anrufen oder online buchen." },
                { q: "Ist der Klimaservice auch samstags möglich?", a: "Ja, wir bieten Klimaservice (R134A und R-1234YF) samstags von 10:00–13:00 Uhr an. Auch die 3D-Achsvermessung ist samstags verfügbar." },
                { q: "Was kostet ein Schadengutachten?", a: "Die Kosten für Gutachten variieren je nach Fahrzeug und Umfang. Wir erstellen Gutachten für Kfz, Lkw, Wohnmobile und Motorräder. Rufen Sie uns für ein unverbindliches Angebot an." },
                { q: "Wie funktioniert der HU-Erinnerungsservice?", a: "Wir erinnern Sie personalisiert per E-Mail an den nächsten HU-Termin, basierend auf Ihrem Kennzeichen. Einfach beim nächsten Besuch anmelden." }
            ];
            return (
                <section className="py-20 bg-gray-50">
                    <div className="max-w-3xl mx-auto px-4">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl md:text-5xl font-bold mb-4">Häufige Fragen</h2>
                            <p className="text-gray-600 text-lg">Antworten auf Ihre wichtigsten Fragen</p>
                        </div>
                        <div className="space-y-3">
                            {faqs.map((faq, i) => (
                                <div key={i} className="bg-white rounded-xl simple-shadow overflow-hidden">
                                    <button onClick={() => setOpen(open === i ? null : i)} className="w-full flex justify-between items-center p-4 md:p-6 text-left hover:bg-gray-50 transition-colors">
                                        <span className="font-bold text-gray-900 text-sm md:text-base pr-3">{faq.q}</span>
                                        <span className={`material-symbols-outlined text-[#1a2f4a] flex-shrink-0 transition-transform duration-300 ${open === i ? 'rotate-180' : ''}`}>expand_more</span>
                                    </button>
                                    <div className={`faq-answer ${open === i ? 'open' : ''}`}>
                                        <p className="px-4 pb-4 md:px-6 md:pb-6 text-sm md:text-base text-gray-600 leading-relaxed">{faq.a}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Reviews = () => (
            <section id="reviews" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row items-center justify-between mb-12 gap-8">
                        <div>
                            <h2 className="text-3xl md:text-5xl font-bold mb-4">Das sagen unsere Kunden</h2>
                            <p className="text-gray-600 text-lg">Vertrauen ist die Basis unserer Arbeit</p>
                        </div>
                        <div className="bg-gray-50 p-6 rounded-2xl flex items-center gap-6 border border-gray-100 simple-shadow">
                            <div className="text-center">
                                <div className="text-5xl font-black text-[#1a2f4a] mb-2">{CONFIG.reviews.rating}</div>
                                <div className="flex text-[#f5c400]">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined fill-1">star</span>
                                    ))}
                                </div>
                            </div>
                            <div className="h-12 w-px bg-gray-200"></div>
                            <div>
                                <div className="font-bold text-gray-900">Google Bewertung</div>
                                <div className="text-[#1a2f4a] font-medium">{CONFIG.reviews.total} Bewertungen</div>
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        {CONFIG.reviews.list.map((review, i) => (
                            <div key={i} className="bg-white border border-gray-100 p-8 rounded-2xl shadow-sm hover:shadow-lg hover:border-[#f5c400]/30 transition-all">
                                <div className="flex gap-1 text-[#f5c400] mb-4">
                                    {[...Array(review.stars)].map((_, i) => (
                                        <span key={i} className="material-symbols-outlined text-sm fill-1">star</span>
                                    ))}
                                </div>
                                <p className="text-gray-700 mb-6 italic">"{review.text}"</p>
                                <div>
                                    <div className="font-bold text-gray-900">{review.name}</div>
                                    <div className="text-xs text-gray-500">{review.date} via Google</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-20 bg-white">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="bg-[#1a2f4a] text-white rounded-3xl p-12 md:p-16 text-center relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-[#f5c400]/10 rounded-full -translate-y-1/2 translate-x-1/2 opacity-50"></div>
                        <div className="absolute bottom-0 left-0 w-48 h-48 bg-[#1a2f4a]/10 rounded-full translate-y-1/2 -translate-x-1/2 opacity-50"></div>
                        <div className="grid md:grid-cols-2 gap-8 md:gap-12 text-left relative z-10">
                            <div>
                                <h2 className="text-3xl md:text-5xl font-bold mb-4 md:mb-6">Wir sind für Sie da!</h2>
                                <p className="text-lg md:text-xl mb-6 md:mb-8 text-blue-100">Rufen Sie uns an oder kommen Sie direkt vorbei. Wir freuen uns auf Sie!</p>

                                <div className="space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-xl md:text-2xl">call</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-blue-100 font-bold uppercase tracking-wider mb-1">Telefon</div>
                                            <div className="text-xl md:text-2xl font-bold tracking-tight">{CONFIG.contact.phone}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">email</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-blue-100 font-bold uppercase tracking-wider mb-1">E-Mail</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.email}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">location_on</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-blue-100 font-bold uppercase tracking-wider mb-1">Adresse</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.address}</div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined">schedule</span>
                                        </div>
                                        <div>
                                            <div className="text-[10px] md:text-sm text-blue-100 font-bold uppercase tracking-wider mb-1">Öffnungszeiten</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.hours1}</div>
                                            <div className="text-lg font-bold">{CONFIG.contact.hours2}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center justify-center mt-8 md:mt-0">
                                <div className="bg-white/10 backdrop-blur-sm rounded-2xl p-6 md:p-8 text-center w-full">
                                    <span className="material-symbols-outlined text-5xl md:text-6xl mb-4">handshake</span>
                                    <h3 className="text-xl md:text-2xl font-bold mb-3 md:mb-4">Persönliche Beratung</h3>
                                    <p className="text-blue-100 mb-6 text-sm md:text-base">Kommen Sie vorbei und lassen Sie sich unverbindlich beraten.</p>
                                    <a href={`mailto:${CONFIG.contact.email}`} className="inline-block w-full sm:w-auto bg-white text-[#1a3c6e] px-8 py-3 rounded-lg font-bold hover:bg-blue-50 transition-colors">
                                        E-Mail schreiben
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-12 bg-gray-100 border-t border-gray-200">
                <div className="max-w-6xl mx-auto px-4">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="flex items-center gap-3">
                            <div className="w-[156px] h-[156px] flex items-center justify-center overflow-hidden grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300 cursor-pointer">
                                <img src="logo.png" alt={CONFIG.company.shortName} className="w-full h-full object-contain" />
                            </div>
                            <div className="text-sm">
                                <div className="font-bold">{CONFIG.company.name}</div>
                                <div className="text-gray-500 text-xs">© 2026 Alle Rechte vorbehalten</div>
                            </div>
                        </div>
                        <div className="flex gap-6 text-sm text-gray-600">
                            <a href="#" className="hover:text-[#1a3c6e] transition-colors">Impressum</a>
                            <a href="#" className="hover:text-[#1a3c6e] transition-colors">Datenschutz</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Services />
                <BrandCarousel />
                <FAQ />
                <Reviews />
                <Contact />
                <Footer />

                {/* Mobile CTA */}
                <div className="fixed bottom-4 left-4 right-4 md:hidden z-50">
                    <a href={`tel:${CONFIG.contact.phone}`} className="bg-[#1a3c6e] text-white flex justify-between items-center p-4 rounded-xl shadow-lg">
                        <div>
                            <div className="text-xs text-blue-200">Jetzt anrufen</div>
                            <div className="font-bold">{CONFIG.contact.phone}</div>
                        </div>
                        <span className="material-symbols-outlined text-3xl">call</span>
                    </a>
                </div>
            </div>
        );

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
